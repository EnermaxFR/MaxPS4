name: MaxPS4
options:
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CLANG_CXX_LANGUAGE_STANDARD: 'c++17'
    ARCHS: arm64
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) MAXPS4_FEX_APP'
    SWIFT_OBJC_BRIDGING_HEADER: Native/MaxPS4-Bridging-Header.h
    LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/Frameworks'
targets:
  MaxPS4:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes: [PlayableDemo]
      - path: Resources/PlayableDemo
        type: folder
      - path: Native/PM4MetalDrawBridge.mm
      - path: Native/PS4PKGBridge.cpp
      - path: Native/OrbisAnalysisBridge.cpp
      - path: Native/OrbisLinkerBridge.cpp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enermaxfr.maxps4.orbistest
        PRODUCT_NAME: MaxPS4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MaxPS4 Orbis Test
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '0.3.0'
        CURRENT_PROJECT_VERSION: '2000001'
    dependencies:
      - sdk: GameController.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - framework: ../build/frameworks/MaxPS4FEXRuntime.framework
        embed: true
        codeSign: false
    scheme:
      gatherCoverageData: false
