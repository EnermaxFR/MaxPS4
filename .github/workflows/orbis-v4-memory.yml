name: Orbis V4 isolated memory checks
on:
  workflow_dispatch:
  push:
    branches: ['integration/orbis-v4-safe-staging', 'experiment/orbis-m2-memory-translation', 'integration/orbis-v4-implementation']
    paths:
      - 'MaxPS4-iOS/Native/maxps4_guest_*'
      - 'MaxPS4-iOS/Native/maxps4_ps4_*'
      - 'MaxPS4-iOS/Native/Orbis*.hpp'
      - 'MaxPS4-iOS/Native/PS4*.hpp'
      - 'MaxPS4-iOS/Native/maxps4_orbis_v4_*.h'
      - 'MaxPS4-iOS/Tests/OrbisV4AddressSpaceTest.cpp'
      - 'MaxPS4-iOS/Tests/OrbisV4TranslationTest.cpp'
      - 'MaxPS4-iOS/Tests/GuestDynamicTLS*.cpp'
      - 'MaxPS4-iOS/Tests/OrbisM1*'
      - 'MaxPS4-iOS/Native/maxps4_orbis_m1.h'
      - 'scripts/test-orbis-v4-memory.sh'
      - '.github/workflows/orbis-v4-memory.yml'
  pull_request:
    paths:
      - 'MaxPS4-iOS/Native/maxps4_guest_*'
      - 'MaxPS4-iOS/Native/maxps4_ps4_*'
      - 'MaxPS4-iOS/Native/Orbis*.hpp'
      - 'MaxPS4-iOS/Native/PS4*.hpp'
      - 'MaxPS4-iOS/Native/maxps4_orbis_v4_*.h'
      - 'MaxPS4-iOS/Tests/OrbisV4AddressSpaceTest.cpp'
      - 'MaxPS4-iOS/Tests/OrbisV4TranslationTest.cpp'
      - 'MaxPS4-iOS/Tests/GuestDynamicTLS*.cpp'
      - 'MaxPS4-iOS/Tests/OrbisM1*'
      - 'MaxPS4-iOS/Native/maxps4_orbis_m1.h'
      - 'scripts/test-orbis-v4-memory.sh'
      - '.github/workflows/orbis-v4-memory.yml'
concurrency:
  group: orbis-v4-memory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  retire-superseded-checks:
    if: github.event_name == 'pull_request' && github.repository == 'EnermaxFR/MaxPS4' && github.head_ref == 'integration/orbis-v4-implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = 'integration/orbis-v4-implementation';
            const current = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId
            });
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...context.repo, branch, per_page: 100
            });
            for (const run of runs) {
              if (run.id === context.runId ||
                  run.head_sha === context.payload.pull_request.head.sha ||
                  run.head_branch !== branch ||
                  run.head_repository?.full_name !== context.payload.repository.full_name ||
                  run.created_at >= current.data.created_at ||
                  !['push', 'pull_request'].includes(run.event) ||
                  !['queued', 'in_progress', 'waiting', 'requested', 'pending'].includes(run.status)) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
                core.info('Cancelled superseded run ' + run.id + ' at ' + run.head_sha);
              } catch (error) {
                if (error.status !== 409) throw error;
                core.info('Run already finished: ' + run.id);
              }
            }
  address-space:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run V4, M1 and TLS regressions with sanitizers
        run: bash scripts/test-orbis-v4-memory.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbis-v4-memory-${{ matrix.os }}
          path: build/orbis-v4/*.txt
          if-no-files-found: warn
          retention-days: 14
