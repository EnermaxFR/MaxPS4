name: Orbis V4 isolated memory checks
on:
  workflow_dispatch:
  push:
    branches: ['integration/orbis-v4-safe-staging']
    paths:
      - 'MaxPS4-iOS/Native/maxps4_guest_address_space.h'
      - 'MaxPS4-iOS/Tests/OrbisV4AddressSpaceTest.cpp'
      - '.github/workflows/orbis-v4-memory.yml'
  pull_request:
    paths:
      - 'MaxPS4-iOS/Native/maxps4_guest_address_space.h'
      - 'MaxPS4-iOS/Tests/OrbisV4AddressSpaceTest.cpp'
      - '.github/workflows/orbis-v4-memory.yml'
permissions:
  contents: read
jobs:
  address-space:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and run isolated guest address-space regression
        run: |
          mkdir -p build/orbis-v4
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -I MaxPS4-iOS/Native \
            MaxPS4-iOS/Tests/OrbisV4AddressSpaceTest.cpp \
            -o build/orbis-v4/address-space-test
          build/orbis-v4/address-space-test
