name: Trigger MaxPS4 JIT26 build

on:
  workflow_dispatch:
  push:
    branches:
      - maxps4-ios26-jit-compliance
    paths:
      - '.github/workflows/jit26-build-trigger.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch stable MaxPS4 Build 77 pipeline on JIT26 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run maxps4-build66.yml \
            --repo "${{ github.repository }}" \
            --ref maxps4-ios26-jit-compliance
