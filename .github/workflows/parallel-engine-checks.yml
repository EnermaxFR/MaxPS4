name: MaxPS4 parallel engine smoke checks
# Revalidate PR #126 after synchronizing its head with main.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "MaxPS4-iOS/**"
      - ".github/workflows/parallel-engine-checks.yml"
  push:
    branches: [main]
    paths:
      - "MaxPS4-iOS/**"
      - ".github/workflows/parallel-engine-checks.yml"

permissions:
  contents: read

jobs:
  elf-cpu-memory:
    name: Bounded ELF CPU admission and real guest memory
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test malformed ELF64, CPU budgets and kernel memory protections
        run: |
          mkdir -p build/parallel/elf
          clang++ -std=c++23 -Wall -Wextra -Werror -I MaxPS4-iOS/Native \
            MaxPS4-iOS/Native/maxps4_guest_elf.cpp \
            MaxPS4-iOS/Tests/GuestELFMemoryTest.cpp \
            -o build/parallel/elf/guest-elf-memory-test
          build/parallel/elf/guest-elf-memory-test
      - name: Run Swift CPU, ELF and memory regression suites
        run: |
          swiftc -parse-as-library \
            MaxPS4-iOS/Sources/MaxPS4GuestMemory.swift \
            MaxPS4-iOS/Sources/MaxPS4ELFLoader.swift \
            MaxPS4-iOS/Sources/MaxPS4CPUPrototype.swift \
            MaxPS4-iOS/Sources/MaxPS4SELFPrototype.swift \
            MaxPS4-iOS/Tests/PrototypeSmokeTest.swift \
            -o build/parallel/elf/swift-prototypes-test
          build/parallel/elf/swift-prototypes-test

  fex-metal-state:
    name: FEX Metal coordinate and touch isolation tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run position state tests without a JIT substitute
        run: |
          mkdir -p build/parallel/state
          swiftc -parse-as-library MaxPS4-iOS/Sources/MaxPS4GuestMemory.swift \
            MaxPS4-iOS/Sources/MaxPS4ELFLoader.swift \
            MaxPS4-iOS/Sources/MaxPS4CPUPrototype.swift \
            MaxPS4-iOS/Sources/MaxPS4SyntheticELFFEXBridge.swift \
            MaxPS4-iOS/Sources/MaxPS4FEXMetalState.swift \
            MaxPS4-iOS/Tests/FEXMetalStateTest.swift -o build/parallel/state/test
          build/parallel/state/test

  cpu-native-abi:
    name: CPU native ABI (iOS ARM64)
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual native CPU ABI
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/parallel/cpu
          xcrun --sdk iphoneos clang++ -std=c++17 \
            -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -c MaxPS4-iOS/Native/maxps4_native.cpp \
            -o build/parallel/cpu/maxps4_native.o
          xcrun nm -gU build/parallel/cpu/maxps4_native.o \
            | grep -q '_maxps4_native_aether_cpu_probe'
          echo "PASS actual native CPU ABI object; NOT a running PS4 guest CPU"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel-cpu-native-abi
          path: build/parallel/cpu
          if-no-files-found: ignore

  jit-bridge:
    name: ARM64 engine bridge compilation
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile real engine bridge and shadPS4 utility
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/parallel/jit
          for src in \
            MaxPS4-iOS/Native/shadps4/common/string_util.cpp \
            MaxPS4-iOS/Native/shadps4_bridge.cpp; do
            obj="build/parallel/jit/$(basename "$src" .cpp).o"
            xcrun --sdk iphoneos clang++ -std=c++23 \
              -target arm64-apple-ios16.0 -isysroot "$SDK" \
              -I MaxPS4-iOS/Native/shadps4 \
              -c "$src" -o "$obj"
          done
          echo "PASS engine bridge objects compile; FEXCore JIT is NOT activated"
      - name: Run ARM64 translation and interpreter regression without IPA
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++23 -I MaxPS4-iOS/Native/shadps4 \
            MaxPS4-iOS/Native/shadps4/common/string_util.cpp \
            MaxPS4-iOS/Native/shadps4_bridge.cpp \
            MaxPS4-iOS/Tests/NativeJITPipelineTest.cpp \
            -o build/parallel/jit/native-jit-test
          build/parallel/jit/native-jit-test | tee build/parallel/jit/test-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel-arm64-engine-bridge
          path: build/parallel/jit
          if-no-files-found: ignore

  ios-frontend:
    name: iOS frontend Swift typecheck
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck application sources for arm64 iOS
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/parallel/frontend
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK" -parse-as-library -typecheck \
            -import-objc-header MaxPS4-iOS/Native/PS4PKGBridge.h \
            MaxPS4-iOS/Sources/*.swift \
            2>&1 | tee build/parallel/frontend/typecheck.log
          echo "PASS Swift frontend typecheck; not an IPA or game launch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel-ios-frontend
          path: build/parallel/frontend
          if-no-files-found: ignore
