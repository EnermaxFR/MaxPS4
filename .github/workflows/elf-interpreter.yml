name: ELF execution without JIT
on:
  pull_request:
    paths:
      - 'MaxPS4-iOS/Native/maxps4_guest_elf.*'
      - 'MaxPS4-iOS/Native/maxps4_ps4_guest_memory.h'
      - 'MaxPS4-iOS/Native/maxps4_guest_range.h'
      - 'MaxPS4-iOS/Tests/PS4GuestMemoryTest.cpp'
      - 'MaxPS4-iOS/Tests/PS4StagedCPUAdmissionTest.cpp'
      - 'MaxPS4-iOS/Tests/PS4ExecutableFixture.h'
      - 'MaxPS4-iOS/Native/maxps4_fex_runtime.*'
      - 'MaxPS4-iOS/Sources/MaxPS4FEXDiagnostic*.swift'
      - 'MaxPS4-iOS/Tests/GuestELF*'
      - 'scripts/create-test-elf.py'
      - '.github/workflows/elf-interpreter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  execute:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Execute loaded ELF with memory checks
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer MaxPS4-iOS/Native/maxps4_guest_elf.cpp MaxPS4-iOS/Tests/GuestELFInterpreterTest.cpp -o /tmp/elf-execution
          /tmp/elf-execution
      - name: Verify staged PS4 guest memory adapter
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer -I MaxPS4-iOS/Native MaxPS4-iOS/Native/maxps4_guest_elf.cpp MaxPS4-iOS/Tests/PS4GuestMemoryTest.cpp -o /tmp/ps4-memory-test
          /tmp/ps4-memory-test
      - name: Verify staged CPU admission without executing FEX
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer MaxPS4-iOS/Native/maxps4_guest_elf.cpp MaxPS4-iOS/Tests/PS4StagedCPUAdmissionTest.cpp -o /tmp/ps4-cpu-admission
          /tmp/ps4-cpu-admission
      - name: Compile interpreter for iPhone ARM64
        if: runner.os == 'macOS'
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang++ -std=c++17 -Wall -Wextra -Werror -pedantic -target arm64-apple-ios18.0 -isysroot "$SDK" -c MaxPS4-iOS/Native/maxps4_guest_elf.cpp -o /tmp/elf-ios.o
      - name: Generate importable ELF (expected RAX 123)
        run: |
          python3 scripts/create-test-elf.py build/MaxPS4-test-123.elf
          /tmp/elf-execution build/MaxPS4-test-123.elf
      - uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-test-ELF-${{ runner.os }}
          path: build/MaxPS4-test-123.elf

