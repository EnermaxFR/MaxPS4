name: MaxPS4 parallel heavy engine checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "MaxPS4-iOS/**"
      - ".github/workflows/parallel-heavy-engine.yml"

permissions:
  contents: read

jobs:
  fexcore-source:
    name: FEXCore upstream ARM64 source verification
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned FEXCore source and check JIT units
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/heavy/fexcore
          git clone --quiet --no-checkout --filter=blob:none https://github.com/FEX-Emu/FEX.git build/heavy/fexcore/source
          git -C build/heavy/fexcore/source sparse-checkout init --cone
          git -C build/heavy/fexcore/source sparse-checkout set FEXCore Source CodeEmitter FEXHeaderUtils
          git -C build/heavy/fexcore/source checkout --quiet f2b679f6028ce1c38875233aecfcf5d3f8ebecec
          FEX=build/heavy/fexcore/source/FEXCore/Source/Interface/Core/JIT
          test -s "$FEX/JIT.cpp"
          test -s "$FEX/ALUOps.cpp"
          find "$FEX" -maxdepth 1 -name '*Ops.cpp' -type f | sort > build/heavy/fexcore/jit-units.txt
          test -s build/heavy/fexcore/jit-units.txt
          echo "PASS pinned FEXCore JIT sources present (not compiled or linked)"
      - name: Verify Darwin ProcessorID source adaptation without IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("build/heavy/fexcore/source/FEXCore/Source/Interface/Core/JIT/MiscOps.cpp")
          workflow = Path(".github/workflows/blank.yml").read_text()
          # Execute exactly the porting script maintained by the main workflow.
          marker = 'python3 - "$FEX/FEXCore/Source/Interface/Core/JIT/MiscOps.cpp" <<\'PY\'\n'
          assert workflow.count(marker) == 1, "ProcessorID patch missing or duplicated"
          patch = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          patch = "\n".join(line[10:] if line.startswith("          ") else line
                            for line in patch.splitlines())
          import subprocess
          result = subprocess.run(["python3", "-c", patch, str(source)],
                                  capture_output=True, text=True)
          assert result.returncode == 0, result.stdout + result.stderr
          content = source.read_text()
          assert "#if defined(__APPLE__)\n  else {" in content
          assert "LoadConstant(ARMEmitter::Size::i64Bit, GetReg(Node), 0);" in content
          assert "#elif defined(_WIN32)\n  else {" in content
          assert content.count("SYS_getcpu") == 1
          print("PASS pinned FEXCore ProcessorID Darwin patch applies")
          print("Source check only; this does not compile or execute the JIT")
          PY
      - name: Probe genuine patched FEXCore MiscOps with iOS ARM64 compiler
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          FEX="build/heavy/fexcore/source"
          GENERATED="build/heavy/fexcore/generated"
          mkdir -p "$GENERATED/FEXCore/IR" "$GENERATED/FEXCore/Config"
          # Use FEXCore's real upstream generators; no placeholder headers.
          python3 "$FEX/FEXCore/Scripts/json_ir_generator.py" \
            "$FEX/FEXCore/Source/Interface/IR/IR.json" \
            "$GENERATED/FEXCore/IR/IRDefines.inc" \
            "$GENERATED/FEXCore/IR/IRDefines_Dispatch.inc"
          python3 "$FEX/FEXCore/Scripts/config_generator.py" \
            "$FEX/FEXCore/Source/Interface/Config/Config.json.in" \
            "$GENERATED/FEXCore/Config/ConfigValues.inl" \
            "$GENERATED/fexcore-options.1" \
            "$GENERATED/ConfigArgumentLoader.inc"
          # FEXCore Config.h expects ConfigOptions.inl generated from upstream JSON.
          python3 - "$FEX/FEXCore/Source/Interface/Config/Config.json.in" "$GENERATED/FEXCore/Config/ConfigOptions.inl" <<'PY'
          import json
          import sys
          from pathlib import Path
          config = json.loads(Path(sys.argv[1]).read_text())
          lines = ["// Generated from pinned upstream FEXCore Config.json.in", "#ifdef ENUMDEFINES"]
          for group in config["Options"].values():
              for name, option in group.items():
                  if option["Type"] != "strenum":
                      continue
                  lines.extend(["enum class " + name + " : uint64_t {", "  OFF = 0,"])
                  for index, key in enumerate(option["Enums"]):
                      lines.append("  " + key.upper() + " = 1ULL << " + str(index) + ",")
                  lines.extend(["};", "FEX_DEF_NUM_OPS(" + name + ")"])
          lines.append("#endif")
          Path(sys.argv[2]).write_text("\n".join(lines) + "\n")
          PY
          test -s "$GENERATED/FEXCore/Config/ConfigOptions.inl"
          # Darwin has pthread_sigmask, not Linux rt_sigprocmask syscall.
          # Adapt only the pinned checkout for this iOS compiler probe.
          python3 - "$FEX/FEXCore/include/FEXCore/Utils/SignalScopeGuards.h" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          contents = path.read_text()
          start = contents.index("class ScopedSignalMasker final {")
          stop = contents.index("\n/**", start)
          replacement = """class ScopedSignalMasker final {
          public:
            explicit ScopedSignalMasker(uint64_t Mask) {
              sigset_t requested {};
              sigemptyset(&requested);
              for (int signal_number = 1; signal_number <= 64; ++signal_number) {
                if (Mask & (uint64_t{1} << (signal_number - 1))) {
                  sigaddset(&requested, signal_number);
                }
              }
              Active = pthread_sigmask(SIG_SETMASK, &requested, &OriginalMask) == 0;
            }
            ScopedSignalMasker(const ScopedSignalMasker&) = delete;
            ScopedSignalMasker& operator=(const ScopedSignalMasker&) = delete;
            ScopedSignalMasker(ScopedSignalMasker&& other)
              : OriginalMask(other.OriginalMask), Active(other.Active) {
              other.Active = false;
            }
            ~ScopedSignalMasker() {
              if (Active) pthread_sigmask(SIG_SETMASK, &OriginalMask, nullptr);
            }
          private:
            sigset_t OriginalMask {};
            bool Active = false;
          };
          """
          path.write_text(contents[:start] + replacement + contents[stop:])
          PY
          # iOS has no Linux futex syscall. On the pinned checkout only, use
          # C++20 atomic wait/notify for the existing 32-bit lock state.
          # Wake all on unlock to avoid starving a waiter with this full-word
          # wait; performance and runtime correctness still require testing.
          python3 - "$FEX/FEXCore/include/FEXCore/Utils/WritePriorityMutex.h" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          code = path.read_text()
          linux_includes = "#if !defined(_WIN32)\n#include <linux/futex.h>"
          assert code.count(linux_includes) == 1, "Upstream futex include changed"
          code = code.replace(linux_includes,
                              "#if !defined(_WIN32) && !defined(__APPLE__)\n#include <linux/futex.h>")
          # The original #else selects Windows headers on Apple too.
          # Match the exact upstream Windows branch following the Linux-only
          # include, preserving its inline comments and remaining guards.
          windows_header = "#else" + chr(10) + "#include <synchapi.h>"
          assert code.count(windows_header) == 1, "Pinned FEXCore Windows include changed"
          code = code.replace(
              windows_header,
              "#elif defined(_WIN32)" + chr(10) + "#include <synchapi.h>",
          )
          method_marker = "private:\n\n#if !defined(_WIN32)\n  void FutexWaitForWriteAvailable"
          assert code.count(method_marker) == 1, "Upstream futex methods changed"
          apple_methods = """private:
          
          #if defined(__APPLE__)
            void FutexWaitForWriteAvailable(uint32_t Expected) {
              std::atomic_ref<uint32_t>(Futex).wait(Expected, std::memory_order_relaxed);
            }
            void FutexWaitForReadAvailable(uint32_t Expected) {
              std::atomic_ref<uint32_t>(Futex).wait(Expected, std::memory_order_relaxed);
            }
            void FutexWakeWriter() {
              std::atomic_ref<uint32_t>(Futex).notify_all();
            }
            void FutexWakeReaders() {
              std::atomic_ref<uint32_t>(Futex).notify_all();
            }
          #elif !defined(_WIN32)
            void FutexWaitForWriteAvailable"""
          code = code.replace(method_marker, apple_methods)
          path.write_text(code)
          print("Apple WritePriorityMutex uses C++20 wait/notify, not Linux SYS_futex")
          PY
          if ! brew list --versions fmt >/dev/null 2>&1; then brew install fmt; fi
          git clone --quiet --no-checkout --filter=blob:none \
            https://github.com/martinus/unordered_dense.git build/heavy/fexcore/unordered-dense
          git -C build/heavy/fexcore/unordered-dense checkout --quiet 3234af2c03549bc85656bfd3a86993bf1cd8aef1
          SRC="$FEX/FEXCore/Source/Interface/Core/JIT/MiscOps.cpp"
          LOG="build/heavy/fexcore/miscops-ios-compile.log"
          # The preceding job step applies the exact ProcessorID Darwin patch.
          # A compiler probe, not a fake runtime simulation: missing generated
          # headers or dependencies must be reported rather than stubbed.
          if xcrun --sdk iphoneos clang++ -std=c++23 \
              -target arm64-apple-ios16.0 -isysroot "$SDK" \
              -DARCHITECTURE_arm64=1 -DMADV_HUGEPAGE=0 -DMADV_NOHUGEPAGE=0 \
              -I "$GENERATED" \
              -I "$(brew --prefix fmt)/include" \
              -I "build/heavy/fexcore/unordered-dense/include" \
              -I "$FEX/FEXCore/include" \
              -I "$FEX/FEXCore/Source" \
              -I "$FEX/Source" -I "$FEX/CodeEmitter" -I "$FEX/FEXHeaderUtils" \
              -I "MaxPS4-iOS/Native/compat/fex_ios" \
              -c "$SRC" -o build/heavy/fexcore/miscops-ios-arm64.o > "$LOG" 2>&1; then
            test -s build/heavy/fexcore/miscops-ios-arm64.o
            xcrun lipo -archs build/heavy/fexcore/miscops-ios-arm64.o | grep -qw arm64
            echo "PASS actual patched FEXCore MiscOps.cpp iOS ARM64 object compilation" | tee build/heavy/fexcore/miscops-ios-status.txt
          else
            echo "BLOCKED actual FEXCore MiscOps.cpp iOS ARM64 syntax compilation; inspect log" | tee build/heavy/fexcore/miscops-ios-status.txt
            head -60 "$LOG"
            # Keep reporting failures accurately. Previously this branch
            # ended successfully and misleadingly painted the job green.
            exit 1
          fi
      - name: Audit Linux-specific dependencies blocking iOS FEXCore port
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          root = Path("build/heavy/fexcore/source/FEXCore")
          patterns = {
              "SYS_getcpu": re.compile(r"\bSYS_getcpu\b"),
              "sys/prctl.h": re.compile(r"#\s*include\s*[<\"]sys/prctl\.h[>\"]"),
              "sys/user.h": re.compile(r"#\s*include\s*[<\"]sys/user\.h[>\"]"),
              "prctl invocation": re.compile(r"\bprctl\s*\("),
          }
          rows = []
          for path in sorted(root.rglob("*")):
              if path.suffix not in (".cpp", ".cc", ".c", ".h", ".hpp") or not path.is_file():
                  continue
              for number, line in enumerate(path.read_text(errors="replace").splitlines(), 1):
                  for category, pattern in patterns.items():
                      if pattern.search(line):
                          rows.append({"file": str(path.relative_to(root)), "line": number,
                                       "category": category, "source": line.strip()[:240]})
          out = Path("build/heavy/fexcore")
          (out / "darwin-linux-compat-audit.json").write_text(
              json.dumps({"upstream_commit": "f2b679f6028ce1c38875233aecfcf5d3f8ebecec",
                          "findings": rows}, indent=2) + "\n")
          # Ensure artifacts are machine-readable before uploading them.
          import collections
          report_path = out / "darwin-linux-compat-audit.json"
          report = json.loads(report_path.read_text())
          assert report["findings"] == rows
          summary = collections.Counter(entry["category"] for entry in rows)
          (out / "darwin-linux-compat-summary.txt").write_text(
              "FEXCore Linux dependencies for iOS porting (source inventory only)\n"
              + "\n".join(f"{category}: {count}" for category, count in sorted(summary.items()))
              + "\n"
          )
          print("Linux-to-iOS migration findings:", len(rows))
          for row in rows[:30]:
              print(f'{row["file"]}:{row["line"]}: {row["category"]}: {row["source"]}')
          print("Audit only: compiling and linking a complete FEXCore iOS backend still required")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heavy-fexcore-source-inventory
          path: |
            build/heavy/fexcore/jit-units.txt
            build/heavy/fexcore/darwin-linux-compat-audit.json
            build/heavy/fexcore/darwin-linux-compat-summary.txt
            build/heavy/fexcore/miscops-ios-compile.log
            build/heavy/fexcore/miscops-ios-status.txt
            build/heavy/fexcore/miscops-ios-arm64.o
          if-no-files-found: ignore

  shadps4-hle:
    name: shadPS4 real HLE registry iOS compile
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe actual shadPS4 HLE translation unit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/heavy/hle
          SHAD=MaxPS4-iOS/Engine/shadPS4
          # The full IPA workflow downloads this upstream source separately;
          # independent jobs have fresh workspaces and must fetch it themselves.
          git clone --quiet --filter=blob:none \
            https://github.com/shadps4-emu/shadPS4.git "$SHAD"
          git -C "$SHAD" checkout --quiet 443f022450f6857256e780daa3d5a14029a748f7
          test -s "$SHAD/src/core/libraries/libs.cpp"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for formula in fmt boost nlohmann-json libusb; do
            if ! brew list --versions "$formula" >/dev/null 2>&1; then brew install "$formula"; fi
          done
          git clone --quiet --depth 1 --branch v0.9.7 https://github.com/Neargye/magic_enum.git "$RUNNER_TEMP/maxps4-heavy-magic-enum"
          git clone --quiet --filter=blob:none https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/maxps4-heavy-sdl3"
          git -C "$RUNNER_TEMP/maxps4-heavy-sdl3" checkout --quiet ea3042350d3aac4b83ae83047185ba703d8f0a5c
          xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" -fsyntax-only \
            -I "$SHAD/src" \
            -I "$(brew --prefix fmt)/include" \
            -I "$(brew --prefix boost)/include" \
            -I "$(brew --prefix nlohmann-json)/include" \
            -I "$(brew --prefix libusb)/include/libusb-1.0" \
            -I "$RUNNER_TEMP/maxps4-heavy-magic-enum/include" \
            -I "$RUNNER_TEMP/maxps4-heavy-sdl3/include" \
            "$SHAD/src/core/libraries/libs.cpp" \
            2>&1 | tee build/heavy/hle/compile.log
          echo "PASS shadPS4 HLE registry syntax compile; not linked into IPA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heavy-shadps4-hle-compile
          path: build/heavy/hle
          if-no-files-found: ignore
