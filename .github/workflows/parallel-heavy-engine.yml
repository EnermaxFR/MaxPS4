name: MaxPS4 parallel heavy engine checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "MaxPS4-iOS/**"
      - "scripts/*fex*.py"
      - ".github/workflows/parallel-heavy-engine.yml"
  push:
    branches: [main]
    paths:
      - "MaxPS4-iOS/**"
      - ".github/workflows/parallel-heavy-engine.yml"
      - "scripts/*fex*.py"

permissions:
  contents: read

jobs:
  fexcore-source:
    name: FEXCore upstream ARM64 source verification
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned FEXCore source and check JIT units
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/heavy/fexcore
          git clone --quiet --no-checkout --filter=blob:none https://github.com/FEX-Emu/FEX.git build/heavy/fexcore/source
          git -C build/heavy/fexcore/source sparse-checkout init --cone
          git -C build/heavy/fexcore/source sparse-checkout set FEXCore Source CodeEmitter FEXHeaderUtils
          git -C build/heavy/fexcore/source checkout --quiet f2b679f6028ce1c38875233aecfcf5d3f8ebecec
          FEX=build/heavy/fexcore/source/FEXCore/Source/Interface/Core/JIT
          test -s "$FEX/JIT.cpp"
          test -s "$FEX/ALUOps.cpp"
          find "$FEX" -maxdepth 1 -name '*Ops.cpp' -type f | sort > build/heavy/fexcore/jit-units.txt
          test -s build/heavy/fexcore/jit-units.txt
          echo "PASS pinned FEXCore JIT sources present (not compiled or linked)"
      - name: Apply shared Darwin adaptations before compilation
        shell: bash
        run: |
          set -euo pipefail
          python3 MaxPS4-iOS/Tests/FEXDiagnosticsTest.py
          python3 MaxPS4-iOS/Tests/FEXDarwinPatchTest.py build/heavy/fexcore/source
          python3 scripts/patch-fexcore-ios.py build/heavy/fexcore/source

      - name: Probe genuine patched FEXCore MiscOps with iOS ARM64 compiler
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          FEX="build/heavy/fexcore/source"
          GENERATED="build/heavy/fexcore/generated"
          mkdir -p "$GENERATED/FEXCore/IR" "$GENERATED/FEXCore/Config"
          # Use FEXCore's real upstream generators; no placeholder headers.
          python3 "$FEX/FEXCore/Scripts/json_ir_generator.py" \
            "$FEX/FEXCore/Source/Interface/IR/IR.json" \
            "$GENERATED/FEXCore/IR/IRDefines.inc" \
            "$GENERATED/FEXCore/IR/IRDefines_Dispatch.inc"
          python3 "$FEX/FEXCore/Scripts/config_generator.py" \
            "$FEX/FEXCore/Source/Interface/Config/Config.json.in" \
            "$GENERATED/FEXCore/Config/ConfigValues.inl" \
            "$GENERATED/fexcore-options.1" \
            "$GENERATED/ConfigArgumentLoader.inc"
          # FEXCore Config.h expects ConfigOptions.inl generated from upstream JSON.
          python3 - "$FEX/FEXCore/Source/Interface/Config/Config.json.in" "$GENERATED/FEXCore/Config/ConfigOptions.inl" <<'PY'
          import json
          import sys
          from pathlib import Path
          config = json.loads(Path(sys.argv[1]).read_text())
          lines = ["// Generated from pinned upstream FEXCore Config.json.in", "#ifdef ENUMDEFINES"]
          for group in config["Options"].values():
              for name, option in group.items():
                  if option["Type"] != "strenum":
                      continue
                  lines.extend(["enum class " + name + " : uint64_t {", "  OFF = 0,"])
                  for index, key in enumerate(option["Enums"]):
                      lines.append("  " + key.upper() + " = 1ULL << " + str(index) + ",")
                  lines.extend(["};", "FEX_DEF_NUM_OPS(" + name + ")"])
          lines.append("#endif")
          Path(sys.argv[2]).write_text("\n".join(lines) + "\n")
          PY
          test -s "$GENERATED/FEXCore/Config/ConfigOptions.inl"
          if ! brew list --versions fmt >/dev/null 2>&1; then brew install fmt; fi
          git clone --quiet --no-checkout --filter=blob:none \
            https://github.com/martinus/unordered_dense.git build/heavy/fexcore/unordered-dense
          git -C build/heavy/fexcore/unordered-dense checkout --quiet 3234af2c03549bc85656bfd3a86993bf1cd8aef1
          SRC="$FEX/FEXCore/Source/Interface/Core/JIT/MiscOps.cpp"
          LOG="build/heavy/fexcore/miscops-ios-compile.log"
          # The preceding job step applies the exact ProcessorID Darwin patch.
          # A compiler probe, not a fake runtime simulation: missing generated
          # headers or dependencies must be reported rather than stubbed.
          if xcrun --sdk iphoneos clang++ -std=c++23 \
              -target arm64-apple-ios16.0 -isysroot "$SDK" \
              -DARCHITECTURE_arm64=1 \
              -I "$GENERATED" \
              -I "$(brew --prefix fmt)/include" \
              -I "build/heavy/fexcore/unordered-dense/include" \
              -I "$FEX/FEXCore/include" \
              -I "$FEX/FEXCore/Source" \
              -I "$FEX/Source" -I "$FEX/CodeEmitter" -I "$FEX/FEXHeaderUtils" \
              -I "MaxPS4-iOS/Native/compat/fex_ios" \
              -c "$SRC" -o build/heavy/fexcore/miscops-ios-arm64.o > "$LOG" 2>&1; then
            test -s build/heavy/fexcore/miscops-ios-arm64.o
            xcrun lipo -archs build/heavy/fexcore/miscops-ios-arm64.o | grep -qw arm64
            echo "PASS actual patched FEXCore MiscOps.cpp iOS ARM64 object compilation" | tee build/heavy/fexcore/miscops-ios-status.txt
          else
            echo "BLOCKED actual FEXCore MiscOps.cpp iOS ARM64 syntax compilation; inspect log" | tee build/heavy/fexcore/miscops-ios-status.txt
            head -60 "$LOG"
            # Keep reporting failures accurately. Previously this branch
            # ended successfully and misleadingly painted the job green.
            exit 1
          fi
      - name: Inventory real ARM64 MiscOps object unresolved symbols
        shell: bash
        run: |
          set -euo pipefail
          OBJ=build/heavy/fexcore/miscops-ios-arm64.o
          test -s "$OBJ"
          xcrun nm -u "$OBJ" | sort -u > build/heavy/fexcore/miscops-unresolved-symbols.txt
          xcrun nm -g "$OBJ" > build/heavy/fexcore/miscops-global-symbols.txt
          python3 - <<'PY'
          from pathlib import Path
          root = Path("build/heavy/fexcore")
          unresolved = (root / "miscops-unresolved-symbols.txt").read_text().splitlines()
          defined = (root / "miscops-global-symbols.txt").read_text().splitlines()
          report = ("FEXCore MiscOps.cpp / Mach-O arm64 object symbol inventory\n"
                    f"Unresolved symbol lines: {len(unresolved)}\n"
                    f"Global symbol lines: {len(defined)}\n"
                    "This is NOT a link success or guest-code execution test.\n")
          (root / "miscops-symbol-summary.txt").write_text(report)
          print(report)
          PY
      - name: Compile every real ARM64 JIT unit and CPUBackend without IPA
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          FEX=build/heavy/fexcore/source
          OUT=build/heavy/fexcore
          SOURCES=("$FEX"/FEXCore/Source/Interface/Core/JIT/*.cpp
                   "$FEX/FEXCore/Source/Interface/Core/CPUBackend.cpp")
          failed=0
          : > "$OUT/jit-compile-status.txt"
          for source in "${SOURCES[@]}"; do
            unit="$(basename "$source" .cpp)"
            # MiscOps was compiled and inventoried in the previous steps.
            if test "$unit" = MiscOps; then continue; fi
            obj="$OUT/$unit-ios-arm64.o"
            log="$OUT/$unit-ios-compile.log"
            if xcrun --sdk iphoneos clang++ -std=c++23 \
                -target arm64-apple-ios16.0 -isysroot "$SDK" \
                -DARCHITECTURE_arm64=1 \
                -I "$OUT/generated" -I "$(brew --prefix fmt)/include" \
                -I "$OUT/unordered-dense/include" \
                -I "$FEX/FEXCore/include" -I "$FEX/FEXCore/Source" \
                -I "$FEX/Source" -I "$FEX/CodeEmitter" -I "$FEX/FEXHeaderUtils" \
                -I MaxPS4-iOS/Native/compat/fex_ios \
                -c "$source" -o "$obj" > "$log" 2>&1; then
              test -s "$obj"
              xcrun lipo -archs "$obj" | grep -qw arm64
              xcrun nm -u "$obj" > "$OUT/$unit-unresolved-symbols.txt"
              echo "PASS $unit Mach-O arm64 object" | tee -a "$OUT/jit-compile-status.txt"
            else
              failed=$((failed + 1))
              echo "FAIL $unit (see $log)" | tee -a "$OUT/jit-compile-status.txt"
              head -40 "$log"
            fi
          done
          # Attempt every unit, then fail the job if any compilation failed.
          # Object production does not establish complete linkage or iOS JIT.
          test "$failed" -eq 0
      - name: Test patched Darwin signal masks and mutex on macOS
        shell: bash
        run: |
          set -euo pipefail
          FEX=build/heavy/fexcore/source
          OUT=build/heavy/fexcore
          clang++ -std=c++23 -pthread -DASSERTIONS_ENABLED=0 \
            -I "$OUT/generated" -I "$(brew --prefix fmt)/include" \
            -I "$OUT/unordered-dense/include" \
            -I "$FEX/FEXCore/include" -I "$FEX/FEXCore/Source" \
            -I "$FEX/FEXHeaderUtils" \
            -I MaxPS4-iOS/Native/compat/fex_ios \
            MaxPS4-iOS/Tests/FEXDarwinPrimitivesTest.cpp \
            -o "$OUT/darwin-primitives-test"
          python3 - <<'PY'
          import subprocess
          subprocess.run(["build/heavy/fexcore/darwin-primitives-test"],
                         timeout=60, check=True)
          PY
      - name: Compile real link dependencies and measure remaining symbols
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          FEX=build/heavy/fexcore/source
          OUT=build/heavy/fexcore
          CORE_OBJECTS=("$OUT"/*-ios-arm64.o)
          xcrun nm -g "${CORE_OBJECTS[@]}" > "$OUT/link-before.nm"
          # CPUID consumes the real upstream git_version.h template.
          python3 - "$FEX" "$OUT/generated" <<'PYCODE'
          import subprocess, sys
          from pathlib import Path
          source, generated = map(Path, sys.argv[1:])
          revision = subprocess.check_output(["git", "-C", str(source), "rev-parse", "HEAD"], text=True).strip()
          template = (source / "FEXCore/include/git_version.h.in").read_text()
          template = template.replace("@GIT_HASH_ARRAY@", ", ".join("0x" + revision[i:i+2] for i in range(0, 40, 2)))
          template = template.replace("@GIT_DESCRIBE_STRING@", revision)
          (generated / "git_version.h").write_text(template)
          PYCODE
          SOURCES=(
            Interface/Core/ArchHelpers/Arm64Emitter.cpp
            Interface/Core/LookupCache.cpp
            Interface/Core/CPUID.cpp
            Utils/LongJump.cpp
            Utils/LogManager.cpp
            Utils/ForcedAssert.cpp
            Utils/SpinWaitLock.cpp
            Utils/AllocatorHooks.cpp
          )
          DEPENDENCY_OBJECTS=()
          failed=0
          : > "$OUT/link-dependencies-status.txt"
          for relative in "${SOURCES[@]}"; do
            unit="$(basename "$relative" .cpp)"
            obj="$OUT/dependency-$unit-ios-arm64.o"
            log="$OUT/dependency-$unit-ios-compile.log"
            # fmt implementations must target iOS. Never link Homebrew's
            # macOS libfmt into an iOS object; compile its real headers.
            if xcrun --sdk iphoneos clang++ -std=c++23 \
                -target arm64-apple-ios16.0 -isysroot "$SDK" \
                -DARCHITECTURE_arm64=1 -DFMT_HEADER_ONLY=1 \
                -I "$OUT/generated" -I "$(brew --prefix fmt)/include" \
                -I "$OUT/unordered-dense/include" -I "$FEX/FEXCore/include" \
                -I "$FEX/FEXCore/Source" -I "$FEX/Source" \
                -I "$FEX/CodeEmitter" -I "$FEX/FEXHeaderUtils" \
                -I MaxPS4-iOS/Native/compat/fex_ios \
                -c "$FEX/FEXCore/Source/$relative" -o "$obj" > "$log" 2>&1; then
              test -s "$obj"
              xcrun lipo -archs "$obj" | grep -qw arm64
              DEPENDENCY_OBJECTS+=("$obj")
              echo "PASS $relative Mach-O arm64" | tee -a "$OUT/link-dependencies-status.txt"
            else
              failed=$((failed + 1))
              echo "FAIL $relative (see $log)" | tee -a "$OUT/link-dependencies-status.txt"
              head -40 "$log"
            fi
          done
          test "$failed" -eq 0
          xcrun ld -r -arch arm64 -o "$OUT/jit-with-dependencies.o" \
            "${CORE_OBJECTS[@]}" "${DEPENDENCY_OBJECTS[@]}" > "$OUT/partial-link.log" 2>&1
          test -s "$OUT/jit-with-dependencies.o"
          xcrun lipo -archs "$OUT/jit-with-dependencies.o" | grep -qw arm64
          xcrun nm -g "$OUT/jit-with-dependencies.o" > "$OUT/link-after.nm"
          python3 scripts/fexcore-link-report.py "$OUT/link-before.nm" "$OUT/link-after.nm" \
            "$OUT/link-report.json" --demangler "$(xcrun --find c++filt)"
          python3 - "$OUT/link-report.json" <<'PYCODE'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          covered = ("FEXCore::CPU::CPUBackend", "FEXCore::CPU::Arm64JITCore::Op_",
                     "FEXCore::CPU::Arm64Emitter", "FEXCore::LookupCache", "FEXCore::GuestToHostMap",
                     "FEXCore::UncheckedLongJump", "FEXCore::CPUIDEmu", "FEXCore::Assert::",
                     "FEXCore::Utils::SpinWaitLock", "LogMan::", "fmt::", "__clear_cache")
          unexpected = [row["demangled"] for row in report["remaining"]
                        if any(family in row["demangled"] for family in covered)]
          assert not unexpected, unexpected
          assert report["resolved"], "No real symbol dependency was resolved"
          print("PASS covered implementations resolved; other runtime dependencies remain explicit")
          PYCODE
          # This strict linker probe permits no missing symbols. Its BLOCKED
          # result is a diagnostic, separate from the regression gate above.
          if xcrun --sdk iphoneos clang++ -target arm64-apple-ios16.0 -isysroot "$SDK" \
              -dynamiclib -Wl,-undefined,error \
              "${CORE_OBJECTS[@]}" "${DEPENDENCY_OBJECTS[@]}" \
              -o "$OUT/fexcore-link-probe.dylib" > "$OUT/strict-link.log" 2>&1; then
            echo "PASS strict iOS link (runtime JIT not tested)" | tee "$OUT/strict-link-status.txt"
          else
            echo "BLOCKED complete iOS link; see strict-link.log and link-report.json" \
              | tee "$OUT/strict-link-status.txt"
            head -60 "$OUT/strict-link.log"
          fi
          cat "$OUT/strict-link-status.txt" >> "$GITHUB_STEP_SUMMARY"
          echo 'Dependency regression success is not complete FEXCore linkage or device JIT execution.' >> "$GITHUB_STEP_SUMMARY"
      - name: Test real Darwin libc allocator without executable allocations
        shell: bash
        run: |
          set -euo pipefail
          FEX=build/heavy/fexcore/source
          OUT=build/heavy/fexcore
          clang++ -std=c++23 -I "$FEX/FEXCore/include" \
            -I "$(brew --prefix fmt)/include" \
            -I MaxPS4-iOS/Native/compat/fex_ios \
            "$FEX/FEXCore/Source/Utils/AllocatorHooks.cpp" \
            MaxPS4-iOS/Tests/FEXDarwinAllocatorTest.cpp -o "$OUT/darwin-allocator-test"
          "$OUT/darwin-allocator-test"
      - name: Compare AetherPS4 Darwin contracts with a matching iOS ABI probe
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/heavy/fexcore
          AETHER="$OUT/aether-source"
          git clone --quiet --no-checkout --filter=blob:none https://github.com/Leviidev/AetherPS4.git "$AETHER"
          git -C "$AETHER" sparse-checkout init --cone
          git -C "$AETHER" sparse-checkout set src/core/fex runtime/sources/fexcore-darwin
          git -C "$AETHER" checkout --quiet 3347fc13f19860855ce91b66356940989ea6b6a6
          python3 scripts/audit-fex-darwin-contracts.py "$OUT/source" "$AETHER" "$OUT/darwin-contracts.json"
          DARWIN="$AETHER/runtime/sources/fexcore-darwin"
          GENERATED="$OUT/darwin-generated"
          mkdir -p "$GENERATED/FEXCore/Config" "$GENERATED/FEXCore/IR"
          python3 "$DARWIN/FEXCore/Scripts/config_generator.py" \
            "$DARWIN/FEXCore/Source/Interface/Config/Config.json.in" \
            "$GENERATED/FEXCore/Config/ConfigValues.inl" "$GENERATED/Config.1" \
            "$GENERATED/FEXCore/Config/ConfigOptions.inl"
          python3 "$DARWIN/FEXCore/Scripts/json_ir_generator.py" \
            "$DARWIN/FEXCore/Source/Interface/IR/IR.json" \
            "$GENERATED/FEXCore/IR/IRDefines.inc" "$GENERATED/FEXCore/IR/IRDefines_Dispatch.inc"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          # The entire include set comes from this matching Darwin checkout.
          # Do not combine its ContextImpl ABI with generic JIT objects.
          xcrun --sdk iphoneos clang++ -std=c++23 \
            -target arm64-apple-ios16.0 -isysroot "$SDK" -DARCHITECTURE_arm64=1 \
            -I "$GENERATED" -I "$(brew --prefix fmt)/include" \
            -I "$OUT/unordered-dense/include" -I "$DARWIN/FEXCore/include" \
            -I "$DARWIN/FEXCore/Source" -I "$DARWIN/Source" \
            -I "$DARWIN/CodeEmitter" -I "$DARWIN/FEXHeaderUtils" \
            -I MaxPS4-iOS/Native/compat/fex_ios \
            -c MaxPS4-iOS/Tests/FEXDarwinContractsProbe.cpp \
            -o "$OUT/darwin-contracts-ios-arm64.o"
          xcrun lipo -archs "$OUT/darwin-contracts-ios-arm64.o" | grep -qw arm64
          echo "PASS six bundled Darwin contracts compiled for iOS ARM64; not linked to generic FEXCore"
      - name: Audit Linux-specific dependencies blocking iOS FEXCore port
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          root = Path("build/heavy/fexcore/source/FEXCore")
          patterns = {
              "SYS_getcpu": re.compile(r"\bSYS_getcpu\b"),
              "sys/prctl.h": re.compile(r"#\s*include\s*[<\"]sys/prctl\.h[>\"]"),
              "sys/user.h": re.compile(r"#\s*include\s*[<\"]sys/user\.h[>\"]"),
              "prctl invocation": re.compile(r"\bprctl\s*\("),
          }
          rows = []
          for path in sorted(root.rglob("*")):
              if path.suffix not in (".cpp", ".cc", ".c", ".h", ".hpp") or not path.is_file():
                  continue
              for number, line in enumerate(path.read_text(errors="replace").splitlines(), 1):
                  for category, pattern in patterns.items():
                      if pattern.search(line):
                          rows.append({"file": str(path.relative_to(root)), "line": number,
                                       "category": category, "source": line.strip()[:240]})
          out = Path("build/heavy/fexcore")
          (out / "darwin-linux-compat-audit.json").write_text(
              json.dumps({"upstream_commit": "f2b679f6028ce1c38875233aecfcf5d3f8ebecec",
                          "findings": rows}, indent=2) + "\n")
          # Ensure artifacts are machine-readable before uploading them.
          import collections
          report_path = out / "darwin-linux-compat-audit.json"
          report = json.loads(report_path.read_text())
          assert report["findings"] == rows
          summary = collections.Counter(entry["category"] for entry in rows)
          (out / "darwin-linux-compat-summary.txt").write_text(
              "FEXCore Linux dependencies for iOS porting (source inventory only)\n"
              + "\n".join(f"{category}: {count}" for category, count in sorted(summary.items()))
              + "\n"
          )
          print("Linux-to-iOS migration findings:", len(rows))
          for row in rows[:30]:
              print(f'{row["file"]}:{row["line"]}: {row["category"]}: {row["source"]}')
          print("Audit only: compiling and linking a complete FEXCore iOS backend still required")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heavy-fexcore-source-inventory
          path: |
            build/heavy/fexcore/jit-units.txt
            build/heavy/fexcore/darwin-linux-compat-audit.json
            build/heavy/fexcore/darwin-linux-compat-summary.txt
            build/heavy/fexcore/miscops-ios-compile.log
            build/heavy/fexcore/miscops-ios-status.txt
            build/heavy/fexcore/miscops-ios-arm64.o
            build/heavy/fexcore/miscops-unresolved-symbols.txt
            build/heavy/fexcore/miscops-global-symbols.txt
            build/heavy/fexcore/miscops-symbol-summary.txt
            build/heavy/fexcore/jit-compile-status.txt
            build/heavy/fexcore/*-ios-compile.log
            build/heavy/fexcore/*-ios-arm64.o
            build/heavy/fexcore/*-unresolved-symbols.txt
            build/heavy/fexcore/link-*.nm
            build/heavy/fexcore/link-report.json
            build/heavy/fexcore/link-dependencies-status.txt
            build/heavy/fexcore/partial-link.log
            build/heavy/fexcore/strict-link.log
            build/heavy/fexcore/strict-link-status.txt
            build/heavy/fexcore/darwin-contracts.json
          if-no-files-found: ignore

  shadps4-hle:
    name: shadPS4 real HLE registry iOS compile
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe actual shadPS4 HLE translation unit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/heavy/hle
          SHAD=MaxPS4-iOS/Engine/shadPS4
          # The full IPA workflow downloads this upstream source separately;
          # independent jobs have fresh workspaces and must fetch it themselves.
          git clone --quiet --filter=blob:none \
            https://github.com/shadps4-emu/shadPS4.git "$SHAD"
          git -C "$SHAD" checkout --quiet 443f022450f6857256e780daa3d5a14029a748f7
          test -s "$SHAD/src/core/libraries/libs.cpp"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for formula in fmt boost nlohmann-json libusb; do
            if ! brew list --versions "$formula" >/dev/null 2>&1; then brew install "$formula"; fi
          done
          git clone --quiet --depth 1 --branch v0.9.7 https://github.com/Neargye/magic_enum.git "$RUNNER_TEMP/maxps4-heavy-magic-enum"
          git clone --quiet --filter=blob:none https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/maxps4-heavy-sdl3"
          git -C "$RUNNER_TEMP/maxps4-heavy-sdl3" checkout --quiet ea3042350d3aac4b83ae83047185ba703d8f0a5c
          xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" -fsyntax-only \
            -I "$SHAD/src" \
            -I "$(brew --prefix fmt)/include" \
            -I "$(brew --prefix boost)/include" \
            -I "$(brew --prefix nlohmann-json)/include" \
            -I "$(brew --prefix libusb)/include/libusb-1.0" \
            -I "$RUNNER_TEMP/maxps4-heavy-magic-enum/include" \
            -I "$RUNNER_TEMP/maxps4-heavy-sdl3/include" \
            "$SHAD/src/core/libraries/libs.cpp" \
            2>&1 | tee build/heavy/hle/compile.log
          echo "PASS shadPS4 HLE registry syntax compile; not linked into IPA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heavy-shadps4-hle-compile
          path: build/heavy/hle
          if-no-files-found: ignore
