name: Rename MaxPS4 release

on:
  push:
    branches: ["shadps4-ios-core"]
    paths:
      - ".github/workflows/rename-release.yml"

permissions:
  contents: write

jobs:
  rename-release:
    runs-on: ubuntu-latest
    steps:
      - name: Rename release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit maxps4-run-150             --repo "$GITHUB_REPOSITORY"             --title "MaxPS4"
