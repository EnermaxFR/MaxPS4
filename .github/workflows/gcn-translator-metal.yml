name: GCN translator (C++ and Metal)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'MaxPS4-iOS/Native/GCNKernel.h'
      - 'MaxPS4-iOS/Native/GCNKernelImage.h'
      - 'MaxPS4-iOS/Native/GCNImageBinding.hpp'
      - 'MaxPS4-iOS/Native/GCNPixelOffload.hpp'
      - 'MaxPS4-iOS/Native/GCNMetalPixelBackend.hpp'
      - 'MaxPS4-iOS/Native/GCNRenderer.hpp'
      - 'MaxPS4-iOS/Native/GCNShader.hpp'
      - 'MaxPS4-iOS/Native/GCNShaderTranslator.hpp'
      - 'MaxPS4-iOS/Native/GCNTiling.hpp'
      - 'MaxPS4-iOS/Native/GPUHostSpan.hpp'
      - 'MaxPS4-iOS/Tests/GCNKernelOpsTest.cpp'
      - 'MaxPS4-iOS/Tests/GCNKernelImageTest.cpp'
      - 'MaxPS4-iOS/Tests/GCNImageCases.hpp'
      - 'MaxPS4-iOS/Tests/GCNRendererOffloadTest.cpp'
      - 'MaxPS4-iOS/Tests/GCNCppJitBackend.hpp'
      - 'MaxPS4-iOS/Tests/GCNTranslator*'
      - 'scripts/test-gcn-translator.sh'
      - '.github/workflows/gcn-translator-metal.yml'
  push:
    branches: ['experiment/keroblaster-iphone-m53']
    paths:
      - 'MaxPS4-iOS/Native/GCNKernel.h'
      - 'MaxPS4-iOS/Native/GCNKernelImage.h'
      - 'MaxPS4-iOS/Native/GCNImageBinding.hpp'
      - 'MaxPS4-iOS/Native/GCNPixelOffload.hpp'
      - 'MaxPS4-iOS/Native/GCNMetalPixelBackend.hpp'
      - 'MaxPS4-iOS/Native/GCNRenderer.hpp'
      - 'MaxPS4-iOS/Native/GCNShader.hpp'
      - 'MaxPS4-iOS/Native/GCNShaderTranslator.hpp'
      - 'MaxPS4-iOS/Native/GCNTiling.hpp'
      - 'MaxPS4-iOS/Native/GPUHostSpan.hpp'
      - 'MaxPS4-iOS/Tests/GCNKernelOpsTest.cpp'
      - 'MaxPS4-iOS/Tests/GCNKernelImageTest.cpp'
      - 'MaxPS4-iOS/Tests/GCNImageCases.hpp'
      - 'MaxPS4-iOS/Tests/GCNRendererOffloadTest.cpp'
      - 'MaxPS4-iOS/Tests/GCNCppJitBackend.hpp'
      - 'MaxPS4-iOS/Tests/GCNTranslator*'
      - 'scripts/test-gcn-translator.sh'
      - '.github/workflows/gcn-translator-metal.yml'
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prelude and image sampling equivalence, translated shaders vs interpreter (native + ASan/UBSan)
        run: bash scripts/test-gcn-translator.sh build/gcn-translator
  metal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Translate the fixtures
        run: |
          mkdir -p build/gcn-metal
          xcrun clang++ -std=c++17 -O1 -Wall -Wextra -I MaxPS4-iOS/Native \
            MaxPS4-iOS/Tests/GCNTranslatorTool.cpp -o build/gcn-metal/tool
          build/gcn-metal/tool build/gcn-metal/translated.inc
      - name: Compile the translated shaders offline with the Metal compiler (no GPU needed)
        run: |
          xcrun clang++ -std=c++17 -O1 -fobjc-arc -I MaxPS4-iOS/Native \
            -DGCN_TRANSLATED="\"$PWD/build/gcn-metal/translated.inc\"" \
            MaxPS4-iOS/Tests/GCNTranslatorMetal.mm -framework Foundation -framework Metal \
            -o build/gcn-metal/metal-test
          build/gcn-metal/metal-test MaxPS4-iOS/Native/GCNKernel.h MaxPS4-iOS/Native/GCNKernelImage.h build/gcn-metal/translated.inc build/gcn-metal/translated.metal
          xcrun -sdk macosx metal -std=metal3.0 -fno-fast-math -Wall -c build/gcn-metal/translated.metal -o build/gcn-metal/translated.air
          xcrun -sdk iphoneos metal -std=ios-metal2.4 -fno-fast-math -Wall -c build/gcn-metal/translated.metal -o build/gcn-metal/translated-ios.air
          xcrun -sdk macosx metallib build/gcn-metal/translated.air -o build/gcn-metal/translated.metallib
          ls -l build/gcn-metal/translated.metallib
      - name: Compile the translated shaders as MSL and compare GPU results with the C++ twin (skipped without a Metal device)
        run: |
          build/gcn-metal/metal-test MaxPS4-iOS/Native/GCNKernel.h MaxPS4-iOS/Native/GCNKernelImage.h build/gcn-metal/translated.inc
      - name: Renderer pixel offload on Metal (render targets equal to the interpreter)
        run: |
          xcrun clang++ -x objective-c++ -std=c++17 -O1 -fobjc-arc -Wno-misleading-indentation -I MaxPS4-iOS/Native \
            MaxPS4-iOS/Tests/GCNRendererOffloadTest.cpp -framework Foundation -framework Metal -o build/gcn-metal/offload-test
          build/gcn-metal/offload-test "$PWD/MaxPS4-iOS/Native" build/gcn-metal
