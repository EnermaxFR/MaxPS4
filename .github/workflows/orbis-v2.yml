name: Orbis PKG runtime V2 safety
on:
  push:
    branches: ['experiment/orbis-runtime-pkg-v2', 'experiment/orbis-v3-autotests', 'experiment/orbis-mission-198']
  pull_request:
    paths:
      - 'MaxPS4-iOS/**'
      - 'scripts/*orbis*v2*'
      - 'scripts/*orbis*v3*'
      - '.github/workflows/orbis-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: ASan/UBSan plaintext PFS, ELF, mapping and cleanup
        run: bash scripts/test-orbis-v2.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orbis-V2-${{ matrix.os }}-evidence
          path: build/orbis-v2/
          if-no-files-found: error

