name: MaxPS4 Orbis V3 Test IPA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'patches/fexcore-guest-memory.patch'
      - 'MaxPS4-iOS/Tests/FEXGuestTranslationTest.cpp'
      - 'MaxPS4-iOS/**'
      - 'experimental/orbis-v3-staging/**'
      - 'scripts/build-orbis-test-ipa.sh'
      - '.github/workflows/orbis-v3-test-ipa.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  orbis-test-ipa:
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout pinned FEX runtime and build tools
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Leviidev/AetherPS4.git build/aether-app
          git -C build/aether-app sparse-checkout set runtime/sources/fexcore-darwin src/core/guest_cpu src/core/ios
          git -C build/aether-app checkout 3347fc13f19860855ce91b66356940989ea6b6a6
          brew install ninja xcodegen
      - name: Build required host-side fixture for IPA packaging
        run: bash scripts/build-fexcore-darwin-ios.sh build/aether-app build/fex-app-host --host-runtime
      - name: Build and verify separate Orbis Test IPA
        run: bash scripts/build-orbis-test-ipa.sh build/aether-app
      - uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-Orbis-Test-SideStore
          path: build/MaxPS4-Orbis-Test-SideStore.ipa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MaxPS4-Orbis-Test-build-log
          path: |
            build/diagnostics/orbis-test-build.log
            build/diagnostics/orbis-test-imports.txt
          retention-days: 14
