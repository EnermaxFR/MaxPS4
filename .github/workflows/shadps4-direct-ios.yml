name: Probe Direct shadPS4 iOS Port

on:
  workflow_dispatch:
  push:
    branches: [ maxps4-shadps4-direct ]
    paths:
      - '.github/workflows/shadps4-direct-ios.yml'
      - 'MaxPS4-iOS/Core/**'

jobs:
  probe-direct-shadps4-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout MaxPS4
        uses: actions/checkout@v4

      - name: Prepare tools and diagnose LLVM/SPIR-V
        shell: bash
        run: |
          set -euxo pipefail
          brew update
          brew install ninja protobuf llvm spirv-llvm-translator pkgconf cmake || true

          LLVM_PREFIX="$(brew --prefix llvm)"
          SPIRV_PREFIX="$(brew --prefix spirv-llvm-translator)"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LLVM_DIR=$LLVM_PREFIX/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "LLVM_ROOT=$LLVM_PREFIX" >> "$GITHUB_ENV"
          echo "SPIRV_LLVM_TRANSLATOR_ROOT=$SPIRV_PREFIX" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$SPIRV_PREFIX/lib/pkgconfig:$LLVM_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$SPIRV_PREFIX:$LLVM_PREFIX:${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"

          "$LLVM_PREFIX/bin/llvm-config" --version
          "$LLVM_PREFIX/bin/llvm-config" --prefix
          brew info llvm || true
          brew info spirv-llvm-translator || true
          find "$SPIRV_PREFIX" -maxdepth 4 -type f \( -name '*SPIRV*Config.cmake' -o -name '*spirv*config.cmake' -o -name '*.pc' \) -print || true

          python3 -m venv "$RUNNER_TEMP/maxps4-python"
          "$RUNNER_TEMP/maxps4-python/bin/python" -m pip install --upgrade pip packaging mako pyyaml meson
          echo "$RUNNER_TEMP/maxps4-python/bin" >> "$GITHUB_PATH"

      - name: Checkout official shadPS4
        shell: bash
        run: |
          set -euxo pipefail
          ENGINE_ROOT="$RUNNER_TEMP/shadps4-official"
          git clone https://github.com/shadps4-emu/shadPS4.git "$ENGINE_ROOT"
          git -C "$ENGINE_ROOT" checkout b3452cf6a9bd0969771fcfbf919c359368473d1b
          git -C "$ENGINE_ROOT" submodule update --init --recursive
          echo "ENGINE_ROOT=$ENGINE_ROOT" >> "$GITHUB_ENV"

      - name: Verify clean direct dependency tree
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$ENGINE_ROOT/src/emulator.h"
          test -f "$GITHUB_WORKSPACE/MaxPS4-iOS/Core/MaxPS4CoreBridge.cpp"
          git -C "$ENGINE_ROOT" remote get-url origin | grep -F 'shadps4-emu/shadPS4.git'

      - name: Compile MaxPS4 bridge against upstream headers
        shell: bash
        run: |
          set -euxo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang++ \
            -std=c++23 -arch arm64 -miphoneos-version-min=18.0 \
            -isysroot "$SDKROOT" \
            -I"$ENGINE_ROOT/src" \
            -I"$ENGINE_ROOT" \
            -I"$ENGINE_ROOT/externals/fmt/include" \
            -I"$ENGINE_ROOT/externals/robin-map/include" \
            -I"$ENGINE_ROOT/externals/magic_enum/include" \
            -I"$ENGINE_ROOT/externals/json/include" \
            -I"$ENGINE_ROOT/externals/ext-boost" \
            -I"$ENGINE_ROOT/externals/vulkan-headers/include" \
            -I"$ENGINE_ROOT/externals/sdl3/include" \
            -c "$GITHUB_WORKSPACE/MaxPS4-iOS/Core/MaxPS4CoreBridge.cpp" \
            -o "$RUNNER_TEMP/MaxPS4CoreBridge.o"

      - name: Configure official shadPS4 for iOS
        shell: bash
        run: |
          set -o pipefail
          BUILD="$RUNNER_TEMP/shadps4-ios-build"
          LOG="$RUNNER_TEMP/shadps4-ios-configure.log"
          LLVM_CONFIG="$(brew --prefix llvm)/bin/llvm-config"
          cmake -S "$ENGINE_ROOT" -B "$BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix spirv-llvm-translator);$(brew --prefix llvm)" \
            -DLLVM_DIR="$(brew --prefix llvm)/lib/cmake/llvm" \
            -DENABLE_TESTS=OFF \
            -DENABLE_UPDATER=OFF \
            -DENABLE_DISCORD_RPC=OFF \
            -DALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO=FALSE \
            -DALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO_EXITCODE=1 \
            -DKK_LLVM_CONFIG="$LLVM_CONFIG" \
            2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          echo "SHADPS4_IOS_BUILD=$BUILD" >> "$GITHUB_ENV"
          exit "$STATUS"

      - name: Build official shadPS4 for iOS
        shell: bash
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/shadps4-ios-build.log"
          cmake --build "$SHADPS4_IOS_BUILD" --parallel 4 2>&1 | tee "$LOG"

      - name: Upload iOS build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadps4-direct-ios-build-logs
          path: |
            ${{ runner.temp }}/shadps4-ios-configure.log
            ${{ runner.temp }}/shadps4-ios-build.log
          if-no-files-found: ignore
