name: PS4 guest memory range checks
on:
  pull_request:
    paths:
      - 'MaxPS4-iOS/Native/maxps4_guest_range.h'
      - 'MaxPS4-iOS/Native/maxps4_guest_elf.*'
      - 'MaxPS4-iOS/Native/maxps4_ps4_guest_memory.h'
      - 'MaxPS4-iOS/Tests/PS4StagedCPUAdmissionTest.cpp'
      - 'MaxPS4-iOS/Tests/GuestMemoryRangeTest.cpp'
      - 'MaxPS4-iOS/Tests/PS4GuestMemoryABITest.c'
      - 'MaxPS4-iOS/Native/maxps4_fex_runtime.h'
      - '.github/workflows/ps4-guest-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest-range:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run checked guest-range tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer MaxPS4-iOS/Tests/GuestMemoryRangeTest.cpp -o /tmp/guest-range-test
          /tmp/guest-range-test
      - name: Verify C ABI signatures for Swift bridge
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -I MaxPS4-iOS/Native -c MaxPS4-iOS/Tests/PS4GuestMemoryABITest.c -o /tmp/ps4-memory-abi.o

