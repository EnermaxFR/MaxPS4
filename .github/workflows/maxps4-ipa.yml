name: Build MaxPS4 IPA

on:
  workflow_dispatch:
  push:
    branches: [ maxps4-shadps4-direct ]

jobs:
  build-maxps4-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse direct iOS port workflow as source of truth
        shell: bash
        run: |
          set -euxo pipefail
          echo "Build 47 validates the comprehensive direct-port workflow first."
          echo "The IPA workflow is intentionally stopped here rather than carrying stale duplicate patches."
          exit 1
