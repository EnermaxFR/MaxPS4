name: Build MaxPS4 IPA

on:
  workflow_dispatch:
  push:
    branches: [maxps4-shadps4-direct]
    paths:
      - '.github/workflows/maxps4-ipa.yml'
      - 'MaxPS4-iOS/**'

jobs:
  build-maxps4-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/maxps4-ccache
          key: maxps4-ios-ccache-${{ runner.os }}-shadps4-b3452cf6-v2-${{ github.run_id }}
          restore-keys: |
            maxps4-ios-ccache-${{ runner.os }}-shadps4-b3452cf6-v2-
            maxps4-ios-ccache-${{ runner.os }}-shadps4-b3452cf6-

      - name: Install toolchain
        shell: bash
        run: |
          set -euxo pipefail
          brew install cmake ninja llvm python glslang xcodegen protobuf ccache
          PYTHON="$(brew --prefix python)/bin/python3"
          "$PYTHON" -m venv "$RUNNER_TEMP/maxps4-python"
          "$RUNNER_TEMP/maxps4-python/bin/python" -m pip install --upgrade pip packaging mako pyyaml meson
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/maxps4-python/bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.cache/maxps4-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=5G" >> "$GITHUB_ENV"

      - name: Checkout and verify shadPS4 submodules
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/shadps4"
          git clone --filter=blob:none https://github.com/shadps4-emu/shadPS4.git "$ROOT"
          git -C "$ROOT" checkout b3452cf6a9bd0969771fcfbf919c359368473d1b
          git -C "$ROOT" submodule sync --recursive
          git -C "$ROOT" -c protocol.version=2 submodule update --init --recursive --jobs 8

          # A recursive update can leave nested modules absent when an ancestor's
          # metadata was not initialized during a shallow/filtered checkout.
          # Re-run sync/update from every initialized submodule to repair those.
          git -C "$ROOT" submodule foreach --recursive 'git submodule sync --recursive || true; git submodule update --init --recursive --jobs 8 || true'

          # Validate all registered submodules before spending time in CMake.
          BAD="$RUNNER_TEMP/bad-submodules.txt"
          git -C "$ROOT" submodule status --recursive | tee "$RUNNER_TEMP/submodules.txt"
          git -C "$ROOT" submodule status --recursive | grep -E '^[+-U]' > "$BAD" || true
          if test -s "$BAD"; then
            echo 'Broken/uninitialized submodules:'
            cat "$BAD"
            exit 1
          fi

          # Explicit critical dependency checks (Zydis -> Zycore was Build 56 blocker).
          test -f "$ROOT/src/emulator.h"
          test -f "$ROOT/externals/zydis/CMakeLists.txt"
          test -f "$ROOT/externals/zydis/dependencies/zycore/CMakeLists.txt"
          test -f "$ROOT/externals/mesa-kosmickrisp/externals/mesa/meson.build"
          test -f "$ROOT/externals/protobuf/CMakeLists.txt"
          echo "SHADPS4_ENGINE_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Apply grouped iOS compatibility
        shell: bash
        run: |
          set -euxo pipefail
          KK_BO="$(find "$SHADPS4_ENGINE_ROOT/externals/mesa-kosmickrisp/externals/mesa" -path '*/src/kosmickrisp/vulkan/kk_bo.c' -print -quit)"
          test -n "$KK_BO"
          python3 - "$KK_BO" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          old = '''#include <mach/mach_init.h>\n#include <mach/mach_vm.h>'''
          new = '''#include <mach/mach.h>\n#include <mach/vm_map.h>'''
          if old not in s:
              raise SystemExit('Expected Mach includes not found')
          s = s.replace(old, new, 1)
          s = s.replace('mach_vm_address_t src_addr', 'vm_address_t src_addr')
          s = s.replace('mach_vm_address_t dst_addr', 'vm_address_t dst_addr')
          s = s.replace('(mach_vm_address_t)bo->cpu', '(vm_address_t)bo->cpu')
          s = s.replace('(mach_vm_address_t)*addr', '(vm_address_t)*addr')
          s = s.replace('mach_vm_address_t unmap_addr', 'vm_address_t unmap_addr')
          s = s.replace('(mach_vm_address_t)addr', '(vm_address_t)addr')
          s = s.replace('mach_vm_remap(mach_task_self(), &dst_addr, bo->size_B, 0,',
                        'vm_remap(mach_task_self(), &dst_addr, (vm_size_t)bo->size_B, 0,')
          old_map = '''      /* Replace with a reserved mapping using mach_vm_map */\n      kern_return_t ret = mach_vm_map(\n         mach_task_self(), &unmap_addr, bo->size_B, 0,\n         VM_FLAGS_FIXED | VM_FLAGS_OVERWRITE, MEMORY_OBJECT_NULL, 0, false,\n         VM_PROT_NONE, VM_PROT_READ | VM_PROT_WRITE, VM_INHERIT_DEFAULT);\n      if (ret != KERN_SUCCESS)\n         return vk_errorf(dev, VK_ERROR_MEMORY_MAP_FAILED,\n                          "mach_vm_map failed: %d", ret);'''
          new_map = '''      /* iOS does not expose mach_vm_map; reserve the same address with vm_allocate. */\n      kern_return_t ret = vm_allocate(mach_task_self(), &unmap_addr,\n                                      (vm_size_t)bo->size_B, VM_FLAGS_FIXED);\n      if (ret != KERN_SUCCESS)\n         return vk_errorf(dev, VK_ERROR_MEMORY_MAP_FAILED,\n                          "vm_allocate failed: %d", ret);'''
          if old_map not in s:
              raise SystemExit('Expected reserved mach_vm_map block not found')
          s = s.replace(old_map, new_map, 1)
          s = s.replace('mach_vm_deallocate(mach_task_self(), unmap_addr, bo->size_B);',
                        'vm_deallocate(mach_task_self(), unmap_addr, (vm_size_t)bo->size_B);')
          forbidden = ['mach_vm_address_t', 'mach_vm_remap(', 'mach_vm_map(', 'mach_vm_deallocate(']
          bad = [x for x in forbidden if x in s]
          if bad:
              raise SystemExit('Unpatched iOS VM symbols: ' + ', '.join(bad))
          p.write_text(s)
          PY
          grep -nE 'vm_(remap|allocate|deallocate)|mach_vm_' "$KK_BO" | tail -40

      - name: Configure iOS engine
        shell: bash
        run: |
          set -euxo pipefail
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          LLVM="$(brew --prefix llvm)"
          printf '%s\n' 'set(ALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO_EXITCODE 0 CACHE STRING "iOS cross compile result" FORCE)' > "$RUNNER_TEMP/ios-cache.cmake"
          cmake -S "$SHADPS4_ENGINE_ROOT" -B "$RUNNER_TEMP/build" -G Ninja -C "$RUNNER_TEMP/ios-cache.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DKK_LLVM_CONFIG="$LLVM/bin/llvm-config" \
            -DLLVM_DIR="$LLVM/lib/cmake/llvm" \
            -DENABLE_TESTS=OFF \
            -DENABLE_UPDATER=OFF \
            -DENABLE_DISCORD_RPC=OFF

      - name: Build iOS engine and collect diagnostics
        shell: bash
        run: |
          set -uo pipefail
          JOBS="$(sysctl -n hw.logicalcpu)"
          set +e
          cmake --build "$RUNNER_TEMP/build" --parallel "$JOBS" -- -k 50 2>&1 | tee "$RUNNER_TEMP/shadps4-build.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          ccache --show-stats || true
          echo "SHADPS4_BUILD_DIR=$RUNNER_TEMP/build" >> "$GITHUB_ENV"
          exit "$STATUS"

      - name: Upload engine diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadps4-ios-build-log
          path: ${{ runner.temp }}/shadps4-build.log
          if-no-files-found: ignore

      - name: Collect engine libraries
        shell: bash
        run: |
          set -euxo pipefail
          LIBDIR="$RUNNER_TEMP/shadps4-ios-libs"
          mkdir -p "$LIBDIR"
          find "$SHADPS4_BUILD_DIR" -type f -name '*.a' -exec cp -f {} "$LIBDIR/" \;
          test "$(find "$LIBDIR" -type f -name '*.a' | wc -l | tr -d ' ')" -gt 0
          LINK_FLAGS=""
          for lib in "$LIBDIR"/*.a; do LINK_FLAGS="$LINK_FLAGS $lib"; done
          echo "SHADPS4_LIBRARY_DIR=$LIBDIR" >> "$GITHUB_ENV"
          echo "SHADPS4_LINK_FLAGS=$LINK_FLAGS" >> "$GITHUB_ENV"

      - name: Build MaxPS4 app
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/MaxPS4-iOS"
          xcodegen generate
          DERIVED="$RUNNER_TEMP/maxps4-derived"
          xcodebuild -project MaxPS4.xcodeproj -scheme MaxPS4 -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$DERIVED" SHADPS4_ENGINE_ROOT="$SHADPS4_ENGINE_ROOT" SHADPS4_LIBRARY_DIR="$SHADPS4_LIBRARY_DIR" SHADPS4_LINK_FLAGS="$SHADPS4_LINK_FLAGS" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP="$DERIVED/Build/Products/Release-iphoneos/MaxPS4.app"
          test -d "$APP"
          echo "MAXPS4_APP=$APP" >> "$GITHUB_ENV"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail
          PACKAGE="$RUNNER_TEMP/maxps4-package"
          mkdir -p "$PACKAGE/Payload"
          cp -R "$MAXPS4_APP" "$PACKAGE/Payload/MaxPS4.app"
          cd "$PACKAGE"
          /usr/bin/zip -qry "$RUNNER_TEMP/MaxPS4-unsigned.ipa" Payload
          test -s "$RUNNER_TEMP/MaxPS4-unsigned.ipa"

      - name: Upload MaxPS4 IPA
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-unsigned-IPA
          path: ${{ runner.temp }}/MaxPS4-unsigned.ipa
          if-no-files-found: error
