name: Build MaxPS4 IPA

on:
  workflow_dispatch:
  push:
    branches: [maxps4-shadps4-direct]
    paths:
      - '.github/workflows/maxps4-ipa.yml'
      - 'MaxPS4-iOS/**'

jobs:
  build-maxps4-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        shell: bash
        run: |
          set -euxo pipefail
          brew install cmake ninja llvm python glslang xcodegen protobuf ccache
          PYTHON="$(brew --prefix python)/bin/python3"
          "$PYTHON" -m venv "$RUNNER_TEMP/maxps4-python"
          "$RUNNER_TEMP/maxps4-python/bin/python" -m pip install --upgrade pip packaging mako pyyaml meson
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/maxps4-python/bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.cache/maxps4-ccache" >> "$GITHUB_ENV"

      - name: Checkout shadPS4
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/shadps4-emu/shadPS4.git "$RUNNER_TEMP/shadps4"
          git -C "$RUNNER_TEMP/shadps4" checkout b3452cf6a9bd0969771fcfbf919c359368473d1b
          git -C "$RUNNER_TEMP/shadps4" submodule update --init --recursive --depth 1
          test -f "$RUNNER_TEMP/shadps4/src/emulator.h"
          echo "SHADPS4_ENGINE_ROOT=$RUNNER_TEMP/shadps4" >> "$GITHUB_ENV"

      - name: Apply iOS Mach VM compatibility
        shell: bash
        run: |
          set -euxo pipefail
          KK_BO="$(find "$SHADPS4_ENGINE_ROOT/externals/mesa-kosmickrisp/externals/mesa" -path '*/src/kosmickrisp/vulkan/kk_bo.c' -print -quit)"
          test -n "$KK_BO"
          python3 - "$KK_BO" <<'PY'
          import pathlib
          import sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          s = s.replace('#include <mach/mach_vm.h>', '#include <mach/mach.h>\n#include <mach/vm_map.h>\n#include <sys/mman.h>')
          s = s.replace('mach_vm_address_t', 'vm_address_t')
          s = s.replace('mach_vm_size_t', 'vm_size_t')
          s = s.replace('mach_vm_remap(', 'vm_remap(')
          s = s.replace('mach_vm_deallocate(', 'vm_deallocate(')
          s = s.replace('&dst_addr, bo->size_B, 0,', '&dst_addr, (vm_size_t)bo->size_B, 0,')
          s = s.replace('unmap_addr, bo->size_B);', 'unmap_addr, (vm_size_t)bo->size_B);')
          lines = s.splitlines()
          out = []
          i = 0
          replaced = False
          while i < len(lines):
              if 'kern_return_t ret = mach_vm_map(' in lines[i] or 'kern_return_t ret = vm_map(' in lines[i]:
                  indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
                  while i < len(lines) and 'if (ret != KERN_SUCCESS)' not in lines[i]:
                      i += 1
                  if i >= len(lines):
                      raise SystemExit('kk_bo map result check not found')
                  i += 1
                  if i >= len(lines) or 'return VK_ERROR_MEMORY_MAP_FAILED;' not in lines[i]:
                      raise SystemExit('kk_bo map failure return not found')
                  out.extend([
                      indent + 'void *reserved_addr = mmap((void *)unmap_addr, bo->size_B, PROT_NONE,',
                      indent + '                           MAP_PRIVATE | MAP_ANON | MAP_FIXED, -1, 0);',
                      indent + 'if (reserved_addr == MAP_FAILED)',
                      indent + '   return VK_ERROR_MEMORY_MAP_FAILED;'
                  ])
                  replaced = True
                  i += 1
                  continue
              out.append(lines[i])
              i += 1
          if not replaced:
              raise SystemExit('kk_bo reserved mapping block not found')
          s = '\n'.join(out) + '\n'
          bad = [x for x in ['mach_vm_address_t','mach_vm_size_t','mach_vm_remap(','mach_vm_map(','mach_vm_deallocate(','vm_map('] if x in s]
          if bad:
              raise SystemExit('Unpatched iOS VM symbols: ' + ', '.join(bad))
          p.write_text(s)
          PY
          grep -nE 'vm_(remap|deallocate)|mmap|mach_vm_' "$KK_BO" | tail -30

      - name: Configure iOS engine
        shell: bash
        run: |
          set -euxo pipefail
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          LLVM="$(brew --prefix llvm)"
          printf '%s\n' 'set(ALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO_EXITCODE 0 CACHE STRING "iOS cross compile result" FORCE)' > "$RUNNER_TEMP/ios-cache.cmake"
          cmake -S "$SHADPS4_ENGINE_ROOT" -B "$RUNNER_TEMP/build" -G Ninja -C "$RUNNER_TEMP/ios-cache.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DKK_LLVM_CONFIG="$LLVM/bin/llvm-config" \
            -DLLVM_DIR="$LLVM/lib/cmake/llvm" \
            -DENABLE_TESTS=OFF \
            -DENABLE_UPDATER=OFF \
            -DENABLE_DISCORD_RPC=OFF

      - name: Build iOS engine
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build "$RUNNER_TEMP/build" --parallel "$(sysctl -n hw.logicalcpu)"
          echo "SHADPS4_BUILD_DIR=$RUNNER_TEMP/build" >> "$GITHUB_ENV"

      - name: Collect engine libraries
        shell: bash
        run: |
          set -euxo pipefail
          LIBDIR="$RUNNER_TEMP/shadps4-ios-libs"
          mkdir -p "$LIBDIR"
          find "$SHADPS4_BUILD_DIR" -type f -name '*.a' -exec cp -f {} "$LIBDIR/" \;
          test "$(find "$LIBDIR" -type f -name '*.a' | wc -l | tr -d ' ')" -gt 0
          LINK_FLAGS=""
          for lib in "$LIBDIR"/*.a; do LINK_FLAGS="$LINK_FLAGS $lib"; done
          echo "SHADPS4_LIBRARY_DIR=$LIBDIR" >> "$GITHUB_ENV"
          echo "SHADPS4_LINK_FLAGS=$LINK_FLAGS" >> "$GITHUB_ENV"

      - name: Build MaxPS4 app
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/MaxPS4-iOS"
          xcodegen generate
          DERIVED="$RUNNER_TEMP/maxps4-derived"
          xcodebuild -project MaxPS4.xcodeproj -scheme MaxPS4 -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$DERIVED" SHADPS4_ENGINE_ROOT="$SHADPS4_ENGINE_ROOT" SHADPS4_LIBRARY_DIR="$SHADPS4_LIBRARY_DIR" SHADPS4_LINK_FLAGS="$SHADPS4_LINK_FLAGS" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP="$DERIVED/Build/Products/Release-iphoneos/MaxPS4.app"
          test -d "$APP"
          echo "MAXPS4_APP=$APP" >> "$GITHUB_ENV"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail
          PACKAGE="$RUNNER_TEMP/maxps4-package"
          mkdir -p "$PACKAGE/Payload"
          cp -R "$MAXPS4_APP" "$PACKAGE/Payload/MaxPS4.app"
          cd "$PACKAGE"
          /usr/bin/zip -qry "$RUNNER_TEMP/MaxPS4-unsigned.ipa" Payload
          test -s "$RUNNER_TEMP/MaxPS4-unsigned.ipa"

      - name: Upload MaxPS4 IPA
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-unsigned-IPA
          path: ${{ runner.temp }}/MaxPS4-unsigned.ipa
          if-no-files-found: error
