name: Build MaxPS4 IPA

on:
  workflow_dispatch:
  push:
    branches: [ maxps4-shadps4-direct ]
    paths:
      - '.github/workflows/maxps4-ipa.yml'
      - 'MaxPS4-iOS/Sources/**'
      - 'MaxPS4-iOS/Core/**'
      - 'MaxPS4-iOS/project.yml'
      - 'MaxPS4-iOS/MaxPS4.entitlements'

jobs:
  build-maxps4-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout MaxPS4
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          brew install xcodegen cmake ninja protobuf llvm spirv-llvm-translator spirv-tools glslang pkgconf || true
          LLVM_PREFIX="$(brew --prefix llvm)"
          SPIRV_PREFIX="$(brew --prefix spirv-llvm-translator)"
          SPIRV_TOOLS_PREFIX="$(brew --prefix spirv-tools)"
          GLSLANG_PREFIX="$(brew --prefix glslang)"
          test -x "$LLVM_PREFIX/bin/llvm-config"
          test -x "$GLSLANG_PREFIX/bin/glslangValidator"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$SPIRV_TOOLS_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$GLSLANG_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LLVM_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"
          echo "LLVM_DIR=$LLVM_PREFIX/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "LLVM_ROOT=$LLVM_PREFIX" >> "$GITHUB_ENV"
          echo "SPIRV_LLVM_TRANSLATOR_ROOT=$SPIRV_PREFIX" >> "$GITHUB_ENV"
          echo "SPIRV_TOOLS_ROOT=$SPIRV_TOOLS_PREFIX" >> "$GITHUB_ENV"
          echo "HOST_GLSLANG_VALIDATOR=$GLSLANG_PREFIX/bin/glslangValidator" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$SPIRV_TOOLS_PREFIX/lib/pkgconfig:$SPIRV_PREFIX/lib/pkgconfig:$LLVM_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$GLSLANG_PREFIX:$SPIRV_TOOLS_PREFIX:$SPIRV_PREFIX:$LLVM_PREFIX:${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/maxps4-python"
          "$RUNNER_TEMP/maxps4-python/bin/python" -m pip install --upgrade pip packaging mako pyyaml meson
          echo "$RUNNER_TEMP/maxps4-python/bin" >> "$GITHUB_PATH"
          echo "MAXPS4_PYTHON_BIN=$RUNNER_TEMP/maxps4-python/bin" >> "$GITHUB_ENV"
          xcodegen --version
          cmake --version
          ninja --version
          "$LLVM_PREFIX/bin/llvm-config" --version
          "$RUNNER_TEMP/maxps4-python/bin/meson" --version
          "$GLSLANG_PREFIX/bin/glslangValidator" --version

      - name: Checkout pinned shadPS4 engine
        shell: bash
        run: |
          set -euxo pipefail
          ENGINE_ROOT="$RUNNER_TEMP/shadps4-official"
          git clone https://github.com/shadps4-emu/shadPS4.git "$ENGINE_ROOT"
          git -C "$ENGINE_ROOT" checkout b3452cf6a9bd0969771fcfbf919c359368473d1b
          git -C "$ENGINE_ROOT" submodule update --init --recursive
          test -f "$ENGINE_ROOT/src/emulator.h"
          echo "SHADPS4_ENGINE_ROOT=$ENGINE_ROOT" >> "$GITHUB_ENV"
          PROTOBUF_HOST_BUILD="$RUNNER_TEMP/protobuf-host-build"
          cmake -S "$ENGINE_ROOT/externals/protobuf" -B "$PROTOBUF_HOST_BUILD" -G Ninja -DCMAKE_BUILD_TYPE=Release -Dprotobuf_BUILD_TESTS=OFF -Dprotobuf_BUILD_EXAMPLES=OFF -Dprotobuf_BUILD_CONFORMANCE=OFF -Dprotobuf_BUILD_PROTOC_BINARIES=ON
          cmake --build "$PROTOBUF_HOST_BUILD" --target protoc --parallel 2
          HOST_PROTOC="$PROTOBUF_HOST_BUILD/protoc"
          test -x "$HOST_PROTOC"
          echo "HOST_PROTOC=$HOST_PROTOC" >> "$GITHUB_ENV"

      - name: Prepare shadPS4 iOS host tools and patches
        shell: bash
        run: |
          set -euxo pipefail
          KK="$SHADPS4_ENGINE_ROOT/externals/mesa-kosmickrisp"
          MAC_SDK="$(xcrun --sdk macosx --show-sdk-path)"
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          MAC_VER="$(xcrun --sdk macosx --show-sdk-platform-version)"
          LLVM_CONFIG="$LLVM_PREFIX/bin/llvm-config"
          python3 - "$KK/CMakeLists.txt" "$MAC_SDK" "$IOS_SDK" "$LLVM_CONFIG" "$MAC_VER" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); mac,ios,llvm,macver=sys.argv[2:]; s=p.read_text()
          old='set(MESA_ENVIRONMENT_TOOLS\n    LLVM_CONFIG=${KK_LLVM_CONFIG})'
          if old in s:
              s=s.replace(old,f'''set(MESA_ENVIRONMENT_TOOLS\n    LLVM_CONFIG={llvm}\n    SDKROOT={mac}\n    MACOSX_DEPLOYMENT_TARGET={macver}\n    CFLAGS=-isysroot\\ {mac}\\ -mmacosx-version-min={macver}\n    CXXFLAGS=-isysroot\\ {mac}\\ -mmacosx-version-min={macver}\n    LDFLAGS=-isysroot\\ {mac}\\ -mmacosx-version-min={macver})''')
          s=s.replace('set(MESA_CROSS_FILE_TARGET ${MESA_CROSSFILES_DIR}/mesa-${KK_TARGET_ARCHITECTURE}.ini)','set(MESA_CROSS_FILE_TARGET ${MESA_CROSSFILES_DIR}/mesa-ios-aarch64.ini)')
          p.write_text(s)
          PY
          cat > "$KK/crossfiles/mesa-ios-aarch64.ini" <<EOF
          [binaries]
          c='clang'
          cpp='clang++'
          objc='clang'
          objcpp='clang++'
          ar='ar'
          strip='strip'
          [built-in options]
          c_args=['-target','arm64-apple-ios18.0','-isysroot','$IOS_SDK']
          cpp_args=['-target','arm64-apple-ios18.0','-isysroot','$IOS_SDK']
          objc_args=['-target','arm64-apple-ios18.0','-isysroot','$IOS_SDK']
          objcpp_args=['-target','arm64-apple-ios18.0','-isysroot','$IOS_SDK']
          c_link_args=['-target','arm64-apple-ios18.0','-isysroot','$IOS_SDK']
          cpp_link_args=['-target','arm64-apple-ios18.0','-isysroot','$IOS_SDK']
          objc_link_args=['-target','arm64-apple-ios18.0','-isysroot','$IOS_SDK']
          objcpp_link_args=['-target','arm64-apple-ios18.0','-isysroot','$IOS_SDK']
          [host_machine]
          system='darwin'
          cpu_family='aarch64'
          cpu='aarch64'
          endian='little'
          EOF

          WSI="$KK/externals/mesa/src/vulkan/wsi/wsi_common_metal_layer.m"
          python3 - "$WSI" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(); n='   metal_layer.displaySyncEnabled = !enable_immediate;'
          count=s.count(n)
          if count != 2: raise SystemExit(f'Unexpected displaySyncEnabled count: {count}')
          p.write_text(s.replace(n,'#if defined(__ENVIRONMENT_MAC_OS_X_VERSION_MIN_REQUIRED__)\n   metal_layer.displaySyncEnabled = !enable_immediate;\n#endif'))
          PY

          KK_BO="$(find "$KK/externals/mesa" -name kk_bo.c -print -quit)"
          test -n "$KK_BO"
          python3 - "$KK_BO" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(); old='#include <mach/mach_vm.h>'
          if old not in s: raise SystemExit('mach_vm include not found')
          ios='''#if defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)
#include <mach/mach.h>
#include <mach/vm_map.h>
#define mach_vm_address_t vm_address_t
#define mach_vm_size_t vm_size_t
#define mach_vm_offset_t vm_offset_t
extern kern_return_t vm_remap(vm_map_t, vm_address_t*, vm_size_t, vm_address_t, int, vm_map_t, vm_address_t, boolean_t, vm_prot_t*, vm_prot_t*, vm_inherit_t);
extern kern_return_t vm_map(vm_map_t, vm_address_t*, vm_size_t, vm_offset_t, int, mem_entry_name_port_t, vm_offset_t, boolean_t, vm_prot_t, vm_prot_t, vm_inherit_t);
#define mach_vm_remap vm_remap
#define mach_vm_map vm_map
#define mach_vm_deallocate vm_deallocate
#else
#include <mach/mach_vm.h>
#endif'''
          p.write_text(s.replace(old,ios,1))
          PY

          python3 - "$SHADPS4_ENGINE_ROOT/externals/cpp-httplib/httplib.h" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(); a='#define CPPHTTPLIB_HTTPLIB_H'
          if a in s and 'CPPHTTPLIB_DISABLE_MACOSX_AUTOMATIC_ROOT_CERTIFICATES' not in s:
              s=s.replace(a,a+'\n\n#if defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)\n#define CPPHTTPLIB_DISABLE_MACOSX_AUTOMATIC_ROOT_CERTIFICATES\n#endif',1)
          p.write_text(s)
          PY

          python3 - "$SHADPS4_ENGINE_ROOT/src/common/arch.h" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(); old='#elif defined(__aarch64__) || defined(_M_ARM64)'
          if old in s: s=s.replace(old,'#elif defined(__aarch64__) || defined(__arm64__) || defined(_M_ARM64)',1)
          p.write_text(s)
          PY

          echo 'set(ALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO_EXITCODE 0 CACHE STRING "iOS cross compile result" FORCE)' > "$RUNNER_TEMP/maxps4-ios-cache.cmake"

      - name: Configure and build shadPS4 for iOS
        shell: bash
        run: |
          set -euxo pipefail
          IOS_SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          BUILD="$RUNNER_TEMP/shadps4-ios-build"
          LLVM_CONFIG="$LLVM_PREFIX/bin/llvm-config"
          export PATH="$MAXPS4_PYTHON_BIN:$PATH"
          export IPHONEOS_DEPLOYMENT_TARGET=18.0
          cmake -S "$SHADPS4_ENGINE_ROOT" -B "$BUILD" -G Ninja \
            -C "$RUNNER_TEMP/maxps4-ios-cache.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$IOS_SDKROOT" -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO_EXITCODE=0 \
            -DKK_LLVM_CONFIG="$LLVM_CONFIG" -DLLVM_DIR="$LLVM_DIR" \
            -DENABLE_TESTS=OFF -DENABLE_UPDATER=OFF -DENABLE_DISCORD_RPC=OFF
          cmake --build "$BUILD" --parallel 2
          echo "SHADPS4_BUILD_DIR=$BUILD" >> "$GITHUB_ENV"

      - name: Collect shadPS4 static libraries
        shell: bash
        run: |
          set -euxo pipefail
          LIBDIR="$RUNNER_TEMP/shadps4-ios-libs"
          mkdir -p "$LIBDIR"
          find "$SHADPS4_BUILD_DIR" -type f -name '*.a' -print -exec cp -f {} "$LIBDIR/" \;
          COUNT="$(find "$LIBDIR" -type f -name '*.a' | wc -l | tr -d ' ')"
          test "$COUNT" -gt 0
          LINK_FLAGS=""
          for lib in "$LIBDIR"/*.a; do LINK_FLAGS="$LINK_FLAGS $lib"; done
          echo "SHADPS4_LIBRARY_DIR=$LIBDIR" >> "$GITHUB_ENV"
          echo "SHADPS4_LINK_FLAGS=$LINK_FLAGS" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/MaxPS4-iOS"
          xcodegen generate
          test -d MaxPS4.xcodeproj

      - name: Build MaxPS4 for iPhone
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/MaxPS4-iOS"
          BUILD_DIR="$RUNNER_TEMP/maxps4-derived"
          xcodebuild -project MaxPS4.xcodeproj -scheme MaxPS4 -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$BUILD_DIR" \
            SHADPS4_ENGINE_ROOT="$SHADPS4_ENGINE_ROOT" SHADPS4_LIBRARY_DIR="$SHADPS4_LIBRARY_DIR" SHADPS4_LINK_FLAGS="$SHADPS4_LINK_FLAGS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP="$BUILD_DIR/Build/Products/Release-iphoneos/MaxPS4.app"
          test -d "$APP"
          echo "MAXPS4_APP=$APP" >> "$GITHUB_ENV"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail
          PACKAGE="$RUNNER_TEMP/maxps4-package"
          mkdir -p "$PACKAGE/Payload"
          cp -R "$MAXPS4_APP" "$PACKAGE/Payload/MaxPS4.app"
          cd "$PACKAGE"
          /usr/bin/zip -qry "$RUNNER_TEMP/MaxPS4-unsigned.ipa" Payload
          test -s "$RUNNER_TEMP/MaxPS4-unsigned.ipa"

      - name: Upload MaxPS4 IPA
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-unsigned-IPA
          path: ${{ runner.temp }}/MaxPS4-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
