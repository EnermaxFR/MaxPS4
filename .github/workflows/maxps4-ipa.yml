name: Build MaxPS4 IPA

on:
  workflow_dispatch:
  push:
    branches: [ maxps4-shadps4-direct ]
    paths:
      - '.github/workflows/maxps4-ipa.yml'
      - 'MaxPS4-iOS/Sources/**'
      - 'MaxPS4-iOS/Core/**'
      - 'MaxPS4-iOS/project.yml'

jobs:
  build-maxps4-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout MaxPS4
        uses: actions/checkout@v4
      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          brew install xcodegen cmake ninja protobuf llvm spirv-llvm-translator spirv-tools glslang pkgconf || true
          LLVM_PREFIX="$(brew --prefix llvm)"
          SPIRV_PREFIX="$(brew --prefix spirv-llvm-translator)"
          SPIRV_TOOLS_PREFIX="$(brew --prefix spirv-tools)"
          GLSLANG_PREFIX="$(brew --prefix glslang)"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$SPIRV_TOOLS_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$GLSLANG_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LLVM_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"
          echo "LLVM_DIR=$LLVM_PREFIX/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "LLVM_ROOT=$LLVM_PREFIX" >> "$GITHUB_ENV"
          echo "SPIRV_LLVM_TRANSLATOR_ROOT=$SPIRV_PREFIX" >> "$GITHUB_ENV"
          echo "SPIRV_TOOLS_ROOT=$SPIRV_TOOLS_PREFIX" >> "$GITHUB_ENV"
          echo "HOST_GLSLANG_VALIDATOR=$GLSLANG_PREFIX/bin/glslangValidator" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$SPIRV_TOOLS_PREFIX/lib/pkgconfig:$SPIRV_PREFIX/lib/pkgconfig:$LLVM_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$GLSLANG_PREFIX:$SPIRV_TOOLS_PREFIX:$SPIRV_PREFIX:$LLVM_PREFIX:${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/maxps4-python"
          "$RUNNER_TEMP/maxps4-python/bin/python" -m pip install --upgrade pip packaging mako pyyaml meson
          echo "$RUNNER_TEMP/maxps4-python/bin" >> "$GITHUB_PATH"

      - name: Checkout pinned shadPS4 engine
        shell: bash
        run: |
          set -euxo pipefail
          ENGINE_ROOT="$RUNNER_TEMP/shadps4-official"
          git clone https://github.com/shadps4-emu/shadPS4.git "$ENGINE_ROOT"
          git -C "$ENGINE_ROOT" checkout b3452cf6a9bd0969771fcfbf919c359368473d1b
          git -C "$ENGINE_ROOT" submodule update --init --recursive
          echo "SHADPS4_ENGINE_ROOT=$ENGINE_ROOT" >> "$GITHUB_ENV"
          PROTOBUF_HOST_BUILD="$RUNNER_TEMP/protobuf-host-build"
          cmake -S "$ENGINE_ROOT/externals/protobuf" -B "$PROTOBUF_HOST_BUILD" -G Ninja -DCMAKE_BUILD_TYPE=Release -Dprotobuf_BUILD_TESTS=OFF -Dprotobuf_BUILD_EXAMPLES=OFF -Dprotobuf_BUILD_CONFORMANCE=OFF -Dprotobuf_BUILD_PROTOC_BINARIES=ON
          cmake --build "$PROTOBUF_HOST_BUILD" --target protoc --parallel 2
          HOST_PROTOC="$PROTOBUF_HOST_BUILD/protoc"
          test -x "$HOST_PROTOC"
          echo "HOST_PROTOC=$HOST_PROTOC" >> "$GITHUB_ENV"

      - name: Patch iOS compatibility
        shell: bash
        run: |
          set -euxo pipefail
          KK="$SHADPS4_ENGINE_ROOT/externals/mesa-kosmickrisp"
          MAC_SDK="$(xcrun --sdk macosx --show-sdk-path)"
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          MAC_VER="$(xcrun --sdk macosx --show-sdk-platform-version)"
          LLVM_CONFIG="$LLVM_PREFIX/bin/llvm-config"

          python3 - "$KK/CMakeLists.txt" "$MAC_SDK" "$IOS_SDK" "$LLVM_CONFIG" "$MAC_VER" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); mac,ios,llvm,macver=sys.argv[2:]; s=p.read_text()
          old='set(MESA_ENVIRONMENT_TOOLS\n    LLVM_CONFIG=${KK_LLVM_CONFIG})'
          new=f'''set(MESA_ENVIRONMENT_TOOLS\n    LLVM_CONFIG={llvm}\n    SDKROOT={mac}\n    MACOSX_DEPLOYMENT_TARGET={macver}\n    CFLAGS=-isysroot\\ {mac}\\ -mmacosx-version-min={macver}\n    CXXFLAGS=-isysroot\\ {mac}\\ -mmacosx-version-min={macver}\n    LDFLAGS=-isysroot\\ {mac}\\ -mmacosx-version-min={macver})'''
          if old in s: s=s.replace(old,new)
          s=s.replace('set(MESA_CROSS_FILE_TARGET ${MESA_CROSSFILES_DIR}/mesa-${KK_TARGET_ARCHITECTURE}.ini)','set(MESA_CROSS_FILE_TARGET ${MESA_CROSSFILES_DIR}/mesa-ios-aarch64.ini)')
          old_target='set(MESA_ENVIRONMENT_TARGET\n    MACOSX_DEPLOYMENT_TARGET=${CMAKE_OSX_DEPLOYMENT_TARGET}\n    PATH='
          new_target=f'''set(MESA_ENVIRONMENT_TARGET\n    SDKROOT={ios}\n    IPHONEOS_DEPLOYMENT_TARGET=18.0\n    CFLAGS=-target\\ arm64-apple-ios18.0\\ -isysroot\\ {ios}\n    CXXFLAGS=-target\\ arm64-apple-ios18.0\\ -isysroot\\ {ios}\n    OBJCFLAGS=-target\\ arm64-apple-ios18.0\\ -isysroot\\ {ios}\n    OBJCXXFLAGS=-target\\ arm64-apple-ios18.0\\ -isysroot\\ {ios}\n    LDFLAGS=-target\\ arm64-apple-ios18.0\\ -isysroot\\ {ios}\n    PATH='''
          if old_target not in s: raise SystemExit('Mesa target environment anchor not found')
          s=s.replace(old_target,new_target)
          p.write_text(s)
          PY

          cat > "$KK/crossfiles/mesa-ios-aarch64.ini" <<EOF
          [binaries]
          c='clang'
          cpp='clang++'
          objc='clang'
          objcpp='clang++'
          ar='ar'
          strip='strip'
          [built-in options]
          c_args=['-target','arm64-apple-ios18.0','-isysroot','$IOS_SDK']
          cpp_args=['-target','arm64-apple-ios18.0','-isysroot','$IOS_SDK']
          objc_args=['-target','arm64-apple-ios18.0','-isysroot','$IOS_SDK']
          objcpp_args=['-target','arm64-apple-ios18.0','-isysroot','$IOS_SDK']
          c_link_args=['-target','arm64-apple-ios18.0','-isysroot','$IOS_SDK']
          cpp_link_args=['-target','arm64-apple-ios18.0','-isysroot','$IOS_SDK']
          objc_link_args=['-target','arm64-apple-ios18.0','-isysroot','$IOS_SDK']
          objcpp_link_args=['-target','arm64-apple-ios18.0','-isysroot','$IOS_SDK']
          [host_machine]
          system='darwin'
          cpu_family='aarch64'
          cpu='aarch64'
          endian='little'
          EOF

          WSI="$KK/externals/mesa/src/vulkan/wsi/wsi_common_metal_layer.m"
          python3 - "$WSI" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(); n='   metal_layer.displaySyncEnabled = !enable_immediate;'
          s=s.replace(n,'#if defined(__ENVIRONMENT_MAC_OS_X_VERSION_MIN_REQUIRED__)\n   metal_layer.displaySyncEnabled = !enable_immediate;\n#endif')
          p.write_text(s)
          PY

          KK_BO="$(find "$KK/externals/mesa" -name kk_bo.c -print -quit)"
          python3 - "$KK_BO" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(); old='#include <mach/mach_vm.h>'
          ios='#if defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)\n#include <mach/mach.h>\n#include <mach/vm_map.h>\n#define mach_vm_address_t vm_address_t\n#define mach_vm_size_t vm_size_t\n#define mach_vm_offset_t vm_offset_t\n#define mach_vm_remap vm_remap\n#define mach_vm_map vm_map\n#define mach_vm_deallocate vm_deallocate\n#else\n#include <mach/mach_vm.h>\n#endif'
          if old in s: s=s.replace(old,ios,1)
          p.write_text(s)
          PY

          python3 - "$SHADPS4_ENGINE_ROOT/externals/ImGuiFileDialog/ImGuiFileDialog.cpp" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(); pat=re.compile(r'(?P<i>^[ \t]*)(?P<d>(?:const\s+)?int\s+\w+\s*=\s*)std::system\((?P<a>[^;]+)\);',re.M)
          s=pat.sub(lambda m:f"{m.group('i')}#if defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)\n{m.group('i')}{m.group('d')}-1;\n{m.group('i')}#else\n{m.group('i')}{m.group('d')}std::system({m.group('a')});\n{m.group('i')}#endif",s)
          p.write_text(s)
          PY
          python3 - "$SHADPS4_ENGINE_ROOT/src/common/arch.h" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text().replace('#elif defined(__aarch64__) || defined(_M_ARM64)','#elif defined(__aarch64__) || defined(__arm64__) || defined(_M_ARM64)'); p.write_text(s)
          PY

      - name: Configure and build shadPS4 for iOS
        shell: bash
        run: |
          set -euxo pipefail
          IOS_SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          BUILD="$RUNNER_TEMP/shadps4-ios-build"
          LLVM_CONFIG="$LLVM_PREFIX/bin/llvm-config"
          unset MACOSX_DEPLOYMENT_TARGET || true
          export IPHONEOS_DEPLOYMENT_TARGET=18.0
          cmake -S "$SHADPS4_ENGINE_ROOT" -B "$BUILD" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=23 -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_SYSTEM_PROCESSOR=arm64 -DCMAKE_OSX_SYSROOT="$IOS_SDKROOT" -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY -DALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO_EXITCODE=0 -DKK_LLVM_CONFIG="$LLVM_CONFIG" -DLLVM_DIR="$LLVM_DIR" -DENABLE_TESTS=OFF -DENABLE_UPDATER=OFF -DENABLE_DISCORD_RPC=OFF
          cmake --build "$BUILD" --parallel 2
