name: MaxPS4 FEXCore SideStore IPA
on:
  workflow_dispatch:
  push:
    branches: ['codex/ps4-memory-translation-contract', 'integration/ps4-fex-orbis-pkg-validation', 'experiment/orbis-runtime-pkg-v2', 'experiment/orbis-v3-autotests', 'experiment/orbis-mission-198']
    paths:
      - 'MaxPS4-iOS/**'
      - 'scripts/*fexcore*'
      - 'scripts/run-bounded.py'
      - 'cmake/FEXCoreIOSLinkage.cmake'
      - '.github/workflows/fexcore-app.yml'
  pull_request:
    paths:
      - 'MaxPS4-iOS/**'
      - 'scripts/*fexcore*'
      - 'scripts/run-bounded.py'
      - 'cmake/FEXCoreIOSLinkage.cmake'
      - '.github/workflows/fexcore-app.yml'
permissions:
  contents: read
jobs:
  application:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate PKG metadata and runtime preparation before packaging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I MaxPS4-iOS/Native MaxPS4-iOS/Native/maxps4_jit_memory.cpp \
            MaxPS4-iOS/Tests/FEXJITUnsupportedHostTest.cpp -o "$RUNNER_TEMP/jit-host-test"
          "$RUNNER_TEMP/jit-host-test" | tee build/diagnostics/jit-host-abi.txt
          bash scripts/test-orbis-analysis.sh build/diagnostics/game-preflight
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            MaxPS4-iOS/Native/OrbisLinkerBridge.cpp MaxPS4-iOS/Tests/OrbisLinkerTest.cpp -o "$RUNNER_TEMP/orbis-test"
          "$RUNNER_TEMP/orbis-test" | tee build/diagnostics/orbis-tests.txt
          for suite in PS4PKGInventoryTest PS4PKGMetadataTest PS4PFSHeaderDiagnosticTest PS4PFSReadOnlyTest; do
            xcrun clang++ -std=c++17 -Wall -Wextra -Werror -pedantic \
              MaxPS4-iOS/Native/PS4PKGBridge.cpp "MaxPS4-iOS/Tests/$suite.cpp" -o "$RUNNER_TEMP/$suite"
            python3 scripts/run-bounded.py 30 "build/diagnostics/$suite.txt" "$RUNNER_TEMP/$suite"
          done
          swiftc -parse-as-library \
            MaxPS4-iOS/Sources/MaxPS4GuestMemory.swift \
            MaxPS4-iOS/Sources/MaxPS4ELFLoader.swift \
            MaxPS4-iOS/Sources/MaxPS4CPUPrototype.swift \
            MaxPS4-iOS/Tests/ELFLibraryRegressionTest.swift -o "$RUNNER_TEMP/elf-library-test"
          "$RUNNER_TEMP/elf-library-test" | tee build/diagnostics/elf-library-tests.txt
      - name: Test native Metal triangle and compile iPhone shaders
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics
          swiftc -parse-as-library MaxPS4-iOS/Sources/MaxPS4MetalPipeline.swift \
            MaxPS4-iOS/Tests/MetalTriangleTest.swift -o build/metal-triangle-test
          build/metal-triangle-test | tee build/diagnostics/metal-tests.txt
          python3 - <<'PYMETAL'
          from pathlib import Path
          source = Path("MaxPS4-iOS/Sources/MaxPS4MetalPipeline.swift").read_text()
          shader = source.split('"""')[1]
          Path("build/diagnostics/triangle.metal").write_text(shader)
          PYMETAL
          xcrun -sdk iphoneos metal -c build/diagnostics/triangle.metal \
            -o build/diagnostics/triangle.air
          xcrun -sdk iphoneos metallib build/diagnostics/triangle.air \
            -o build/diagnostics/triangle.metallib
      - name: Checkout coherent pinned runtime
        timeout-minutes: 5
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Leviidev/AetherPS4.git build/aether-app
          git -C build/aether-app sparse-checkout set runtime/sources/fexcore-darwin src/core/guest_cpu src/core/ios
          git -C build/aether-app checkout 3347fc13f19860855ce91b66356940989ea6b6a6
          brew install ninja xcodegen
      - name: Test fixed Stik script and real Mach memory ownership
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics
          echo "::group::Compile guest ELF memory test"
          xcrun clang++ -std=c++23 -Wall -Wextra -Werror -I MaxPS4-iOS/Native \
            MaxPS4-iOS/Native/maxps4_guest_elf.cpp \
            MaxPS4-iOS/Tests/GuestELFMemoryTest.cpp -o build/guest-elf-memory-test
          echo "::endgroup::"
          echo "::group::Run guest ELF memory test"
          build/guest-elf-memory-test | tee build/diagnostics/guest-elf-memory-tests.txt
          echo "::endgroup::"
          echo "::group::Run Stik script test"
          node MaxPS4-iOS/Tests/StikScriptTest.js | tee build/diagnostics/stik-script-tests.txt
          swiftc -parse-as-library MaxPS4-iOS/Sources/MaxPS4StikRequest.swift \
            MaxPS4-iOS/Tests/StikRequestTest.swift -o build/stik-request-test
          build/stik-request-test | tee build/diagnostics/stik-request-tests.txt
          echo "::endgroup::"
          echo "::group::Compile JIT memory test"
          xcrun clang++ -std=c++23 -DMAXPS4_TEST_DARWIN_JIT_POOL=1 \
            -I MaxPS4-iOS/Native MaxPS4-iOS/Native/maxps4_jit_memory.cpp \
            MaxPS4-iOS/Tests/FEXJITMemoryTest.cpp -o build/jit-memory-test
          echo "::endgroup::"
          echo "::group::Run JIT memory test"
          build/jit-memory-test | tee build/diagnostics/jit-memory-tests.txt
          echo "::endgroup::"
          echo "::group::Inspect JIT memory leaks"
          python3 scripts/run-bounded.py 60 build/diagnostics/jit-memory-leaks.txt leaks --atExit -- build/jit-memory-test
          echo "::endgroup::"
      - name: Preserve native runtime tests and test the real Swift C bridge on macOS
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          python3 -B MaxPS4-iOS/Tests/IOSSignatureAuditTest.py
          bash scripts/build-fexcore-darwin-ios.sh build/aether-app build/fex-app-host --host-runtime
          swiftc -parse-as-library -D MAXPS4_FEX_APP \
            -import-objc-header MaxPS4-iOS/Native/MaxPS4-Bridging-Header.h \
            MaxPS4-iOS/Sources/MaxPS4GuestMemory.swift \
            MaxPS4-iOS/Sources/MaxPS4ELFLoader.swift \
            MaxPS4-iOS/Sources/MaxPS4CPUPrototype.swift \
            MaxPS4-iOS/Sources/MaxPS4SyntheticELFFEXBridge.swift \
            MaxPS4-iOS/Sources/MaxPS4FEXDiagnostic.swift MaxPS4-iOS/Tests/FEXSwiftDiagnosticTest.swift \
            -L build/fex-app-host -lMaxPS4FEXRuntime \
            -Xlinker -rpath -Xlinker "$PWD/build/fex-app-host" \
            -o build/fex-app-host/swift-fex-test
          python3 scripts/run-bounded.py 60 build/fex-app-host/m1-execution.txt build/fex-app-host/Bin/maxps4-ps4-linked-test --m1
          build/fex-app-host/Bin/maxps4-ps4-linked-test --m1-bundle build/fex-app-host/m1-bundle
          build/fex-app-host/Bin/maxps4-ps4-linked-test --orbis-bundle build/fex-app-host/orbis-bundle
          python3 scripts/run-bounded.py 60 build/fex-app-host/swift-diagnostic-tests.txt build/fex-app-host/swift-fex-test build/fex-app-host/ps4-libkernel-demo.elf build/fex-app-host/orbis-bundle
      - name: Verify V2 Swift C snapshot bridge and redacted export
        shell: bash
        run: |
          set -euo pipefail
          for source in OrbisAnalysisBridge OrbisLinkerBridge PS4PKGBridge; do
            xcrun clang++ -std=c++17 -Wall -Wextra -Werror -c "MaxPS4-iOS/Native/$source.cpp" -o "build/$source-v2.o"
          done
          swiftc -parse-as-library -D MAXPS4_FEX_APP \
            -import-objc-header MaxPS4-iOS/Native/MaxPS4-Bridging-Header.h \
            MaxPS4-iOS/Sources/MaxPS4OrbisTest.swift \
            MaxPS4-iOS/Tests/OrbisV2SwiftBridgeTest.swift \
            build/OrbisAnalysisBridge-v2.o build/OrbisLinkerBridge-v2.o build/PS4PKGBridge-v2.o -lc++ \
            -L build/fex-app-host -lMaxPS4FEXRuntime \
            -Xlinker -rpath -Xlinker "$PWD/build/fex-app-host" \
            -o build/fex-app-host/orbis-v2-swift-test
          python3 scripts/run-bounded.py 30 build/diagnostics/orbis-v2-swift.txt build/fex-app-host/orbis-v2-swift-test
      - name: Test playable guest pixels through real Swift import and native display
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          build/fex-app-host/Bin/maxps4-ps4-linked-test --playable-bundle build/fex-app-host/playable-bundle
          cmp build/fex-app-host/playable-bundle/app.elf MaxPS4-iOS/Resources/PlayableDemo/app.elf
          cmp build/fex-app-host/playable-bundle/provider.prx MaxPS4-iOS/Resources/PlayableDemo/provider.prx
          cp MaxPS4-iOS/Resources/PlayableDemo/maxps4.json build/fex-app-host/playable-bundle/
          python3 scripts/run-bounded.py 60 build/fex-app-host/playable-frames.txt build/fex-app-host/Bin/maxps4-ps4-linked-test --playable-evidence build/fex-app-host/playable-evidence
          swiftc -parse-as-library -D MAXPS4_FEX_APP \
            -import-objc-header MaxPS4-iOS/Native/MaxPS4-Bridging-Header.h \
            MaxPS4-iOS/Sources/MaxPS4PlayableBundle.swift \
            MaxPS4-iOS/Sources/MaxPS4GuestFrameImage.swift \
            MaxPS4-iOS/Tests/PlayableSwiftBridgeTest.swift \
            -L build/fex-app-host -lMaxPS4FEXRuntime \
            -Xlinker -rpath -Xlinker "$PWD/build/fex-app-host" \
            -o build/fex-app-host/playable-swift-test
          python3 scripts/run-bounded.py 60 build/fex-app-host/playable-swift.txt build/fex-app-host/playable-swift-test build/fex-app-host/playable-bundle
      - name: Test actual ELF FEX position transfer and offscreen Metal readback
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library -D MAXPS4_FEX_APP \
            -import-objc-header MaxPS4-iOS/Native/MaxPS4-Bridging-Header.h \
            MaxPS4-iOS/Sources/MaxPS4GuestMemory.swift \
            MaxPS4-iOS/Sources/MaxPS4ELFLoader.swift \
            MaxPS4-iOS/Sources/MaxPS4CPUPrototype.swift \
            MaxPS4-iOS/Sources/MaxPS4SyntheticELFFEXBridge.swift \
            MaxPS4-iOS/Sources/MaxPS4FEXMetalState.swift \
            MaxPS4-iOS/Sources/MaxPS4MetalPipeline.swift \
            MaxPS4-iOS/Tests/FEXMetalIntegrationTest.swift \
            -L build/fex-app-host -lMaxPS4FEXRuntime \
            -Xlinker -rpath -Xlinker "$PWD/build/fex-app-host" \
            -o build/fex-app-host/fex-metal-test
          build/fex-app-host/fex-metal-test | tee build/fex-app-host/fex-metal-tests.txt
          python3 scripts/run-bounded.py 60 build/fex-app-host/fex-metal-leaks.txt leaks --atExit -- build/fex-app-host/fex-metal-test
      - name: Test same ELF arena FEX completion to C++ PM4 to Metal
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang++ -std=c++17 -fobjc-arc -c MaxPS4-iOS/Native/PM4MetalDrawBridge.mm -o build/pm4-fex-bridge.o
          swiftc -parse-as-library -D MAXPS4_FEX_APP -D MAXPS4_PM4_FEX_INTEGRATION \
            -import-objc-header MaxPS4-iOS/Native/MaxPS4-Bridging-Header.h \
            MaxPS4-iOS/Sources/MaxPS4PM4Submission.swift \
            MaxPS4-iOS/Sources/MaxPS4MetalPipeline.swift MaxPS4-iOS/Tests/PM4MetalIntegrationTest.swift \
            build/pm4-fex-bridge.o -lc++ -L build/fex-app-host -lMaxPS4FEXRuntime \
            -Xlinker -rpath -Xlinker "$PWD/build/fex-app-host" -o build/pm4-fex-metal-test
          build/pm4-fex-metal-test | tee build/diagnostics/pm4-fex-metal-tests.txt
      - name: Validate safe Stik trap handling
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++23 MaxPS4-iOS/Tests/StikTrapSafetyTest.cpp \
            -L build/fex-app-host -lMaxPS4FEXRuntime \
            -Wl,-rpath,"$PWD/build/fex-app-host" \
            -o build/fex-app-host/stik-trap-safety-test
          build/fex-app-host/stik-trap-safety-test | tee build/fex-app-host/stik-trap-safety.txt
      - name: Check actual native and Swift heap cleanup on macOS
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run-bounded.py 60 build/fex-app-host/swift-diagnostic-leaks.txt leaks --atExit -- build/fex-app-host/swift-fex-test
      - name: Build full Xcode application and verified re-signable IPA
        timeout-minutes: 15
        run: bash scripts/build-fexcore-app.sh build/aether-app
      - name: Verify isolated Orbis Test IPA and preserve named artifact
        run: |
          python3 scripts/verify-orbis-v2-ipa.py build/MaxPS4-FEXCore-SideStore.ipa
          cp build/MaxPS4-FEXCore-SideStore.ipa build/MaxPS4-Orbis-Mission-198-Test-SideStore.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-Orbis-Mission-198-Test-SideStore
          path: build/MaxPS4-Orbis-Mission-198-Test-SideStore.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Record exact pre-resigning signature and entitlements
        run: python3 scripts/audit-ios-signature.py build/Payload/MaxPS4.app > build/diagnostics/ios-signature.json
      - uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-FEXCore-SideStore
          path: build/MaxPS4-FEXCore-SideStore.ipa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MaxPS4-FEXCore-app-diagnostics
          path: |
            build/diagnostics/
            build/fex-app-host/*.txt
            build/fex-app-host/*.log
            build/fex-app-host/orbis-bundle/**
            build/fex-app-host/playable-bundle/**
            build/fex-app-host/playable-evidence/**
            build/fex-app-ios/*.txt
            build/fex-app-ios/*.log
          retention-days: 14
