name: Build MaxPS4 iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "MaxPS4-iOS/**"
      - ".github/workflows/blank.yml"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          swiftc --version

      - name: Prepare diagnostics directory
        shell: bash
        run: mkdir -p build/diagnostics

      - name: Verify Kero Blaster native launch prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          emulator = Path("MaxPS4-iOS/Sources/MaxPS4Emulator.swift").read_text()
          required = [
              "func launch(_ game: MaxPS4Game)",
              "guard let nativeEngine, nativeEngine.isReady else",
              "try nativeEngine.launchGame(at:",
              'moteur natif non connecté',
          ]
          missing = [item for item in required if item not in emulator]
          if missing:
              raise SystemExit("Kero Blaster launch integration regression: " + repr(missing))
          print("PASS Kero Blaster launch path is guarded by nativeEngine.isReady")
          print("NOT PLAYABLE: readiness guard confirms a safe UI handoff only.")
          print("Full PS4 runtime, graphics, JIT and title-specific execution remain unverified.")
          PY

      - name: Run CPU memory and ELF smoke tests
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library \
            MaxPS4-iOS/Sources/MaxPS4GuestMemory.swift \
            MaxPS4-iOS/Sources/MaxPS4CPUPrototype.swift \
            MaxPS4-iOS/Sources/MaxPS4ELFLoader.swift \
            MaxPS4-iOS/Sources/MaxPS4SELFPrototype.swift \
            MaxPS4-iOS/Tests/PrototypeSmokeTest.swift \
            -o /tmp/maxps4-prototype-tests 2>&1 | tee build/diagnostics/smoke-compile.log
          /tmp/maxps4-prototype-tests 2>&1 | tee build/diagnostics/smoke-results.log

      - name: Compile upstream shadPS4 C++ utility for iOS arm64
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang++ \
            -std=c++23 \
            -target arm64-apple-ios16.0 \
            -isysroot "$SDK" \
            -I MaxPS4-iOS/Native/shadps4 \
            -c MaxPS4-iOS/Native/shadps4/common/string_util.cpp \
            -o build/diagnostics/shadps4-string-util-ios-arm64.o
          xcrun --sdk iphoneos clang++ \
            -std=c++23 \
            -target arm64-apple-ios16.0 \
            -isysroot "$SDK" \
            -I MaxPS4-iOS/Native/shadps4 \
            -c MaxPS4-iOS/Native/shadps4_bridge.cpp \
            -o build/diagnostics/shadps4-bridge-ios-arm64.o
          file build/diagnostics/shadps4-string-util-ios-arm64.o
          xcrun lipo -archs build/diagnostics/shadps4-string-util-ios-arm64.o | grep -w arm64

      - name: Clone complete pinned AetherPS4 engine into MaxPS4 iOS project
        shell: bash
        run: |
          set -euo pipefail
          ENGINE="$GITHUB_WORKSPACE/MaxPS4-iOS/Engine/AetherPS4"
          mkdir -p "$(dirname "$ENGINE")"
          git clone --quiet --filter=blob:none \
            https://github.com/Leviidev/AetherPS4.git "$ENGINE"
          git -C "$ENGINE" checkout --quiet 3347fc13f19860855ce91b66356940989ea6b6a6
          # Keep every upstream source folder, not just sparse CPU/JIT sources.
          test -s "$ENGINE/src/core/fex/fex_guest_engine.cpp"
          test -s "$ENGINE/src/core/guest_cpu/fex_guest_cpu.cpp"
          test -s "$ENGINE/src/core/ios/ios_jit_allocator.cpp"
          test -d "$ENGINE/src/core/libraries"
          test -d "$ENGINE/src/common"
          # Preserve existing build probes while they migrate to Engine/.
          mkdir -p build/diagnostics
          ln -s "$ENGINE" build/diagnostics/aetherps4-upstream
          git -C "$ENGINE" rev-parse HEAD > build/diagnostics/aetherps4-upstream-sha.txt
          echo "Full AetherPS4 source checkout: $ENGINE"
          echo "This clones code for porting: it does not yet link the full emulator."

      - name: Audit AetherPS4 guest CPU integration dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("build/diagnostics/aetherps4-upstream")
          required = [
              "src/core/fex/fex_guest_engine.cpp",
              "src/core/guest_cpu/fex_guest_cpu.cpp",
              "src/core/guest_cpu/guest_cpu.cpp",
              "src/core/ios/ios_jit_allocator.cpp",
          ]
          missing = [path for path in required if not (root / path).is_file()]
          if missing:
              raise SystemExit("Missing pinned AetherPS4 sources: " + ", ".join(missing))
          report = [
              "MaxPS4 - pinned AetherPS4 integration dependency audit",
              "Upstream: Leviidev/AetherPS4 @ 3347fc13f19860855ce91b66356940989ea6b6a6",
              "Status: source audit only; FEXCore not compiled or linked",
              "",
          ]
          for filename in required:
              source = (root / filename).read_text(errors="replace")
              includes = re.findall(r'^\s*#\s*include\s*[<"]([^>"]+)[>"]', source, re.M)
              report.append(filename)
              report.extend("  include: " + name for name in sorted(set(includes)))
              report.append("")
          out = Path("build/diagnostics/aetherps4-dependency-audit.txt")
          out.write_text("\n".join(report) + "\n")
          print("Audited", len(required), "real guest CPU/JIT translation units")
          print("Dependency manifest:", out)
          PY

      - name: Archive pinned AetherPS4 porting sources and dependency report
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-AetherPS4-porting-sources
          path: |
            build/diagnostics/aetherps4-upstream/src/core/fex/
            build/diagnostics/aetherps4-upstream/src/core/guest_cpu/
            build/diagnostics/aetherps4-upstream/src/core/ios/
            build/diagnostics/aetherps4-dependency-audit.txt
            build/diagnostics/aetherps4-upstream-sha.txt
          if-no-files-found: error
          retention-days: 14

      - name: Compile and link actual AetherPS4 guest CPU backend for iOS
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          UPSTREAM="build/diagnostics/aetherps4-upstream"
          xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" -I "$UPSTREAM/src" \
            -c "$UPSTREAM/src/core/guest_cpu/guest_cpu.cpp" \
            -o build/diagnostics/aether-guest-cpu-ios-arm64.o
          xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" -I "$UPSTREAM/src" \
            -c MaxPS4-iOS/Native/aether_guest_cpu_adapter.cpp \
            -o build/diagnostics/aether-guest-adapter-ios-arm64.o
          xcrun lipo -archs build/diagnostics/aether-guest-cpu-ios-arm64.o | grep -w arm64
          echo "PASS: real AetherPS4 GuestCpuBackend compiled for iOS arm64"

      - name: Run real AetherPS4 GuestCpuBackend native ABI regression
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM="build/diagnostics/aetherps4-upstream"
          cat > build/diagnostics/aether-guest-test.cpp <<'CPP'
          #include <cstdio>
          extern "C" int maxps4_aether_guest_backend_probe() noexcept;
          extern "C" int maxps4_aether_restricted_cpu_dispatch_probe() noexcept;
          extern "C" int maxps4_aether_cpu_state_regression() noexcept;
          int main() {
              const bool abi = maxps4_aether_guest_backend_probe() == 1;
              const bool dispatch = maxps4_aether_restricted_cpu_dispatch_probe() == 1;
              std::puts(abi ? "PASS AetherPS4 CPU ABI and failure handling"
                            : "FAIL AetherPS4 CPU ABI and failure handling");
              std::puts(dispatch ? "PASS AetherPS4 to MaxPS4 guest CPU dispatch"
                                 : "FAIL AetherPS4 to MaxPS4 guest CPU dispatch");
              const bool state = maxps4_aether_cpu_state_regression() == 1;
              std::puts(state ? "PASS AetherPS4 CPU 8-state integration regression"
                              : "FAIL AetherPS4 CPU 8-state integration regression");
              return abi && dispatch && state ? 0 : 1;
          }
          CPP
          clang++ -std=c++23 -I "$UPSTREAM/src" -I MaxPS4-iOS/Native/shadps4 \
            "$UPSTREAM/src/core/guest_cpu/guest_cpu.cpp" \
            MaxPS4-iOS/Native/aether_guest_cpu_adapter.cpp \
            MaxPS4-iOS/Native/shadps4_bridge.cpp \
            MaxPS4-iOS/Native/shadps4/common/string_util.cpp \
            build/diagnostics/aether-guest-test.cpp \
            -o build/diagnostics/aether-guest-test
          build/diagnostics/aether-guest-test | tee build/diagnostics/aether-guest-test.log

      - name: Validate pinned FEXCore revision and source prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/diagnostics/aetherps4-upstream")
          lock = root / "runtime/locks/components.lock.json"
          # Runtime lock is outside the previous sparse checkout: collect the
          # pinned revision from AetherPS4's checked-out git tree instead.
          import subprocess
          raw = subprocess.check_output(
              ["git", "-C", str(root), "show",
               "HEAD:runtime/locks/components.lock.json"], text=True)
          components = json.loads(raw)["components"]
          fex = next(c for c in components if c["name"] == "fex")
          expected = "f2b679f6028ce1c38875233aecfcf5d3f8ebecec"
          if fex["revision"] != expected:
              raise SystemExit("Unexpected FEXCore revision: " + fex["revision"])
          required = [
              "Common/Config.h", "Common/HostFeatures.h",
              "FEXCore/Config/Config.h", "FEXCore/Core/Context.h",
              "Interface/Context/Context.h", "Interface/Core/LookupCache.h"
          ]
          report = Path("build/diagnostics/fexcore-build-prerequisites.txt")
          report.write_text(
              "FEXCore repository: " + fex["url"] + "\n" +
              "Revision: " + expected + "\n" +
              "Required FEXCore headers for AetherPS4 guest engine:\n" +
              "\n".join(required) + "\n" +
              "FEXCore compilation: NOT yet attempted.\n")
          print("PASS FEXCore pin verified:", expected)
          PY

      - name: Check AetherPS4 HLE guest-call bridge compiles for iOS
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          UPSTREAM="build/diagnostics/aetherps4-upstream"
          xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" -I "$UPSTREAM/src" \
            -c "$UPSTREAM/src/core/guest_cpu/hle_call_adapter.cpp" \
            -o build/diagnostics/aether-hle-call-adapter-ios-arm64.o
          xcrun lipo -archs build/diagnostics/aether-hle-call-adapter-ios-arm64.o | grep -w arm64
          echo "PASS AetherPS4 HLE adapter compiled to real iOS arm64 object (not linked)"

      - name: Inspect HLE adapter link dependencies before wiring CPU backend
        shell: bash
        run: |
          set -euo pipefail
          OBJ=build/diagnostics/aether-hle-call-adapter-ios-arm64.o
          xcrun nm -u "$OBJ" | sort -u > build/diagnostics/aether-hle-unresolved-symbols.txt
          test -s build/diagnostics/aether-hle-unresolved-symbols.txt
          echo "HLE unresolved symbols recorded; linking deferred until dependencies are satisfied."
          head -35 build/diagnostics/aether-hle-unresolved-symbols.txt

      - name: Report AetherPS4 engine compile status in Actions summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AetherPS4 engine compilation (diagnostic only)"
            echo ""
            echo "A green IPA build does not imply playable PS4 games."
            echo ""
            if test -s build/diagnostics/aether-full-engine/status.txt; then
              echo '~~~text'
              cat build/diagnostics/aether-full-engine/status.txt
              echo '~~~'
              echo ""
              for component in fex_guest_engine fex_guest_cpu guest_cpu ios_jit_allocator psf process memory exception; do
                log="build/diagnostics/aether-full-engine/${component}.log"
                if test -s "$log" && grep -qE 'fatal error:|error:' "$log"; then
                  echo "### ${component}: first compiler errors"
                  echo '~~~text'
                  grep -m 8 -E 'fatal error:|error:' "$log" || true
                  echo '~~~'
                fi
              done
            else
              echo "Guest-engine diagnostic did not run or produced no status file."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe real AetherPS4 HLE adapter for executable linkage
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          OBJ=build/diagnostics/aether-hle-call-adapter-ios-arm64.o
          OUT=build/diagnostics/aether-hle-link-probe.dylib
          if xcrun --sdk iphoneos clang++ -target arm64-apple-ios16.0 \
              -isysroot "$SDK" -dynamiclib -Wl,-undefined,error \
              "$OBJ" -o "$OUT" \
              > build/diagnostics/aether-hle-link.log 2>&1; then
            echo "PASS isolated AetherPS4 HLE adapter link (not a full PS4 engine)" \
              | tee build/diagnostics/aether-hle-link-status.txt
          else
            echo "BLOCKED AetherPS4 HLE adapter: unresolved dependencies" \
              | tee build/diagnostics/aether-hle-link-status.txt
          fi

      - name: Compile AetherPS4 JIT allocator ABI contract (no BRK)
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          UPSTREAM="build/diagnostics/aetherps4-upstream"
          xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" -I "$UPSTREAM/src" \
            -c MaxPS4-iOS/Native/aether_jit_allocator_abi.cpp \
            -o build/diagnostics/aether-jit-abi-ios-arm64.o
          xcrun lipo -archs build/diagnostics/aether-jit-abi-ios-arm64.o | grep -w arm64
          echo "PASS upstream allocator ABI compiled (no JIT allocated)"

      - name: Compile AetherPS4 FEX HLE bridge for iOS ARM64
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          UPSTREAM="build/diagnostics/aetherps4-upstream"
          xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" -I "$UPSTREAM/src" \
            -c "$UPSTREAM/src/core/guest_cpu/fex_hle_bridge.cpp" \
            -o build/diagnostics/aether-fex-hle-bridge-ios-arm64.o
          xcrun lipo -archs build/diagnostics/aether-fex-hle-bridge-ios-arm64.o | grep -w arm64
          xcrun nm -u build/diagnostics/aether-fex-hle-bridge-ios-arm64.o \
            | sort -u > build/diagnostics/aether-fex-hle-required-symbols.txt
          test -s build/diagnostics/aether-fex-hle-required-symbols.txt
          echo "PASS AetherPS4 FEX HLE bridge cross-compiled; dependencies recorded; linking awaits FEXCore"

      - name: Verify FEXCore upstream source availability (pinned)
        shell: bash
        run: |
          set -euo pipefail
          FEX_DIR="build/diagnostics/fexcore-upstream"
          git clone --quiet --no-checkout --filter=blob:none \
            https://github.com/FEX-Emu/FEX.git "$FEX_DIR"
          git -C "$FEX_DIR" sparse-checkout init --cone
          git -C "$FEX_DIR" sparse-checkout set FEXCore Source CodeEmitter FEXHeaderUtils
          git -C "$FEX_DIR" checkout --quiet f2b679f6028ce1c38875233aecfcf5d3f8ebecec
          test -s "$FEX_DIR/FEXCore/include/FEXCore/Core/Context.h"
          echo "PASS pinned FEXCore source headers available"
          echo "NOTE: FEXCore is not yet compiled or linked"

      - name: Prepare fmt headers before AetherPS4 engine compilation
        shell: bash
        run: |
          set -euo pipefail
          if ! brew list --versions fmt >/dev/null 2>&1 ||
             ! test -s "$(brew --prefix fmt)/include/fmt/format.h"; then
            brew install fmt
          fi
          test -s "$(brew --prefix fmt)/include/fmt/format.h"
          echo "PASS fmt headers available before AetherPS4 compile"
          # AetherPS4 also includes spdlog/details/fmt_helper.h through logging/log.h.
          # Merely installing fmt is insufficient: spdlog headers must be present.
          if ! brew list --versions spdlog >/dev/null 2>&1 ||
             ! test -s "$(brew --prefix spdlog)/include/spdlog/details/fmt_helper.h"; then
            brew install spdlog
          fi
          test -s "$(brew --prefix spdlog)/include/spdlog/details/fmt_helper.h"
          echo "PASS spdlog headers available before AetherPS4 compile"
          # emulator_settings.h requires nlohmann/json.hpp during cross-compilation.
          if ! brew list --versions nlohmann-json >/dev/null 2>&1 ||
             ! test -s "$(brew --prefix nlohmann-json)/include/nlohmann/json.hpp"; then
            brew install nlohmann-json
          fi
          test -s "$(brew --prefix nlohmann-json)/include/nlohmann/json.hpp"
          echo "PASS nlohmann/json headers available before AetherPS4 compile"

      - name: Generate FEXCore config for AetherPS4 guest engine probe
        shell: bash
        run: |
          set -euo pipefail
          FEX="build/diagnostics/fexcore-upstream"
          mkdir -p build/diagnostics/fexcore-generated/FEXCore/Config
          python3 "$FEX/FEXCore/Scripts/config_generator.py" \
            "$FEX/FEXCore/Source/Interface/Config/Config.json.in" \
            build/diagnostics/fexcore-generated/FEXCore/Config/ConfigValues.inl \
            build/diagnostics/fexcore-generated/fexcore-options.1 \
            build/diagnostics/fexcore-generated/ConfigArgumentLoader.inc
          test -s build/diagnostics/fexcore-generated/FEXCore/Config/ConfigValues.inl
          # Generate real strenum configuration types from pinned FEXCore JSON.
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path("build/diagnostics/fexcore-upstream/FEXCore/Source/Interface/Config/Config.json.in")
          config = json.loads(source.read_text())
          lines = ["// Generated from the pinned upstream FEXCore Config.json.in", "#ifdef ENUMDEFINES"]
          for group in config["Options"].values():
              for name, option in group.items():
                  if option["Type"] != "strenum":
                      continue
                  lines.append("enum class " + name + " : uint64_t {")
                  lines.append("  OFF = 0,")
                  for index, key in enumerate(option["Enums"]):
                      lines.append("  " + key.upper() + " = 1ULL << " + str(index) + ",")
                  lines.append("};")
                  lines.append("FEX_DEF_NUM_OPS(" + name + ")")
          lines.append("#endif")
          dest = Path("build/diagnostics/fexcore-generated/FEXCore/Config/ConfigOptions.inl")
          dest.write_text("\\n".join(lines) + "\\n")
          PY
          test -s build/diagnostics/fexcore-generated/FEXCore/Config/ConfigOptions.inl

      - name: Prepare unordered_dense headers for AetherPS4 guest engine
        shell: bash
        run: |
          set -euo pipefail
          # Fetch the exact upstream unordered_dense submodule dependency.
          UNORDERED="build/diagnostics/unordered-dense-upstream"
          git clone --quiet --no-checkout --filter=blob:none \
            https://github.com/martinus/unordered_dense.git "$UNORDERED"
          git -C "$UNORDERED" checkout --quiet 3234af2c03549bc85656bfd3a86993bf1cd8aef1
          test -s "$UNORDERED/include/ankerl/unordered_dense.h"
          echo "PASS unordered_dense headers available before AetherPS4 compile"

      - name: Prepare Darwin FEXCore mutex before AetherPS4 cross-compilation
        shell: bash
        run: |
          set -euo pipefail
          # Experimental Darwin adaptation of FEXCore Linux futex mutex, compile probe only.
          # C++20 atomic wait/notify keeps sleeping threads off a busy spin loop.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/diagnostics/fexcore-upstream/FEXCore/include/FEXCore/Utils/WritePriorityMutex.h")
          s = p.read_text()
          s = s.replace("#if !defined(_WIN32)\n#include <linux/futex.h>", "#if defined(__APPLE__)\n// Darwin uses C++20 atomic wait/notify below.\n#elif !defined(_WIN32)\n#include <linux/futex.h>", 1)
          start = s.index("private:\n\n#if !defined(_WIN32)\n  void FutexWaitForWriteAvailable")
          insert = """private:

          #if defined(__APPLE__)
            void FutexWaitForWriteAvailable(uint32_t expected) {
              std::atomic_ref<uint32_t>(Futex).wait(expected, std::memory_order_relaxed);
            }
            void FutexWaitForReadAvailable(uint32_t expected) {
              std::atomic_ref<uint32_t>(Futex).wait(expected, std::memory_order_relaxed);
            }
            void FutexWakeWriter() {
              std::atomic_ref<uint32_t>(Futex).notify_all();
            }
            void FutexWakeReaders() {
              std::atomic_ref<uint32_t>(Futex).notify_all();
            }
          #elif !defined(_WIN32)"""
          s = s[:start] + s[start:].replace("private:\n\n#if !defined(_WIN32)", insert, 1)
          p.write_text(s)
          PY

      - name: Port FEXCore scoped signal mask to Darwin pthread API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/diagnostics/fexcore-upstream/FEXCore/include/FEXCore/Utils/SignalScopeGuards.h")
          code = p.read_text()
          old = """    ::syscall(SYS_rt_sigprocmask, SIG_SETMASK, &Mask, &*OriginalMask, sizeof(*OriginalMask));"""
          new = """#ifdef __APPLE__
            sigset_t RequestedMask;
            sigemptyset(&RequestedMask);
            for (int signal = 1; signal < NSIG && signal <= 64; ++signal) {
              if (Mask & (uint64_t{1} << (signal - 1))) {
                sigaddset(&RequestedMask, signal);
              }
            }
            sigset_t PreviousMask;
            if (pthread_sigmask(SIG_SETMASK, &RequestedMask, &PreviousMask) == 0) {
              DarwinOriginalMask = PreviousMask;
            }
          #else
            ::syscall(SYS_rt_sigprocmask, SIG_SETMASK, &Mask, &*OriginalMask, sizeof(*OriginalMask));
          #endif"""
          if old not in code:
              raise SystemExit("Pinned FEXCore signal-mask constructor changed")
          code = code.replace(old, new, 1)
          old_dtor = """      ::syscall(SYS_rt_sigprocmask, SIG_SETMASK, &OriginalMask, nullptr, sizeof(*OriginalMask));"""
          new_dtor = """#ifndef __APPLE__
                ::syscall(SYS_rt_sigprocmask, SIG_SETMASK, &OriginalMask, nullptr, sizeof(*OriginalMask));
              #endif"""
          if old_dtor not in code:
              raise SystemExit("Pinned FEXCore signal-mask destructor changed")
          code = code.replace(old_dtor, new_dtor, 1)
          code = code.replace("    rhs.OriginalMask.reset();", """    rhs.OriginalMask.reset();
          #ifdef __APPLE__
            DarwinOriginalMask = rhs.DarwinOriginalMask;
            rhs.DarwinOriginalMask.reset();
          #endif""", 1)
          code = code.replace("  std::optional<uint64_t> OriginalMask {};", """  std::optional<uint64_t> OriginalMask {};
          #ifdef __APPLE__
            std::optional<sigset_t> DarwinOriginalMask {};
          #endif""", 1)
          code = code.replace("    if (OriginalMask) {\n#ifndef __APPLE__", """#ifdef __APPLE__
            if (DarwinOriginalMask) {
              pthread_sigmask(SIG_SETMASK, &*DarwinOriginalMask, nullptr);
            }
          #endif
            if (OriginalMask) {
          #ifndef __APPLE__""", 1)
          p.write_text(code)
          print("PASS Darwin FEXCore signal masking adapted to pthread_sigmask (native probe only)")
          PY

      - name: Select ARM64 cycle counter in pinned FEXCore stats on iOS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/diagnostics/fexcore-upstream/FEXCore/include/FEXCore/Utils/SHMStats.h")
          code = p.read_text()
          old = "#ifdef ARCHITECTURE_arm64"
          new = "#if defined(ARCHITECTURE_arm64) || defined(__aarch64__)"
          if code.count(old) != 1:
              raise SystemExit("Unexpected pinned FEXCore cycle-counter conditional")
          p.write_text(code.replace(old, new, 1))
          print("PASS FEXCore ARM64 cycle counter branch selected for Apple clang")
          PY

      - name: Adapt pinned AetherPS4 logging API to packaged spdlog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/diagnostics/aetherps4-upstream/src/common/logging/log.h")
          code = p.read_text()
          # The pinned AetherPS4 header assumes a nested source_loc::basename
          # helper and treats spdlog::level as a type. Current spdlog APIs use
          # level::level_enum and do not have that basename helper.
          substitutions = {
              "to_string_view(spdlog::level lvl)": "to_string_view(spdlog::level::level_enum lvl)",
              "spdlog::source_loc::basename(__FILE__)": "__FILE__",
              "level_to_number(lvl)": "static_cast<std::size_t>(lvl)",
          }
          for old, new in substitutions.items():
              if old not in code:
                  raise SystemExit(f"Cannot patch unexpected AetherPS4 logging API: {old}")
              code = code.replace(old, new)
          p.write_text(code)
          # Upstream uses a custom async_sink absent from stock Homebrew spdlog.
          # Use the upstream synchronous sink path for iOS compile/link probes.
          # Keep the upstream repository untouched; patch only this CI checkout.
          impl = Path("build/diagnostics/aetherps4-upstream/src/common/logging/log.cpp")
          logging = impl.read_text()
          required = [
              "#include <spdlog/sinks/async_sink.h>",
              "std::initializer_list<spdlog::sink_ptr> async_sink{",
              "EmulatorSettings.IsLogSync() ? sinks : async_sink",
          ]
          for token in required:
              if token not in logging:
                  raise SystemExit(f"Unexpected AetherPS4 async logging API: {token}")
          logging = logging.replace("#include <spdlog/sinks/async_sink.h>", "")
          begin = logging.index("    std::initializer_list<spdlog::sink_ptr> async_sink{")
          end = logging.index("    std::initializer_list<spdlog::sink_ptr> dup_filter{", begin)
          logging = logging[:begin] + logging[end:]
          logging = logging.replace("EmulatorSettings.IsLogSync() ? sinks : async_sink", "sinks")
          # Match the real packaged spdlog API: log_msg::level and
          # spdlog::level::from_str (rather than custom fork symbols).
          logging = logging.replace("spdlog::level_from_str(", "spdlog::level::from_str(")
          # spdlog::level is a namespace in packaged spdlog, not a type.
          # Preserve enum values such as spdlog::level::info; adapt only type positions.
          logging = logging.replace("std::unordered_map<spdlog::level, LogColor>", "std::unordered_map<spdlog::level::level_enum, LogColor>")
          logging = logging.replace("spdlog::level default_log_level", "spdlog::level::level_enum default_log_level")
          logging = logging.replace("std::unordered_map<std::string, spdlog::level>", "std::unordered_map<std::string, spdlog::level::level_enum>")
          impl.write_text(logging)
          sink_header = Path("build/diagnostics/aetherps4-upstream/src/common/logging/log_file_sink.h")
          sink_code = sink_header.read_text()
          if "msg.log_level" not in sink_code:
              raise SystemExit("Unexpected upstream spdlog message field in log_file_sink.h")
          sink_header.write_text(sink_code.replace("msg.log_level", "msg.level"))
          print("PASS iOS port adapted spdlog levels and log message fields")
          print("PASS iOS port uses real synchronous spdlog sinks; unavailable upstream async sink removed")
          print("PASS pinned AetherPS4 logging API adapted in ephemeral build tree")
          PY

      - name: Prepare AetherPS4 supplemental headers and FEXCore generated IR
