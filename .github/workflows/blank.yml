      - name: Adapt optional AetherPS4 diagnostics to pinned FEXCore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/diagnostics/aetherps4-upstream/src/core/fex/fex_guest_engine.cpp")
          source = p.read_text()
          for fn in ("BachataDumpHostCodeWords", "BachataDescribeHostFaultAddress"):
              begin = source.index("bool " + fn + "(")
              end = source.index("\n}\n", begin)
              fragment = source[begin:end]
              target = "#if defined(__APPLE__) && TARGET_OS_IPHONE"
              if target not in fragment:
                  raise SystemExit("Unexpected pinned diagnostic source: " + fn)
              source = source[:begin] + fragment.replace(target, "#if 0 // Optional diagnostic unavailable in pinned FEXCore", 1) + source[end:]
          call = "  return exec.Context->DumpDispatcherStateForDiagnostics(exec.Thread, out_buf, out_buf_size);"
          if source.count(call) != 1:
              raise SystemExit("Unexpected pinned dispatcher diagnostic source")
          source = source.replace(call, "  return false; // Dispatcher snapshot API unavailable in pinned FEXCore.", 1)
          p.write_text(source)
          print("PASS optional pinned-FEXCore crash diagnostics guarded")
          PY

      - name: Audit AetherPS4 iOS JIT contracts against pinned FEXCore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("build/diagnostics")
          engine = (root / "aetherps4-upstream/src/core/fex/fex_guest_engine.cpp").read_text()
          allocator = (root / "aetherps4-upstream/src/core/ios/ios_jit_allocator.h").read_text()
          fex = (root / "fexcore-upstream/FEXCore/include/FEXCore/Utils/AllocatorHooks.h").read_text()
          expected = (
              "ScopedJITWriteProtect",
              "GetWritableAddress",
              "GetExecutableAddress",
              "OnBufferReusedInPlace",
              "BeginBufferInvalidationSafepoint",
          )
          lines = ["Pinned AetherPS4 / FEXCore iOS JIT contract audit",
                   "Source-only checks; no claim of JIT execution or game compatibility."]
          for name in expected:
              used = name in engine
              declared = name in fex
              state = "AVAILABLE" if declared else "MISSING"
              lines.append(f"{state}: {name} (AetherPS4 refers to symbol: {used})")
          for name in ("DualMappedRegion", "rw_addr", "rx_addr"):
              lines.append(f"{'AVAILABLE' if name in allocator else 'MISSING'}: iOS allocator {name}")
          report = root / "aether-full-engine/jit-runtime-contracts.txt"
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text("\\n".join(lines) + "\\n")
          print(report.read_text())
          PY

      - name: Probe real AetherPS4 guest engine and CPU compilation for iOS
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          ROOT="build/diagnostics/aetherps4-upstream"
          mkdir -p build/diagnostics/aether-full-engine
          : > build/diagnostics/aether-full-engine/status.txt
          for source in \
            src/common/logging/log.cpp \
            src/common/thread.cpp \
            src/core/fex/fex_guest_engine.cpp \
            src/core/guest_cpu/fex_guest_cpu.cpp \
            src/core/guest_cpu/guest_cpu.cpp \
            src/core/ios/ios_jit_allocator.cpp \
            src/core/file_format/psf.cpp \
            src/core/libraries/kernel/process.cpp \
            src/core/libraries/kernel/memory.cpp \
            src/core/libraries/kernel/threads/exception.cpp; do
            base="$(basename "$source" .cpp)"
            output="build/diagnostics/aether-full-engine/${base}.o"
            log="build/diagnostics/aether-full-engine/${base}.log"
            if xcrun --sdk iphoneos clang++ -std=c++23 \
                 -target arm64-apple-ios16.0 -isysroot "$SDK" \
                 -DFMT_HEADER_ONLY=1 \
                 -D MADV_HUGEPAGE=0 -D MADV_NOHUGEPAGE=0 \
                 -I "build/diagnostics/fexcore-generated" \
                 -I "$ROOT/src" -I "build/diagnostics/fexcore-upstream" \
                 -I "build/diagnostics/fexcore-upstream/FEXCore/include" \
                 -I "build/diagnostics/fexcore-upstream/FEXCore/Source" \
                 -I "build/diagnostics/fexcore-upstream/Source" \
                 -I "MaxPS4-iOS/Native/compat/fex_ios" \
                 -I "build/diagnostics/unordered-dense-upstream/include" \
                 -I "$(brew --prefix fmt)/include" \
                 -I "$(brew --prefix spdlog)/include" \
                 -I "$(brew --prefix nlohmann-json)/include" \
                 -I "$(brew --prefix boost)/include" \
                 -I "build/diagnostics/robin-map-upstream/include" \
                 -c "$ROOT/$source" -o "$output" \
                 > "$log" 2>&1; then
              echo "PASS compile $source (linking and guest execution unverified)" \
                | tee -a build/diagnostics/aether-full-engine/status.txt
              xcrun nm -u "$output" | sort -u \
                > "build/diagnostics/aether-full-engine/${base}-unresolved.txt"
            else
              echo "BLOCKED compile $source; inspect $log for dependencies" \
                | tee -a build/diagnostics/aether-full-engine/status.txt
              # Surface the first actionable errors for EVERY component, not just
              # the guest CPU entries: a green Swift IPA hides these failures.
              grep -m 5 -E 'fatal error:|error:' "$log" \
                | tee -a build/diagnostics/aether-full-engine/status.txt || true
            fi
          done
          # Keep a machine-readable build matrix for the porting steps.
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = Path("build/diagnostics/aether-full-engine")
          sources = [
              "fex_guest_engine", "fex_guest_cpu", "guest_cpu", "ios_jit_allocator",
              "psf", "process", "memory", "exception",
          ]
          results = []
          for name in sources:
              obj = d / (name + ".o")
              log = d / (name + ".log")
              results.append({
                  "component": name,
                  "compiled": obj.is_file(),
                  "first_errors": [
                      line.strip() for line in log.read_text(errors="replace").splitlines()
                      if "error:" in line
                  ][:8] if log.exists() else [],
              })
          (d / "component-matrix.json").write_text(json.dumps(results, indent=2) + "\\n")
          PY
          # Surface concrete compiler errors in the job log, not just a
          # generic BLOCKED line hidden inside the diagnostics directory.
          for log in build/diagnostics/aether-full-engine/*.log; do
            test -f "$log" || continue
            if test -s "$log"; then
              echo "::group::AetherPS4 compiler diagnostics: $log"
              grep -m 25 -E 'fatal error:|error:|warning:' "$log" || tail -25 "$log"
              echo "::endgroup::"
            fi
          done
          # This exploration must not break the working MaxPS4 IPA.
          echo "No full guest engine is selected for shipping without resolved dependencies."

      - name: Upload AetherPS4 guest engine compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-AetherPS4-full-engine-diagnostics
          path: build/diagnostics/aether-full-engine/
          if-no-files-found: ignore
          retention-days: 14

      - name: Compile pinned FEXCore guest ISA header against iOS arm64 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          FEX="build/diagnostics/fexcore-upstream"
          cat > build/diagnostics/fexcore-ios-header-probe.cpp <<'CPP'
          #include <FEXCore/Core/X86Enums.h>
          // Compile-only probe of a real FEXCore API header, not a JIT run.
          int maxps4_fexcore_header_probe() { return 1; }
          CPP
          xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" -I "$FEX/FEXCore/include" \
            -c build/diagnostics/fexcore-ios-header-probe.cpp \
            -o build/diagnostics/fexcore-ios-header-probe.o
          xcrun lipo -archs build/diagnostics/fexcore-ios-header-probe.o | grep -w arm64
          echo "PASS pinned FEXCore header compiled for native iOS arm64 (JIT not linked)"

      - name: Probe real FEXCore IR implementation compilation for iOS
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          FEX="build/diagnostics/fexcore-upstream"
          SRC="$FEX/FEXCore/Source/Interface/Core/Addressing.cpp"
          test -s "$SRC"
          # Generate FEXCore's real IR definitions from upstream IR.json.
          # These are build-generated files, not handwritten stubs.
          mkdir -p build/diagnostics/fexcore-generated/FEXCore/IR
          python3 "$FEX/FEXCore/Scripts/json_ir_generator.py" \
            "$FEX/FEXCore/Source/Interface/IR/IR.json" \
            build/diagnostics/fexcore-generated/FEXCore/IR/IRDefines.inc \
            build/diagnostics/fexcore-generated/FEXCore/IR/IRDispatch.inc
          # FEXCore's LogManager.h directly includes fmt/format.h.
          # fmt is header-only for this compile-only experiment: do not link
          # macOS Homebrew libraries into the iOS executable.
          if ! brew list --versions fmt >/dev/null 2>&1 || ! test -s "$(brew --prefix fmt)/include/fmt/format.h"; then
            brew install fmt
          fi
          FMT_INCLUDE="$(brew --prefix fmt)/include"
          test -s "$FMT_INCLUDE/fmt/format.h"
          if xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
              -isysroot "$SDK" -I "$FEX/FEXCore/include" \
              -D MADV_HUGEPAGE=0 -D MADV_NOHUGEPAGE=0 \
              -I "build/diagnostics/fexcore-generated" \
              -I "MaxPS4-iOS/Native/compat/fex_ios" \
              -I "$FEX/CodeEmitter" -I "$FEX/FEXHeaderUtils" \
              -I "$FEX/FEXCore/Source" -I "$FEX/Source" -I "$FMT_INCLUDE" \
              -c "$SRC" -o build/diagnostics/fexcore-addressing-ios-arm64.o \
              > build/diagnostics/fexcore-ir-compile.log 2>&1; then
            echo "PASS real FEXCore IR Addressing.cpp compiled for iOS arm64" \
              | tee build/diagnostics/fexcore-ir-status.txt
          else
            echo "BLOCKED FEXCore IR Addressing.cpp: inspect fexcore-ir-compile.log for missing prerequisites" \
              | tee build/diagnostics/fexcore-ir-status.txt
            head -45 build/diagnostics/fexcore-ir-compile.log
          fi
          # Replace the Linux-only signal mask guard in the CI copy with
          # POSIX pthread_sigmask for Darwin. This is a source-porting probe,
          # not a runtime JIT entitlement or executable-memory workaround.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/diagnostics/fexcore-upstream/FEXCore/include/FEXCore/Utils/SignalScopeGuards.h")
          s = p.read_text()
          start = s.index("class ScopedSignalMasker final {")
          stop = s.index("\n/**", start)
          replacement = """class ScopedSignalMasker final {
          public:
            explicit ScopedSignalMasker(uint64_t Mask) {
              sigset_t requested {};
              sigemptyset(&requested);
              for (int signal_number = 1; signal_number <= 64; ++signal_number) {
                if (Mask & (uint64_t{1} << (signal_number - 1))) {
                  sigaddset(&requested, signal_number);
                }
              }
              Active = pthread_sigmask(SIG_SETMASK, &requested, &OriginalMask) == 0;
            }
            ScopedSignalMasker(const ScopedSignalMasker&) = delete;
            ScopedSignalMasker& operator=(const ScopedSignalMasker&) = delete;
            ScopedSignalMasker(ScopedSignalMasker&& other)
              : OriginalMask(other.OriginalMask), Active(other.Active) {
              other.Active = false;
            }
            ~ScopedSignalMasker() {
              if (Active) pthread_sigmask(SIG_SETMASK, &OriginalMask, nullptr);
            }
          private:
            sigset_t OriginalMask {};
            bool Active = false;
          };
          """
          s = s[:start] + replacement + s[stop:]
          p.write_text(s)
          PY
          # Generate FEXCore's real config schema required by JIT headers.
          mkdir -p build/diagnostics/fexcore-generated/FEXCore/Config
          python3 "$FEX/FEXCore/Scripts/config_generator.py" \
            "$FEX/FEXCore/Source/Interface/Config/Config.json.in" \
            build/diagnostics/fexcore-generated/FEXCore/Config/ConfigValues.inl \
            build/diagnostics/fexcore-generated/fexcore-options.1 \
            build/diagnostics/fexcore-generated/ConfigArgumentLoader.inc
          # Generate real strenum configuration types from pinned FEXCore JSON.
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path("build/diagnostics/fexcore-upstream/FEXCore/Source/Interface/Config/Config.json.in")
          config = json.loads(source.read_text())
          lines = ["// Generated from the pinned upstream FEXCore Config.json.in", "#ifdef ENUMDEFINES"]
          for group in config["Options"].values():
              for name, option in group.items():
                  if option["Type"] != "strenum":
                      continue
                  lines.append("enum class " + name + " : uint64_t {")
                  lines.append("  OFF = 0,")
                  for index, key in enumerate(option["Enums"]):
                      lines.append("  " + key.upper() + " = 1ULL << " + str(index) + ",")
                  lines.append("};")
                  lines.append("FEX_DEF_NUM_OPS(" + name + ")")
          lines.append("#endif")
          dest = Path("build/diagnostics/fexcore-generated/FEXCore/Config/ConfigOptions.inl")
          dest.write_text("\\n".join(lines) + "\\n")
          PY
          # Reuse unordered_dense fetched in the earlier preparation step.
          # Re-cloning into the same nonempty directory fails with Git exit 128.
          UNORDERED="build/diagnostics/unordered-dense-upstream"
          test -s "$UNORDERED/include/ankerl/unordered_dense.h"
          test "$(git -C "$UNORDERED" rev-parse HEAD)" = "3234af2c03549bc85656bfd3a86993bf1cd8aef1"
          # Generate IR instruction definitions and dispatch tables from upstream IR.json.
          mkdir -p build/diagnostics/fexcore-generated/FEXCore/IR
          python3 "$FEX/FEXCore/Scripts/json_ir_generator.py" \
            "$FEX/FEXCore/Source/Interface/IR/IR.json" \
            build/diagnostics/fexcore-generated/FEXCore/IR/IRDefines.inc \
            build/diagnostics/fexcore-generated/FEXCore/IR/IRDefines_Dispatch.inc
          test -s build/diagnostics/fexcore-generated/FEXCore/IR/IRDefines_Dispatch.inc
          # Second real FEXCore JIT-related implementation probe.
          JIT_SRC="$FEX/FEXCore/Source/Interface/Core/JIT/Arm64Relocations.cpp"
          test -s "$JIT_SRC"
          if xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
              -isysroot "$SDK" -I "$FEX/FEXCore/include" \
              -D ARCHITECTURE_arm64=1 -D MADV_HUGEPAGE=0 -D MADV_NOHUGEPAGE=0 \
              -I "build/diagnostics/fexcore-generated" \
              -I "MaxPS4-iOS/Native/compat/fex_ios" \
              -I "$FEX/CodeEmitter" -I "$FEX/FEXHeaderUtils" \
              -I "$UNORDERED/include" \
              -I "$FEX/FEXCore/Source" -I "$FEX/Source" -I "$FMT_INCLUDE" \
              -c "$JIT_SRC" -o build/diagnostics/fexcore-arm64-relocations-ios.o \
              > build/diagnostics/fexcore-arm64-relocations-compile.log 2>&1; then
            echo "PASS FEXCore JIT Arm64Relocations.cpp compiled for iOS arm64" \
              | tee build/diagnostics/fexcore-arm64-relocations-status.txt
          else
            echo "BLOCKED FEXCore JIT Arm64Relocations.cpp; check compiler log" \
              | tee build/diagnostics/fexcore-arm64-relocations-status.txt
            head -30 build/diagnostics/fexcore-arm64-relocations-compile.log
          fi
          # Probe the central upstream ARM64 JIT implementation after relocations.
          # This is a compiler diagnostic only; no generated code executes on iOS.
          # Validate the two upstream headers that failed in builds #807/#808.
          # Keep this as an isolated compile-only probe, without iOS JIT execution.
          cat > build/diagnostics/fexcore-jit-abi-probe.cpp <<'CPP'
          #ifndef __aarch64__
          #error Target must be ARM64
          #endif
          #ifndef ARCHITECTURE_arm64
          #error FEXCore ARM64 architecture macro is not defined
          #endif
          #include <FEXCore/Utils/SHMStats.h>
          #include "Utils/MemberFunctionToPointer.h"
          static_assert(sizeof(FEXCore::SHMStats::ThreadStats) % 16 == 0);
          CPP
          if xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
              -isysroot "$SDK" -DARCHITECTURE_arm64=1 \
              -I "$FEX/FEXCore/include" -I "$FEX/FEXCore/Source" \
              -I "$FEX/CodeEmitter" -I "$FEX/FEXHeaderUtils" \
              -I "build/diagnostics/fexcore-generated" -I "$FMT_INCLUDE" \
              -I "$UNORDERED/include" -fsyntax-only \
              build/diagnostics/fexcore-jit-abi-probe.cpp \
              > build/diagnostics/fexcore-jit-abi-compile.log 2>&1; then
            echo "PASS FEXCore ARM64 JIT headers compile for iOS" \
              | tee build/diagnostics/fexcore-jit-abi-status.txt
          else
            echo "BLOCKED FEXCore ARM64 JIT header ABI probe" \
              | tee build/diagnostics/fexcore-jit-abi-status.txt
            head -20 build/diagnostics/fexcore-jit-abi-compile.log
          fi
          # Snapshot actual Clang macros using the identical iOS target and FEX flags.
          # A green IPA build is not proof that this exploratory JIT compiles.
          printf '#include <FEXCore/Utils/SHMStats.h>\n' > build/diagnostics/fexcore-jit-macros.cpp
          xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
              -isysroot "$SDK" -DARCHITECTURE_arm64=1 \
              -I "$FEX/FEXCore/include" -dM -E \
              build/diagnostics/fexcore-jit-macros.cpp \
              > build/diagnostics/fexcore-jit-defined-macros.txt \
              2> build/diagnostics/fexcore-jit-macro-errors.log || true
          grep -E '^#define (__aarch64__|__arm64__|ARCHITECTURE_arm64|ARCHITECTURE_x86_64)([[:space:]]|$)' \
              build/diagnostics/fexcore-jit-defined-macros.txt \
              | tee build/diagnostics/fexcore-jit-architecture-macros.txt || true
          # Cross-check what Clang actually defined, not merely the requested -D.
          if grep -Eq '^#define ARCHITECTURE_arm64[[:space:]]+1([[:space:]]|$)' \
              build/diagnostics/fexcore-jit-defined-macros.txt \
              && grep -Eq '^#define __aarch64__[[:space:]]+1([[:space:]]|$)' \
              build/diagnostics/fexcore-jit-defined-macros.txt; then
            echo "PASS actual Clang iOS ARM64 macros" \
              | tee build/diagnostics/fexcore-jit-macro-status.txt
          else
            echo "BLOCKED missing iOS ARM64 macros (check Clang preprocessor output)" \
              | tee build/diagnostics/fexcore-jit-macro-status.txt
          fi
          JIT_CORE="$FEX/FEXCore/Source/Interface/Core/JIT/JIT.cpp"
          rm -f build/diagnostics/fexcore-jit-core-ios.o
          # Check architecture feature macro before probing the real JIT translation unit.
          # Required by SHMStats and member-function-pointer ABI helpers.
          printf '#ifndef ARCHITECTURE_arm64\n#error ARM64 macro missing\n#endif\n' \
            | xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
                -DARCHITECTURE_arm64=1 -x c++ -fsyntax-only -
          if xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
              -ferror-limit=0 -fno-color-diagnostics \
              -isysroot "$SDK" -I "$FEX/FEXCore/include" \
              -DARCHITECTURE_arm64=1 -D MADV_HUGEPAGE=0 -D MADV_NOHUGEPAGE=0 \
              -I "build/diagnostics/fexcore-generated" \
              -I "MaxPS4-iOS/Native/compat/fex_ios" \
              -I "$FEX/CodeEmitter" -I "$FEX/FEXHeaderUtils" \
              -I "$UNORDERED/include" \
              -I "$FEX/FEXCore/Source" -I "$FEX/Source" -I "$FMT_INCLUDE" \
              -c "$JIT_CORE" -o build/diagnostics/fexcore-jit-core-ios.o \
              > build/diagnostics/fexcore-jit-core-compile.log 2>&1 \
              && test -s build/diagnostics/fexcore-jit-core-ios.o \
              && xcrun lipo -archs build/diagnostics/fexcore-jit-core-ios.o \
                | grep -Eq '(^|[[:space:]])arm64([[:space:]]|$)'; then
            echo "PASS FEXCore central JIT.cpp compiled as Mach-O arm64 for iOS" \
              | tee build/diagnostics/fexcore-jit-core-status.txt
          else
            echo "BLOCKED FEXCore central JIT.cpp; compile or Mach-O arm64 validation failed" \
              | tee build/diagnostics/fexcore-jit-core-status.txt
            head -25 build/diagnostics/fexcore-jit-core-compile.log
          fi
          # Emit a machine-readable classification of the real JIT.cpp build.
          # This is diagnostic-only; the working IPA must still be generated.
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          base = Path("build/diagnostics")
          logfile = base / "fexcore-jit-core-compile.log"
          obj = base / "fexcore-jit-core-ios.o"
          status_path = base / "fexcore-jit-core-status.txt"
          status = status_path.read_text(errors="replace").strip() if status_path.exists() else "MISSING"
          content = logfile.read_text(errors="replace") if logfile.exists() else ""
          error_lines = [line for line in content.splitlines()
                         if re.search(r"(?:fatal )?error:", line)]
          categories = {
              "missing_headers": sum("file not found" in line for line in error_lines),
              "architecture_intrinsics": sum(
                  any(token in line for token in ("__rdtscp", "__builtin_ia32", "__x86"))
                  for line in error_lines),
              "architecture_abi": sum(
                  "Don't know how to cast Member" in line for line in error_lines),
              "other_errors": 0,
          }
          categories["other_errors"] = max(
              0, len(error_lines) - sum(categories.values()))
          report = {
              "source": "FEXCore/Source/Interface/Core/JIT/JIT.cpp",
              "target": "arm64-apple-ios16.0",
              "object_produced": obj.is_file() and obj.stat().st_size > 0,
              "compile_and_architecture_passed": status.startswith("PASS "),
              "compiler_status": status,
              "error_count": len(error_lines),
              "categories": categories,
              "first_errors": error_lines[:20],
              "runtime_jit_tested": False,
          }
          (base / "fexcore-jit-core-report.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n")
          print("FEXCore JIT compile report:", json.dumps(report))
          PY
          # Confirm the produced object is genuinely Mach-O arm64 rather than
          # accepting an accidental host-architecture compilation.
          if test -s build/diagnostics/fexcore-jit-core-ios.o; then
            if xcrun lipo -archs build/diagnostics/fexcore-jit-core-ios.o \
                | grep -Eq '(^|[[:space:]])arm64([[:space:]]|$)'; then
              echo "PASS genuine FEXCore JIT.cpp Mach-O arm64 object" \
                | tee build/diagnostics/fexcore-jit-object-arch-status.txt
            else
              echo "BLOCKED JIT.cpp object has wrong architecture" \
                | tee build/diagnostics/fexcore-jit-object-arch-status.txt
            fi
          else
            echo "BLOCKED no FEXCore JIT.cpp object to verify" \
              | tee build/diagnostics/fexcore-jit-object-arch-status.txt
          fi
          # Report unresolved symbols of the genuine JIT object if compilation succeeds.
          # This is a link-dependency inventory, not JIT execution on iOS.
          if test -s build/diagnostics/fexcore-jit-core-ios.o; then
            xcrun --sdk iphoneos nm -u build/diagnostics/fexcore-jit-core-ios.o \
              > build/diagnostics/fexcore-jit-core-undefined-symbols.txt 2>&1 || true
            echo "JIT.cpp object produced; unresolved symbol inventory saved" \
              | tee build/diagnostics/fexcore-jit-link-readiness.txt
          else
            echo "JIT.cpp object not produced; linking remains blocked" \
              | tee build/diagnostics/fexcore-jit-link-readiness.txt
          fi
          # Second genuine FEXCore JIT compilation unit: arithmetic emitter.
          ALU_SRC="$FEX/FEXCore/Source/Interface/Core/JIT/ALUOps.cpp"
          test -s "$ALU_SRC"
          if xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
              -isysroot "$SDK" -I "$FEX/FEXCore/include" \
              -D ARCHITECTURE_arm64=1 -D MADV_HUGEPAGE=0 -D MADV_NOHUGEPAGE=0 \
              -I "build/diagnostics/fexcore-generated" \
              -I "MaxPS4-iOS/Native/compat/fex_ios" \
              -I "$FEX/CodeEmitter" -I "$FEX/FEXHeaderUtils" \
              -I "$UNORDERED/include" \
              -I "$FEX/FEXCore/Source" -I "$FEX/Source" -I "$FMT_INCLUDE" \
              -c "$ALU_SRC" -o build/diagnostics/fexcore-jit-alu-ios.o \
              > build/diagnostics/fexcore-jit-alu-compile.log 2>&1; then
            echo "PASS FEXCore JIT ALUOps.cpp compiled for iOS arm64" \
              | tee build/diagnostics/fexcore-jit-alu-status.txt
          else
            echo "BLOCKED FEXCore JIT ALUOps.cpp; inspect compile log" \
              | tee build/diagnostics/fexcore-jit-alu-status.txt
            head -30 build/diagnostics/fexcore-jit-alu-compile.log
          fi
          # Compile the real CPUBackend implementation required by JIT.cpp.
          # Do not fabricate missing symbols or bundle unverified code.
          CPU_BACKEND="$FEX/FEXCore/Source/Interface/Core/CPUBackend.cpp"
          if test -s "$CPU_BACKEND" &&
              xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
                -ferror-limit=0 -fno-color-diagnostics -isysroot "$SDK" \
                -DARCHITECTURE_arm64=1 -DMADV_HUGEPAGE=0 -DMADV_NOHUGEPAGE=0 \
                -I "$FEX/FEXCore/include" \
                -I "build/diagnostics/fexcore-generated" \
                -I "MaxPS4-iOS/Native/compat/fex_ios" \
                -I "$FEX/CodeEmitter" -I "$FEX/FEXHeaderUtils" \
                -I "$UNORDERED/include" \
                -I "$FEX/FEXCore/Source" -I "$FEX/Source" -I "$FMT_INCLUDE" \
                -c "$CPU_BACKEND" \
                -o build/diagnostics/fexcore-cpu-backend-ios.o \
                > build/diagnostics/fexcore-cpu-backend-compile.log 2>&1; then
            echo "PASS FEXCore CPUBackend.cpp compiled for iOS arm64" \
              | tee build/diagnostics/fexcore-cpu-backend-status.txt
          else
            echo "BLOCKED FEXCore CPUBackend.cpp port; inspect compiler output" \
              | tee build/diagnostics/fexcore-cpu-backend-status.txt
          fi
          # Discover and compile real upstream emitter/cache translation units.
          # Compilation is exploratory: unresolved runtime dependencies remain
          # visible and no unverified objects are shipped in the IPA.
          python3 - <<'PY'
          from pathlib import Path
          base = Path("build/diagnostics/fexcore-upstream")
          names = ("arm64emitter", "lookupcache", "longjump", "logmanager", "logging")
          matches = sorted(
              str(p) for p in base.rglob("*.cpp")
              if any(name in p.stem.lower() for name in names)
          ) if base.exists() else []
          Path("build/diagnostics/fexcore-missing-components.txt").write_text(
              "\n".join(matches) + ("\n" if matches else
              "No matching ARM64 emitter/cache/jump/logging .cpp files found.\n")
          )
          print(Path("build/diagnostics/fexcore-missing-components.txt").read_text())
          PY
          : > build/diagnostics/fexcore-extra-compile-status.txt
          FEX_EXTRA_OBJECTS=()
          : > build/diagnostics/fexcore-extra-objects.txt
          extra_index=0
          while IFS= read -r source; do
            test -f "$source" || continue
            output="build/diagnostics/fexcore-extra-${extra_index}-ios.o"
            log="build/diagnostics/fexcore-extra-${extra_index}-compile.log"
            if xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
                -fno-color-diagnostics -isysroot "$SDK" \
                -DARCHITECTURE_arm64=1 -DMADV_HUGEPAGE=0 -DMADV_NOHUGEPAGE=0 \
                -I "$FEX/FEXCore/include" \
                -I "build/diagnostics/fexcore-generated" \
                -I "MaxPS4-iOS/Native/compat/fex_ios" \
                -I "$FEX/CodeEmitter" -I "$FEX/FEXHeaderUtils" \
                -I "$UNORDERED/include" \
                -I "$FEX/FEXCore/Source" -I "$FEX/Source" -I "$FMT_INCLUDE" \
                -c "$source" -o "$output" > "$log" 2>&1; then
              FEX_EXTRA_OBJECTS+=("$output")
              printf '%s\n' "$output" >> build/diagnostics/fexcore-extra-objects.txt
              echo "PASS $source" >> build/diagnostics/fexcore-extra-compile-status.txt
            else
              echo "BLOCKED $source (see $log)" >> build/diagnostics/fexcore-extra-compile-status.txt
            fi
            extra_index=$((extra_index + 1))
          done < build/diagnostics/fexcore-missing-components.txt
          # Prepare a real static archive of upstream FEXCore ARM64 JIT objects.
          # Archiving does not resolve external symbols or enable executable memory.
          rm -f build/diagnostics/libMaxPS4FEXJITProbe.a
          JIT_OBJECTS=(
            build/diagnostics/fexcore-jit-core-ios.o
            build/diagnostics/fexcore-jit-alu-ios.o
            build/diagnostics/fexcore-arm64-relocations-ios.o
          )
          # Include only successfully compiled upstream emitter/cache objects.
          if test "${#FEX_EXTRA_OBJECTS[@]}" -gt 0; then
            JIT_OBJECTS+=("${FEX_EXTRA_OBJECTS[@]}")
          fi
          # Add the real CPUBackend only when its independent iOS build passed.
          # A failed optional port must not invalidate the proven JIT archive.
          if grep -q '^PASS FEXCore CPUBackend.cpp compiled' \
              build/diagnostics/fexcore-cpu-backend-status.txt &&
              test -s build/diagnostics/fexcore-cpu-backend-ios.o; then
            JIT_OBJECTS+=(build/diagnostics/fexcore-cpu-backend-ios.o)
          fi
          if test -s "${JIT_OBJECTS[0]}" && test -s "${JIT_OBJECTS[1]}" \
              && test -s "${JIT_OBJECTS[2]}"; then
            if xcrun libtool -static -o build/diagnostics/libMaxPS4FEXJITProbe.a \
                "${JIT_OBJECTS[@]}" \
                > build/diagnostics/fexcore-jit-archive.log 2>&1 \
                && xcrun lipo -archs build/diagnostics/libMaxPS4FEXJITProbe.a \
                | grep -Eq '(^|[[:space:]])arm64([[:space:]]|$)'; then
              if xcrun ar -t build/diagnostics/libMaxPS4FEXJITProbe.a \
                  > build/diagnostics/fexcore-jit-archive-members.txt \
                  && python3 - <<'PY'
          from pathlib import Path
          members = Path("build/diagnostics/fexcore-jit-archive-members.txt").read_text().splitlines()
          # Apple's ar may expose a ranlib symbol table alongside actual objects.
          actual = sorted(member for member in members if not member.startswith("__.SYMDEF"))
          expected = sorted((
              "fexcore-jit-core-ios.o",
              "fexcore-jit-alu-ios.o",
              "fexcore-arm64-relocations-ios.o",
          ))
          cpu_backend = Path("build/diagnostics/fexcore-cpu-backend-status.txt").read_text()
          if cpu_backend.startswith("PASS FEXCore CPUBackend.cpp compiled"):
              expected.append("fexcore-cpu-backend-ios.o")
          manifest = Path("build/diagnostics/fexcore-extra-objects.txt").read_text().splitlines()
          expected += sorted(Path(path).name for path in manifest)
          if actual != sorted(expected):
              raise SystemExit(f"Incorrect FEXCore archive members: expected={sorted(expected)}, actual={actual}")
          print(f"PASS {len(expected)} upstream FEXCore ARM64 archive members")
          PY
          then
                xcrun nm -u build/diagnostics/libMaxPS4FEXJITProbe.a \
                  > build/diagnostics/fexcore-jit-archive-undefined-symbols.txt 2>&1 || true
                echo "PASS FEXCore JIT ARM64 static archive created; not yet linked" \
                  | tee build/diagnostics/fexcore-jit-archive-status.txt
              else
                echo "BLOCKED FEXCore JIT archive member inventory" \
                  | tee build/diagnostics/fexcore-jit-archive-status.txt
              fi
            else
              echo "BLOCKED FEXCore JIT archive construction" \
                | tee build/diagnostics/fexcore-jit-archive-status.txt
            fi
          else
            echo "BLOCKED FEXCore JIT archive: required objects missing" \
              | tee build/diagnostics/fexcore-jit-archive-status.txt
          fi
          # Avoid accidental reuse of a previously generated relocatable object.
          rm -f build/diagnostics/fexcore-jit-partial-link.o
          # Partial link of the three genuine FEXCore JIT units. Undefined
          # references remain permitted; this does not make the JIT executable.
          if grep -q '^PASS FEXCore JIT ARM64 static archive' \
              build/diagnostics/fexcore-jit-archive-status.txt; then
            if xcrun ld -r -arch arm64 \
                -o build/diagnostics/fexcore-jit-partial-link.o \
                "${JIT_OBJECTS[@]}" \
                > build/diagnostics/fexcore-jit-partial-link.log 2>&1 \
                && test -s build/diagnostics/fexcore-jit-partial-link.o \
                && xcrun lipo -archs build/diagnostics/fexcore-jit-partial-link.o \
                  | grep -Eq '(^|[[:space:]])arm64([[:space:]]|$)'; then
              # Save an accurate symbol inventory from a single nm invocation.
              # An empty output is valid; a nonzero exit code is a failure.
              if xcrun nm -u -j build/diagnostics/fexcore-jit-partial-link.o \
                  > build/diagnostics/fexcore-jit-partial-undefined-symbols.txt \
                  2> build/diagnostics/fexcore-jit-nm-error.log; then
                if xcrun --find c++filt >/dev/null 2>&1; then
                  # Mach-O prefixes each C++ symbol with an extra underscore.
                  # Remove only that prefix before Itanium ABI demangling.
                  sed 's/^_//' build/diagnostics/fexcore-jit-partial-undefined-symbols.txt \
                    | xcrun c++filt \
                    | sort -u > build/diagnostics/fexcore-jit-partial-demangled-symbols.txt
                else
                  sort -u build/diagnostics/fexcore-jit-partial-undefined-symbols.txt \
                    > build/diagnostics/fexcore-jit-partial-demangled-symbols.txt
                fi
                # Group genuinely unresolved symbols by implementation family.
                python3 - <<'PY'
          from pathlib import Path
          import json
          source = Path("build/diagnostics/fexcore-jit-partial-demangled-symbols.txt")
          lines = sorted(set(line.strip() for line in source.read_text().splitlines() if line.strip()))
          groups = {
              "CPUBackend": [], "Arm64Emitter": [], "LookupCache": [],
              "UncheckedLongJump": [], "LogMan": [],
              "Other FEXCore": [], "External/runtime": [],
          }
          for symbol in lines:
              if "CPUBackend" in symbol:
                  group = "CPUBackend"
              elif "Arm64Emitter" in symbol:
                  group = "Arm64Emitter"
              elif "LookupCache" in symbol:
                  group = "LookupCache"
              elif "UncheckedLongJump" in symbol:
                  group = "UncheckedLongJump"
              elif "LogMan::" in symbol:
                  group = "LogMan"
              elif "FEXCore" in symbol or "FEX::" in symbol:
                  group = "Other FEXCore"
              else:
                  group = "External/runtime"
              groups[group].append(symbol)
          target = Path("build/diagnostics/fexcore-unresolved-families.json")
          target.write_text(json.dumps({
              "total": len(lines),
              "groups": {key: {"count": len(items), "examples": items[:20]}
                         for key, items in groups.items()}
          }, indent=2) + "\n")
          print("FEXCore unresolved symbol families:", {k: len(v) for k, v in groups.items()})
          PY
                echo "PASS FEXCore ARM64 partial link; symbol inventory collected" \
                  | tee build/diagnostics/fexcore-jit-partial-link-status.txt
              else
                echo "BLOCKED FEXCore ARM64 symbol inventory; nm failed" \
                  | tee build/diagnostics/fexcore-jit-partial-link-status.txt
              fi
            else
              echo "BLOCKED FEXCore ARM64 partial link; inspect linker log" \
                | tee build/diagnostics/fexcore-jit-partial-link-status.txt
            fi
          else
            echo "SKIPPED partial link: JIT archive not validated" \
              | tee build/diagnostics/fexcore-jit-partial-link-status.txt
          fi
          # Force-load every JIT object into a temporary iOS dylib to expose
          # actual unresolved link dependencies. This is never shipped in IPA.
          if grep -q '^PASS FEXCore JIT ARM64 static archive' \
              build/diagnostics/fexcore-jit-archive-status.txt; then
            rm -f build/diagnostics/libMaxPS4FEXJITLinkProbe.dylib
            if xcrun --sdk iphoneos clang++ \
                -target arm64-apple-ios16.0 -isysroot "$SDK" \
                -dynamiclib -Wl,-undefined,error \
                -Wl,-force_load,build/diagnostics/libMaxPS4FEXJITProbe.a \
                -Wl,-dead_strip_dylibs \
                -o build/diagnostics/libMaxPS4FEXJITLinkProbe.dylib \
                > build/diagnostics/fexcore-jit-full-link.log 2>&1; then
              echo "PASS isolated full linker dependency check (not executable JIT)" \
                | tee build/diagnostics/fexcore-jit-full-link-status.txt
            else
              echo "BLOCKED isolated full link: dependencies in fexcore-jit-full-link.log" \
                | tee build/diagnostics/fexcore-jit-full-link-status.txt
            fi
          else
            echo "SKIPPED full link: JIT archive not validated" \
              | tee build/diagnostics/fexcore-jit-full-link-status.txt
          fi
          # Exploratory compile only: do not link until prerequisites are resolved.
          # A blocked FEXCore component must not prevent a working MaxPS4 IPA.

      - name: Report actual FEXCore iOS compilation status
        if: always()
        shell: bash
        run: |
          {
            echo '## FEXCore iOS — compilation réelle'
            if test -f build/diagnostics/fexcore-ir-status.txt; then
              cat build/diagnostics/fexcore-ir-status.txt
              if test -f build/diagnostics/fexcore-arm64-relocations-status.txt; then
                cat build/diagnostics/fexcore-arm64-relocations-status.txt
              fi
              if test -f build/diagnostics/fexcore-jit-architecture-macros.txt; then
                echo '### Macros detectées par Clang (cible iOS arm64)'
                echo '```text'
                cat build/diagnostics/fexcore-jit-architecture-macros.txt
                echo '```'
              fi
              if test -f build/diagnostics/fexcore-jit-macro-status.txt; then
                cat build/diagnostics/fexcore-jit-macro-status.txt
              fi
              if test -f build/diagnostics/fexcore-jit-abi-status.txt; then
                cat build/diagnostics/fexcore-jit-abi-status.txt
              fi
              if test -f build/diagnostics/fexcore-jit-core-status.txt; then
                cat build/diagnostics/fexcore-jit-core-status.txt
              fi
              if test -f build/diagnostics/fexcore-jit-object-arch-status.txt; then
                cat build/diagnostics/fexcore-jit-object-arch-status.txt
              fi
              if test -f build/diagnostics/fexcore-jit-link-readiness.txt; then
                cat build/diagnostics/fexcore-jit-link-readiness.txt
              fi
              if test -f build/diagnostics/fexcore-jit-archive-status.txt; then
                cat build/diagnostics/fexcore-jit-archive-status.txt
              fi
              if test -f build/diagnostics/fexcore-jit-alu-status.txt; then
                cat build/diagnostics/fexcore-jit-alu-status.txt
              fi
              echo ''
              echo '### Diagnostics du véritable JIT FEXCore'
              for unit in jit-core jit-alu arm64-relocations; do
                log="build/diagnostics/fexcore-${unit}-compile.log"
                if test -f "$log" && test -s "$log"; then
                  echo "#### ${unit}"
                  echo '```text'
                  grep -m 12 -E 'error:|fatal error:|warning:' "$log" || head -12 "$log"
                  echo '```'
                fi
              done
              echo ''
              echo '### Premières erreurs ou avertissements'
              echo '```text'
              head -30 build/diagnostics/fexcore-ir-compile.log 2>/dev/null || true
              echo '```'
            else
              echo 'Test non exécuté.'
            fi
            echo ''
            echo 'Une compilation réussie de Addressing.cpp ne signifie pas que FEXCore ou le JIT sont exécutables.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize actual FEXCore JIT linking readiness
        if: always()
        shell: bash
        run: |
          {
            echo '## Liaison FEXCore ARM64 — état vérifié'
            for report in \
              fexcore-jit-core-status.txt \
              fexcore-jit-alu-status.txt \
              fexcore-arm64-relocations-status.txt \
              fexcore-jit-archive-status.txt \
              fexcore-jit-partial-link-status.txt \
              fexcore-jit-full-link-status.txt; do
              if test -f "build/diagnostics/$report"; then
                cat "build/diagnostics/$report"
              else
                echo "NOT RUN: $report"
              fi
            done
            echo ''
            if test -f build/diagnostics/fexcore-jit-partial-undefined-symbols.txt; then
              echo "Symboles externes restants : $(wc -l < build/diagnostics/fexcore-jit-partial-undefined-symbols.txt | tr -d ' ')"
            fi
            echo 'Attention : archive et liaison partielle ne signifient pas JIT exécutable sur iOS.'
          } >> "$GITHUB_STEP_SUMMARY"

