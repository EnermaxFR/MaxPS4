            build/diagnostics/fexcore-jit-architecture-macros.txt
            build/diagnostics/fexcore-jit-macro-errors.log
            build/diagnostics/fexcore-jit-core-status.txt
            build/diagnostics/fexcore-jit-core-compile.log
            build/diagnostics/fexcore-jit-core-report.json
