name: Build MaxPS4 iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "MaxPS4-iOS/**"
      - ".github/workflows/blank.yml"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          swiftc --version

      - name: Prepare diagnostics directory
        shell: bash
        run: mkdir -p build/diagnostics

      - name: Run CPU memory and ELF smoke tests
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library \
            MaxPS4-iOS/Sources/MaxPS4GuestMemory.swift \
            MaxPS4-iOS/Sources/MaxPS4CPUPrototype.swift \
            MaxPS4-iOS/Sources/MaxPS4ELFLoader.swift \
            MaxPS4-iOS/Sources/MaxPS4SELFPrototype.swift \
            MaxPS4-iOS/Tests/PrototypeSmokeTest.swift \
            -o /tmp/maxps4-prototype-tests 2>&1 | tee build/diagnostics/smoke-compile.log
          /tmp/maxps4-prototype-tests 2>&1 | tee build/diagnostics/smoke-results.log

      - name: Compile upstream shadPS4 C++ utility for iOS arm64
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang++ \
            -std=c++23 \
            -target arm64-apple-ios16.0 \
            -isysroot "$SDK" \
            -I MaxPS4-iOS/Native/shadps4 \
            -c MaxPS4-iOS/Native/shadps4/common/string_util.cpp \
            -o build/diagnostics/shadps4-string-util-ios-arm64.o
          xcrun --sdk iphoneos clang++ \
            -std=c++23 \
            -target arm64-apple-ios16.0 \
            -isysroot "$SDK" \
            -I MaxPS4-iOS/Native/shadps4 \
            -c MaxPS4-iOS/Native/shadps4_bridge.cpp \
            -o build/diagnostics/shadps4-bridge-ios-arm64.o
          file build/diagnostics/shadps4-string-util-ios-arm64.o
          xcrun lipo -archs build/diagnostics/shadps4-string-util-ios-arm64.o | grep -w arm64

      - name: Fetch pinned AetherPS4 CPU and iOS JIT source for porting audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics/aetherps4-upstream
          git clone --quiet --no-checkout --filter=blob:none \
            https://github.com/Leviidev/AetherPS4.git build/diagnostics/aetherps4-upstream
          cd build/diagnostics/aetherps4-upstream
          git sparse-checkout init --cone
          git sparse-checkout set src/core/fex src/core/guest_cpu src/core/ios src/common
          git checkout --quiet 3347fc13f19860855ce91b66356940989ea6b6a6
          test -s src/core/fex/fex_guest_engine.cpp
          test -s src/core/guest_cpu/fex_guest_cpu.cpp
          test -s src/core/ios/ios_jit_allocator.cpp
          echo "AetherPS4 pinned revision: $(git rev-parse HEAD)"
          echo "CPU / FEX / iOS JIT sources resolved for porting audit."
          echo "NOTE: sources are not yet built or linked into MaxPS4."
          git -C . rev-parse HEAD > ../aetherps4-upstream-sha.txt
          # Keep Git metadata for the audit; avoid macOS runner cleanup races.

      - name: Audit AetherPS4 guest CPU integration dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("build/diagnostics/aetherps4-upstream")
          required = [
              "src/core/fex/fex_guest_engine.cpp",
              "src/core/guest_cpu/fex_guest_cpu.cpp",
              "src/core/guest_cpu/guest_cpu.cpp",
              "src/core/ios/ios_jit_allocator.cpp",
          ]
          missing = [path for path in required if not (root / path).is_file()]
          if missing:
              raise SystemExit("Missing pinned AetherPS4 sources: " + ", ".join(missing))
          report = [
              "MaxPS4 - pinned AetherPS4 integration dependency audit",
              "Upstream: Leviidev/AetherPS4 @ 3347fc13f19860855ce91b66356940989ea6b6a6",
              "Status: source audit only; FEXCore not compiled or linked",
              "",
          ]
          for filename in required:
              source = (root / filename).read_text(errors="replace")
              includes = re.findall(r'^\s*#\s*include\s*[<"]([^>"]+)[>"]', source, re.M)
              report.append(filename)
              report.extend("  include: " + name for name in sorted(set(includes)))
              report.append("")
          out = Path("build/diagnostics/aetherps4-dependency-audit.txt")
          out.write_text("\n".join(report) + "\n")
          print("Audited", len(required), "real guest CPU/JIT translation units")
          print("Dependency manifest:", out)
          PY

      - name: Archive pinned AetherPS4 porting sources and dependency report
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-AetherPS4-porting-sources
          path: |
            build/diagnostics/aetherps4-upstream/src/core/fex/
            build/diagnostics/aetherps4-upstream/src/core/guest_cpu/
            build/diagnostics/aetherps4-upstream/src/core/ios/
            build/diagnostics/aetherps4-dependency-audit.txt
            build/diagnostics/aetherps4-upstream-sha.txt
          if-no-files-found: error
          retention-days: 14

      - name: Compile and link actual AetherPS4 guest CPU backend for iOS
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          UPSTREAM="build/diagnostics/aetherps4-upstream"
          xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" -I "$UPSTREAM/src" \
            -c "$UPSTREAM/src/core/guest_cpu/guest_cpu.cpp" \
            -o build/diagnostics/aether-guest-cpu-ios-arm64.o
          xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" -I "$UPSTREAM/src" \
            -c MaxPS4-iOS/Native/aether_guest_cpu_adapter.cpp \
            -o build/diagnostics/aether-guest-adapter-ios-arm64.o
          xcrun lipo -archs build/diagnostics/aether-guest-cpu-ios-arm64.o | grep -w arm64
          echo "PASS: real AetherPS4 GuestCpuBackend compiled for iOS arm64"

      - name: Run real AetherPS4 GuestCpuBackend native ABI regression
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM="build/diagnostics/aetherps4-upstream"
          cat > build/diagnostics/aether-guest-test.cpp <<'CPP'
          #include <cstdio>
          extern "C" int maxps4_aether_guest_backend_probe() noexcept;
          int main() {
              const bool success = maxps4_aether_guest_backend_probe() == 1;
              std::puts(success ? "PASS AetherPS4 CPU ABI and failure handling"
                                : "FAIL AetherPS4 CPU ABI and failure handling");
              return success ? 0 : 1;
          }
          CPP
          clang++ -std=c++23 -I "$UPSTREAM/src" \
            "$UPSTREAM/src/core/guest_cpu/guest_cpu.cpp" \
            MaxPS4-iOS/Native/aether_guest_cpu_adapter.cpp \
            build/diagnostics/aether-guest-test.cpp \
            -o build/diagnostics/aether-guest-test
          build/diagnostics/aether-guest-test | tee build/diagnostics/aether-guest-test.log

      - name: Validate pinned FEXCore revision and source prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/diagnostics/aetherps4-upstream")
          lock = root / "runtime/locks/components.lock.json"
          # Runtime lock is outside the previous sparse checkout: collect the
          # pinned revision from AetherPS4's checked-out git tree instead.
          import subprocess
          raw = subprocess.check_output(
              ["git", "-C", str(root), "show",
               "HEAD:runtime/locks/components.lock.json"], text=True)
          components = json.loads(raw)["components"]
          fex = next(c for c in components if c["name"] == "fex")
          expected = "f2b679f6028ce1c38875233aecfcf5d3f8ebecec"
          if fex["revision"] != expected:
              raise SystemExit("Unexpected FEXCore revision: " + fex["revision"])
          required = [
              "Common/Config.h", "Common/HostFeatures.h",
              "FEXCore/Config/Config.h", "FEXCore/Core/Context.h",
              "Interface/Context/Context.h", "Interface/Core/LookupCache.h"
          ]
          report = Path("build/diagnostics/fexcore-build-prerequisites.txt")
          report.write_text(
              "FEXCore repository: " + fex["url"] + "\n" +
              "Revision: " + expected + "\n" +
              "Required FEXCore headers for AetherPS4 guest engine:\n" +
              "\n".join(required) + "\n" +
              "FEXCore compilation: NOT yet attempted.\n")
          print("PASS FEXCore pin verified:", expected)
          PY

      - name: Check AetherPS4 HLE guest-call bridge compiles for iOS
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          UPSTREAM="build/diagnostics/aetherps4-upstream"
          xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" -I "$UPSTREAM/src" \
            -c "$UPSTREAM/src/core/guest_cpu/hle_call_adapter.cpp" \
            -o build/diagnostics/aether-hle-call-adapter-ios-arm64.o
          xcrun lipo -archs build/diagnostics/aether-hle-call-adapter-ios-arm64.o | grep -w arm64
          echo "PASS AetherPS4 HLE adapter compiled to real iOS arm64 object (not linked)"

      - name: Inspect HLE adapter link dependencies before wiring CPU backend
        shell: bash
        run: |
          set -euo pipefail
          OBJ=build/diagnostics/aether-hle-call-adapter-ios-arm64.o
          xcrun nm -u "$OBJ" | sort -u > build/diagnostics/aether-hle-unresolved-symbols.txt
          test -s build/diagnostics/aether-hle-unresolved-symbols.txt
          echo "HLE unresolved symbols recorded; linking deferred until dependencies are satisfied."
          head -35 build/diagnostics/aether-hle-unresolved-symbols.txt

      - name: Compile AetherPS4 JIT allocator ABI contract (no BRK)
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          UPSTREAM="build/diagnostics/aetherps4-upstream"
          xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" -I "$UPSTREAM/src" \
            -c MaxPS4-iOS/Native/aether_jit_allocator_abi.cpp \
            -o build/diagnostics/aether-jit-abi-ios-arm64.o
          xcrun lipo -archs build/diagnostics/aether-jit-abi-ios-arm64.o | grep -w arm64
          echo "PASS upstream allocator ABI compiled (no JIT allocated)"

      - name: Compile AetherPS4 FEX HLE bridge for iOS ARM64
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          UPSTREAM="build/diagnostics/aetherps4-upstream"
          xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" -I "$UPSTREAM/src" \
            -c "$UPSTREAM/src/core/guest_cpu/fex_hle_bridge.cpp" \
            -o build/diagnostics/aether-fex-hle-bridge-ios-arm64.o
          xcrun lipo -archs build/diagnostics/aether-fex-hle-bridge-ios-arm64.o | grep -w arm64
          xcrun nm -u build/diagnostics/aether-fex-hle-bridge-ios-arm64.o \
            | sort -u > build/diagnostics/aether-fex-hle-required-symbols.txt
          test -s build/diagnostics/aether-fex-hle-required-symbols.txt
          echo "PASS AetherPS4 FEX HLE bridge cross-compiled; dependencies recorded; linking awaits FEXCore"

      - name: Verify FEXCore upstream source availability (pinned)
        shell: bash
        run: |
          set -euo pipefail
          FEX_DIR="build/diagnostics/fexcore-upstream"
          git clone --quiet --no-checkout --filter=blob:none \
            https://github.com/FEX-Emu/FEX.git "$FEX_DIR"
          git -C "$FEX_DIR" sparse-checkout init --cone
          git -C "$FEX_DIR" sparse-checkout set FEXCore Source CodeEmitter FEXHeaderUtils
          git -C "$FEX_DIR" checkout --quiet f2b679f6028ce1c38875233aecfcf5d3f8ebecec
          test -s "$FEX_DIR/FEXCore/include/FEXCore/Core/Context.h"
          echo "PASS pinned FEXCore source headers available"
          echo "NOTE: FEXCore is not yet compiled or linked"

      - name: Compile pinned FEXCore guest ISA header against iOS arm64 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          FEX="build/diagnostics/fexcore-upstream"
          cat > build/diagnostics/fexcore-ios-header-probe.cpp <<'CPP'
          #include <FEXCore/Core/X86Enums.h>
          // Compile-only probe of a real FEXCore API header, not a JIT run.
          int maxps4_fexcore_header_probe() { return 1; }
          CPP
          xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" -I "$FEX/FEXCore/include" \
            -c build/diagnostics/fexcore-ios-header-probe.cpp \
            -o build/diagnostics/fexcore-ios-header-probe.o
          xcrun lipo -archs build/diagnostics/fexcore-ios-header-probe.o | grep -w arm64
          echo "PASS pinned FEXCore header compiled for native iOS arm64 (JIT not linked)"

      - name: Probe real FEXCore IR implementation compilation for iOS
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          FEX="build/diagnostics/fexcore-upstream"
          SRC="$FEX/FEXCore/Source/Interface/Core/Addressing.cpp"
          test -s "$SRC"
          # Generate FEXCore's real IR definitions from upstream IR.json.
          # These are build-generated files, not handwritten stubs.
          mkdir -p build/diagnostics/fexcore-generated/FEXCore/IR
          python3 "$FEX/FEXCore/Scripts/json_ir_generator.py" \
            "$FEX/FEXCore/Source/Interface/IR/IR.json" \
            build/diagnostics/fexcore-generated/FEXCore/IR/IRDefines.inc \
            build/diagnostics/fexcore-generated/FEXCore/IR/IRDispatch.inc
          # FEXCore's LogManager.h directly includes fmt/format.h.
          # fmt is header-only for this compile-only experiment: do not link
          # macOS Homebrew libraries into the iOS executable.
          if ! brew list --versions fmt >/dev/null 2>&1 || ! test -s "$(brew --prefix fmt)/include/fmt/format.h"; then
            brew install fmt
          fi
          FMT_INCLUDE="$(brew --prefix fmt)/include"
          test -s "$FMT_INCLUDE/fmt/format.h"
          if xcrun --sdk iphoneos clang++ -std=c++23 -target arm64-apple-ios16.0 \
              -isysroot "$SDK" -I "$FEX/FEXCore/include" \
              -D MADV_HUGEPAGE=0 -D MADV_NOHUGEPAGE=0 \
              -I "build/diagnostics/fexcore-generated" \
              -I "MaxPS4-iOS/Native/compat/fex_ios" \
              -I "$FEX/CodeEmitter" -I "$FEX/FEXHeaderUtils" \
              -I "$FEX/FEXCore/Source" -I "$FEX/Source" -I "$FMT_INCLUDE" \
              -c "$SRC" -o build/diagnostics/fexcore-addressing-ios-arm64.o \
              > build/diagnostics/fexcore-ir-compile.log 2>&1; then
            echo "PASS real FEXCore IR Addressing.cpp compiled for iOS arm64" \
              | tee build/diagnostics/fexcore-ir-status.txt
          else
            echo "BLOCKED FEXCore IR Addressing.cpp: inspect fexcore-ir-compile.log for missing prerequisites" \
              | tee build/diagnostics/fexcore-ir-status.txt
            head -45 build/diagnostics/fexcore-ir-compile.log
          fi
          # Exploratory compile only: do not link until prerequisites are resolved.
          # A blocked FEXCore component must not prevent a working MaxPS4 IPA.

      - name: Report actual FEXCore iOS compilation status
        if: always()
        shell: bash
        run: |
          {
            echo '## FEXCore iOS — compilation réelle'
            if test -f build/diagnostics/fexcore-ir-status.txt; then
              cat build/diagnostics/fexcore-ir-status.txt
              echo ''
              echo '### Premières erreurs ou avertissements'
              echo '```text'
              head -30 build/diagnostics/fexcore-ir-compile.log 2>/dev/null || true
              echo '```'
            else
              echo 'Test non exécuté.'
            fi
            echo ''
            echo 'Une compilation réussie de Addressing.cpp ne signifie pas que FEXCore ou le JIT sont exécutables.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload FEXCore compilation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-FEXCore-porting-diagnostics
          path: |
            build/diagnostics/fexcore-ir-status.txt
            build/diagnostics/fexcore-ir-compile.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Test ARM64 translation and safe interpreter fallback on macOS
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++23 -I MaxPS4-iOS/Native/shadps4 \
            MaxPS4-iOS/Native/shadps4/common/string_util.cpp \
            MaxPS4-iOS/Native/shadps4_bridge.cpp \
            MaxPS4-iOS/Tests/NativeJITPipelineTest.cpp \
            -o build/diagnostics/maxps4-jit-pipeline-test
          build/diagnostics/maxps4-jit-pipeline-test \
            | tee build/diagnostics/jit-pipeline-results.log

      - name: Swift source typecheck
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK" \
            -parse-as-library \
            -typecheck \
            MaxPS4-iOS/Sources/*.swift 2>&1 | tee build/diagnostics/typecheck.log

      - name: Build arm64 iOS executable
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/Payload/MaxPS4.app

          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK" \
            -O \
            -parse-as-library \
            -framework SwiftUI \
            -framework UIKit \
            MaxPS4-iOS/Sources/*.swift \
            build/diagnostics/shadps4-string-util-ios-arm64.o \
            build/diagnostics/shadps4-bridge-ios-arm64.o \
            build/diagnostics/aether-guest-cpu-ios-arm64.o \
            build/diagnostics/aether-guest-adapter-ios-arm64.o \
            build/diagnostics/aether-jit-abi-ios-arm64.o \
            -lc++ \
            -o build/Payload/MaxPS4.app/MaxPS4 2>&1 | tee build/diagnostics/compile.log

      - name: Create Info.plist
        shell: bash
        run: |
          cat > build/Payload/MaxPS4.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>fr</string>
            <key>CFBundleDisplayName</key><string>MaxPS4</string>
            <key>CFBundleExecutable</key><string>MaxPS4</string>
            <key>CFBundleIdentifier</key><string>com.enermaxfr.maxps4</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>MaxPS4</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>16.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UILaunchScreen</key><dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
          </dict>
          </plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" build/Payload/MaxPS4.app/Info.plist
          plutil -lint build/Payload/MaxPS4.app/Info.plist

      - name: Install MaxPS4 app icon
        shell: bash
        run: |
          set -e
          ICON="MaxPS4-iOS/Resources/AppIcon.jpg"
          APP="build/Payload/MaxPS4.app"
          test -s "$ICON"
          python3 -m venv build/icon-venv
          build/icon-venv/bin/python -m pip install --quiet pillow
          build/icon-venv/bin/python - <<'PY'
          from PIL import Image, ImageFile
          # Prefer the original logo, but do not block IPA builds on a damaged JPEG.
          from PIL import ImageDraw, ImageFont, UnidentifiedImageError
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          try:
              icon = Image.open("MaxPS4-iOS/Resources/AppIcon.jpg").convert("RGB")
              icon.load()
              if min(icon.size) < 180:
                  raise ValueError(f"Source logo is too small: {icon.size}")
              print("ICON_SOURCE=original")
          except (UnidentifiedImageError, OSError, ValueError) as error:
              print(f"::warning::Original AppIcon.jpg cannot be decoded ({error}); using temporary MaxPS4 icon")
              icon = Image.new("RGB", (1024, 1024), (15, 20, 40))
              draw = ImageDraw.Draw(icon)
              draw.rounded_rectangle((64, 64, 960, 960), radius=180, outline=(0, 210, 245), width=24)
              draw.text((512, 512), "MaxPS4", fill="white", anchor="mm", font=ImageFont.truetype("/System/Library/Fonts/Supplemental/Arial Bold.ttf", 130))
              print("ICON_SOURCE=fallback")
          app = "build/Payload/MaxPS4.app/"
          for name, size in [
              ("AppIcon60x60@2x.png", 120),
              ("AppIcon60x60@3x.png", 180),
              ("AppIcon76x76@2x.png", 152),
              ("AppIcon83.5x83.5@2x.png", 167),
          ]:
              icon.resize((size, size), Image.Resampling.LANCZOS).save(app + name)
          PY
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons dict' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon dict' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon' "$APP/Info.plist"
          plutil -lint "$APP/Info.plist"

      - name: Verify executable
        run: |
          file build/Payload/MaxPS4.app/MaxPS4
          codesign -dvvv build/Payload/MaxPS4.app/MaxPS4 2>&1 || true

      - name: Package unsigned IPA
        working-directory: build
        run: zip -qry MaxPS4-unsigned.ipa Payload

      - name: Verify IPA archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -t build/MaxPS4-unsigned.ipa
          unzip -Z1 build/MaxPS4-unsigned.ipa | grep -Fx 'Payload/MaxPS4.app/Info.plist'
          unzip -Z1 build/MaxPS4-unsigned.ipa | grep -Fx 'Payload/MaxPS4.app/MaxPS4'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/Payload/MaxPS4.app/Info.plist
          xcrun lipo -info build/Payload/MaxPS4.app/MaxPS4
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' build/Payload/MaxPS4.app/Info.plist | grep -Fx MaxPS4
          /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' build/Payload/MaxPS4.app/Info.plist | grep -Fx APPL
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/Payload/MaxPS4.app/Info.plist | grep -Fx com.enermaxfr.maxps4
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Payload/MaxPS4.app/Info.plist | grep -Ex '[0-9]+'
          xcrun lipo -archs build/Payload/MaxPS4.app/MaxPS4 | grep -w arm64


      - name: Validate embedded icon files and IPA metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          import struct
          import zipfile

          archive = "build/MaxPS4-unsigned.ipa"
          prefix = "Payload/MaxPS4.app/"
          expected = {
              "AppIcon60x60@2x.png": 120,
              "AppIcon60x60@3x.png": 180,
              "AppIcon76x76@2x.png": 152,
              "AppIcon83.5x83.5@2x.png": 167,
          }
          with zipfile.ZipFile(archive) as ipa:
              bad = ipa.testzip()
              if bad is not None:
                  raise ValueError(f"Invalid IPA ZIP member: {bad}")
              plist = plistlib.loads(ipa.read(prefix + "Info.plist"))
              assert plist["CFBundleIdentifier"] == "com.enermaxfr.maxps4"
              assert plist["CFBundleExecutable"] == "MaxPS4"
              primary = plist["CFBundleIcons"]["CFBundlePrimaryIcon"]
              assert primary["CFBundleIconName"] == "AppIcon"
              assert "AppIcon60x60" in primary["CFBundleIconFiles"]
              for filename, dimension in expected.items():
                  data = ipa.read(prefix + filename)
                  if data[:8] != b"\x89PNG\r\n\x1a\n":
                      raise ValueError(f"Invalid PNG signature: {filename}")
                  width, height = struct.unpack(">II", data[16:24])
                  if (width, height) != (dimension, dimension):
                      raise ValueError(f"Wrong size for {filename}: {width}x{height}")
                  print(f"PASS icon in IPA: {filename} ({dimension}x{dimension})")
              print("PASS IPA icon and metadata validation")
          PY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-unsigned
          path: build/MaxPS4-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Summarize successful IPA build
        if: success()
        shell: bash
        run: |
          {
            echo '## MaxPS4 — IPA générée'
            echo ''
            echo "- Commit : ${GITHUB_SHA}"
            echo "- Build : ${GITHUB_RUN_NUMBER}"
            echo '- Archive : **MaxPS4-unsigned** (section Artifacts)'
            echo '- Attention : IPA non signée ; aucune exécution de jeu PS4.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize failed IPA build
        if: failure()
        shell: bash
        run: |
          {
            echo '## MaxPS4 — Échec du build'
            echo ''
            echo '- Lire la première étape en erreur.'
            echo '- Télécharger **MaxPS4-build-diagnostics** si disponible.'
            echo '- Aucune IPA validée pour cette exécution.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compilation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-build-diagnostics
          path: build/diagnostics/
          if-no-files-found: ignore
          retention-days: 14
