          printf "%s\n" "$FEXCORE_UPSTREAM_REV" > build/fexcore-proof/FEXCORE_UPSTREAM_REVISION.txt

      - name: Upload FEXCore iOS link proof
        uses: actions/upload-artifact@v4
        with:
          name: FEXCore-iOS-link-proof
          path: build/fexcore-proof
          if-no-files-found: error
          retention-days: 14

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          swiftc --version

      - name: Compile native core and backend
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/core
          for SRC in MaxPS4-iOS/Bridge/maxps4_core.cpp MaxPS4-iOS/Bridge/maxps4_backend.cpp MaxPS4-iOS/Bridge/maxps4_ps4_loader.cpp; do
            OUT="build/core/$(basename "${SRC%.cpp}").o"
            xcrun --sdk iphoneos clang++ -target arm64-apple-ios16.0 -isysroot "$SDK" \
              -std=c++20 -O2 -fvisibility=hidden -I MaxPS4-iOS/Bridge -c "$SRC" -o "$OUT"
            file "$OUT"
          done

      - name: Build arm64 iOS executable
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/Payload/MaxPS4.app
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.0 -sdk "$SDK" \
            -I MaxPS4-iOS/Bridge -O -parse-as-library -framework SwiftUI -framework UIKit \
            MaxPS4-iOS/Sources/*.swift build/core/maxps4_core.o build/core/maxps4_backend.o build/core/maxps4_ps4_loader.o \
            -Xlinker -lc++ -o build/Payload/MaxPS4.app/MaxPS4

      - name: Bundle compliance notices
        run: |
          cp THIRD_PARTY_NOTICES.md build/Payload/MaxPS4.app/THIRD_PARTY_NOTICES.md
          cp docs/fexcore-0.6-lock.md build/Payload/MaxPS4.app/FEXCORE_0_6_PROVENANCE.md
          cp docs/shadps4-fex-0.7-lock.md build/Payload/MaxPS4.app/SHADPS4_FEX_0_7_PROVENANCE.md

      - name: Create Info.plist
        shell: bash
        run: |
          cat > build/Payload/MaxPS4.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>fr</string>
            <key>CFBundleDisplayName</key><string>MaxPS4 Core 0.6</string>
            <key>CFBundleExecutable</key><string>MaxPS4</string>
            <key>CFBundleIdentifier</key><string>com.enermaxfr.maxps4.core06</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>MaxPS4</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.6</string>
            <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>16.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UILaunchScreen</key><dict/>
          </dict></plist>
          PLIST
          plutil -lint build/Payload/MaxPS4.app/Info.plist

      - name: Verify executable and compliance payload
        run: |
          file build/Payload/MaxPS4.app/MaxPS4
          nm -gU build/Payload/MaxPS4.app/MaxPS4 | grep -E 'maxps4_(core|backend)' || true
          test -f build/Payload/MaxPS4.app/THIRD_PARTY_NOTICES.md
          test -f build/Payload/MaxPS4.app/FEXCORE_0_6_PROVENANCE.md
          test -f build/Payload/MaxPS4.app/SHADPS4_FEX_0_7_PROVENANCE.md

      - name: Package unsigned IPA
        working-directory: build
        run: zip -qry MaxPS4-core-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-core-unsigned
          path: build/MaxPS4-core-unsigned.ipa
          if-no-files-found: error
          retention-days: 14


  legal-homebrew-elf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout MaxPS4
        uses: actions/checkout@v4

      - name: Install open-source toolchain prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bash clang-18 lld-18 make git file

      - name: Fetch pinned GPLv3+ PS4 payload SDK
        run: |
          set -euo pipefail
          SDK_REPO="https://github.com/ps4-payload-dev/sdk.git"
          SDK_REV="573b4a0d0d5fa8695cfeee5f5e2f0447c550035d"
          git clone --filter=blob:none --no-checkout "$SDK_REPO" build/ps4-sdk-src
          git -C build/ps4-sdk-src fetch --depth 1 origin "$SDK_REV"
          git -C build/ps4-sdk-src checkout --detach FETCH_HEAD
          test "$(git -C build/ps4-sdk-src rev-parse HEAD)" = "$SDK_REV"
          grep -q "GPLv3+" build/ps4-sdk-src/README.md

      - name: Build SDK and legal Hello World ELF
        run: |
          set -euo pipefail
          mkdir -p build/ps4-sdk
          make -C build/ps4-sdk-src DESTDIR="$GITHUB_WORKSPACE/build/ps4-sdk" install
          export PS4_PAYLOAD_SDK="$GITHUB_WORKSPACE/build/ps4-sdk"
          make -C build/ps4-sdk-src/samples/hello_stdio clean
          make -C build/ps4-sdk-src/samples/hello_stdio
          file build/ps4-sdk-src/samples/hello_stdio/hello_stdio.elf
          readelf -h build/ps4-sdk-src/samples/hello_stdio/hello_stdio.elf

      - name: Package source, license and provenance
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build/MaxPS4-Legal-Hello-ELF"
          mkdir -p "$OUT"
          cp build/ps4-sdk-src/samples/hello_stdio/hello_stdio.elf "$OUT/hello_stdio.elf"
          cp build/ps4-sdk-src/samples/hello_stdio/main.c "$OUT/source-main.c"
          cp build/ps4-sdk-src/samples/hello_stdio/Makefile "$OUT/source-Makefile"
          cp build/ps4-sdk-src/README.md "$OUT/PS4-PAYLOAD-SDK-README.md"
          cp /usr/share/common-licenses/GPL-3 "$OUT/GPL-3.0.txt"
          cat > "$OUT/PROVENANCE.txt" <<'EOF'
          Purpose: legal/open-source ELF for testing MaxPS4's ELF loader.
          Upstream: https://github.com/ps4-payload-dev/sdk.git
          Locked revision: 573b4a0d0d5fa8695cfeee5f5e2f0447c550035d
          Sample: samples/hello_stdio
          License: GPLv3+
          Contains no Sony game, firmware, keys, SDK, or proprietary PlayStation content.
          EOF
          sha256sum "$OUT/hello_stdio.elf" > "$OUT/SHA256SUMS.txt"

      - name: Upload legal PS4 ELF test
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-Legal-Hello-ELF
          path: build/MaxPS4-Legal-Hello-ELF
          if-no-files-found: error
          retention-days: 14
