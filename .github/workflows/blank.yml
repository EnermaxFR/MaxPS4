            build/diagnostics/fexcore-jit-full-link.log
            build/diagnostics/fexcore-cpu-backend-compile.log
            build/diagnostics/fexcore-cpu-backend-status.txt
            build/diagnostics/fexcore-missing-components.txt
            build/diagnostics/fexcore-extra-compile-status.txt
            build/diagnostics/fexcore-extra-objects.txt
            build/diagnostics/fexcore-extra-*-compile.log
            build/diagnostics/fexcore-cpu-backend-ios.o
            build/diagnostics/fexcore-jit-full-link-status.txt
            build/diagnostics/fexcore-ipa-link-status.txt
            build/diagnostics/fexcore-jit-partial-undefined-symbols.txt
            build/diagnostics/fexcore-jit-partial-demangled-symbols.txt
            build/diagnostics/fexcore-unresolved-families.json
            build/diagnostics/fexcore-jit-nm-error.log
            build/diagnostics/fexcore-jit-archive-undefined-symbols.txt
            build/diagnostics/fexcore-jit-core-ios.o
            build/diagnostics/fexcore-jit-alu-ios.o
            build/diagnostics/fexcore-arm64-relocations-ios.o
            build/diagnostics/fexcore-jit-object-arch-status.txt
            build/diagnostics/fexcore-jit-link-readiness.txt
            build/diagnostics/fexcore-jit-core-undefined-symbols.txt
            build/diagnostics/fexcore-jit-alu-status.txt
            build/diagnostics/fexcore-jit-alu-compile.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Test ARM64 translation and safe interpreter fallback on macOS
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++23 -I MaxPS4-iOS/Native/shadps4 \
            MaxPS4-iOS/Native/shadps4/common/string_util.cpp \
            MaxPS4-iOS/Native/shadps4_bridge.cpp \
            MaxPS4-iOS/Tests/NativeJITPipelineTest.cpp \
            -o build/diagnostics/maxps4-jit-pipeline-test
          build/diagnostics/maxps4-jit-pipeline-test \
            | tee build/diagnostics/jit-pipeline-results.log

      - name: Run generated ARM64 execution proof on Apple Silicon host
        shell: bash
        run: |
          set -euo pipefail
          MAC_SDK="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun --sdk macosx clang++ -std=c++23 -Wall -Wextra \
            -target arm64-apple-macos13 -isysroot "$MAC_SDK" \
            -I MaxPS4-iOS/Native/shadps4 \
            MaxPS4-iOS/Native/shadps4/common/string_util.cpp \
            MaxPS4-iOS/Native/shadps4_bridge.cpp \
            MaxPS4-iOS/Tests/GeneratedARM64ExecutionHostTest.cpp \
            -o build/diagnostics/generated-arm64-execution-test
          xcrun lipo -archs build/diagnostics/generated-arm64-execution-test \
            | grep -Eq '(^|[[:space:]])arm64([[:space:]]|$)'
          if test "$(uname -m)" != arm64; then
            echo "PASS ARM64 host binary compiled; execution SKIPPED on non-ARM64 runner" \
              | tee build/diagnostics/generated-arm64-execution.log
          else
            if build/diagnostics/generated-arm64-execution-test \
                > build/diagnostics/generated-arm64-execution.log 2>&1; then
              cat build/diagnostics/generated-arm64-execution.log
              echo "PASS generated ARM64 execution on macOS host"
            else
              cat build/diagnostics/generated-arm64-execution.log
              echo "BLOCKED generated ARM64 execution on macOS host; iOS IPA build continues"
            fi
          fi

      - name: Upload generated ARM64 execution proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-generated-ARM64-execution-proof
          path: |
            build/diagnostics/generated-arm64-execution.log
            build/diagnostics/generated-arm64-execution-test
          if-no-files-found: ignore
          retention-days: 7

      - name: Swift source typecheck
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK" \
            -parse-as-library \
            -typecheck \
            MaxPS4-iOS/Sources/*.swift 2>&1 | tee build/diagnostics/typecheck.log

      - name: Build arm64 iOS executable
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/Payload/MaxPS4.app

          # Link the genuine FEXCore archive only after the strict iOS linker
          # probe passes. This alone does NOT activate guest execution or JIT.
          FEXCORE_LINK_ARGS=()
          if test -f build/diagnostics/fexcore-jit-full-link-status.txt &&
              grep -q '^PASS isolated full linker dependency check' \
                build/diagnostics/fexcore-jit-full-link-status.txt &&
              test -s build/diagnostics/libMaxPS4FEXJITProbe.a; then
            FEXCORE_LINK_ARGS=(-Xlinker -force_load -Xlinker build/diagnostics/libMaxPS4FEXJITProbe.a)
            echo "FEXCore archive selected for iOS executable link (JIT still inactive)" \
              | tee build/diagnostics/fexcore-ipa-link-status.txt
          else
            echo "FEXCore archive not link-ready; using existing CPU backend" \
              | tee build/diagnostics/fexcore-ipa-link-status.txt
          fi

          # Add the upstream HLE guest-call component only when it passes an
          # isolated strict iOS link test. It is not a PS4 services runtime.
          AETHER_HLE_LINK_OBJECT=""
          if grep -q '^PASS isolated AetherPS4 HLE adapter link' \
               build/diagnostics/aether-hle-link-status.txt; then
            AETHER_HLE_LINK_OBJECT=build/diagnostics/aether-hle-call-adapter-ios-arm64.o
            echo "AetherPS4 HLE adapter selected for executable link" \
              | tee build/diagnostics/aether-hle-ipa-link-status.txt
          else
            echo "AetherPS4 HLE adapter link blocked; preserving working IPA" \
              | tee build/diagnostics/aether-hle-ipa-link-status.txt
          fi

          # Keep previously compiled upstream modules as link candidates.
          # Each module is accepted only after a strict executable link succeeds.
          AETHER_MODULES=(fex_guest_engine fex_guest_cpu ios_jit_allocator psf process memory exception)
          AETHER_ACCEPTED_OBJECTS=()
          AETHER_ACCEPTED_COUNT=0
          # The upstream guest_cpu.cpp is already linked as a separate object
          # earlier in this workflow; do not link a duplicate definition.

          # Compile and archive the versioned native bridge for iOS ARM64.
          # This ABI is linked into the application, but advertises no PS4
          # execution until real FEXCore + GPU + HLE prerequisites exist.
          xcrun --sdk iphoneos clang++ -std=c++17 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" -c MaxPS4-iOS/Native/maxps4_native.cpp \
            -o build/diagnostics/maxps4_native.o
          xcrun ar rcs build/diagnostics/libmaxps4_native.a \
            build/diagnostics/maxps4_native.o
          xcrun lipo -archs build/diagnostics/libmaxps4_native.a | grep -w arm64
          SWIFT_LINK_CMD=(
            xcrun --sdk iphoneos swiftc
            -target arm64-apple-ios16.0
            -sdk "$SDK"
            -O
            -parse-as-library
            -framework SwiftUI
            -framework UIKit
            MaxPS4-iOS/Sources/*.swift
            build/diagnostics/libmaxps4_native.a
            build/diagnostics/shadps4-string-util-ios-arm64.o
            build/diagnostics/shadps4-bridge-ios-arm64.o
            build/diagnostics/aether-guest-cpu-ios-arm64.o
            build/diagnostics/aether-guest-adapter-ios-arm64.o
            build/diagnostics/aether-jit-abi-ios-arm64.o
          )
          if test -n "$AETHER_HLE_LINK_OBJECT"; then
            SWIFT_LINK_CMD+=("$AETHER_HLE_LINK_OBJECT")
          fi
          OUTPUT=build/Payload/MaxPS4.app/MaxPS4
          # Try multiple genuine AetherPS4 components in one build.
          # A failed object does not replace the existing working app.
          : > build/diagnostics/aether-module-link-status.txt
          for component in "${AETHER_MODULES[@]}"; do
            candidate="build/diagnostics/aether-full-engine/${component}.o"
            if ! test -s "$candidate"; then
              echo "BLOCKED ${component}: compiler object unavailable" \
                | tee -a build/diagnostics/aether-module-link-status.txt
              continue
            fi
            trial=("$candidate")
            new_objects=("$candidate")
            # Logging and thread primitives are shared by multiple AetherPS4
            # components, not just the JIT allocator. Test the real dependency
            # closure alongside every native module, without exposing unsupported
            # execution to the Swift UI. An already linked support object must
            # not be linked twice, or C++ globals will produce duplicate symbols.
            for support in log thread; do
              support_object="build/diagnostics/aether-full-engine/${support}.o"
              if test -s "$support_object"; then
                already_accepted=false
                if test "$AETHER_ACCEPTED_COUNT" -gt 0; then
                  for accepted in "${AETHER_ACCEPTED_OBJECTS[@]}"; do
                    if test "$accepted" = "$support_object"; then
                      already_accepted=true
                      break
                    fi
                  done
                fi
                if test "$already_accepted" = false; then
                  trial+=("$support_object")
                  new_objects+=("$support_object")
                fi
              fi
            done
            if test "$AETHER_ACCEPTED_COUNT" -gt 0; then
              trial=( "${AETHER_ACCEPTED_OBJECTS[@]}" "${trial[@]}" )
            fi
            if "${SWIFT_LINK_CMD[@]}" "${trial[@]}" -lc++ \
                 -o "$OUTPUT" > "build/diagnostics/aether-link-${component}.log" 2>&1; then
              AETHER_ACCEPTED_OBJECTS+=("${new_objects[@]}")
              AETHER_ACCEPTED_COUNT=$((AETHER_ACCEPTED_COUNT + 1))
              echo "PASS ${component}: upstream object linked (runtime inactive)" \
                | tee -a build/diagnostics/aether-module-link-status.txt
            else
              echo "BLOCKED ${component}: unresolved link dependencies" \
                | tee -a build/diagnostics/aether-module-link-status.txt
              # Capture the symbol list, not just the generic clang exit code.
              python3 - "$component" <<'PY'
          import pathlib, re, sys
          component = sys.argv[1]
          log = pathlib.Path(f"build/diagnostics/aether-link-{component}.log").read_text(errors="replace")
          lines = log.splitlines()
          headers = ("Undefined symbols", "duplicate symbol", "ld:", "clang: error:")
          filtered = [line for line in lines if line.lstrip().startswith(headers) or
                      "referenced from:" in line or re.match(r'^\s{2,}["\']?_[\w.$]+', line)]
          output = "\n".join(filtered[:80]) or "\n".join(lines[-50:])
          path = pathlib.Path(f"build/diagnostics/aether-link-{component}-symbols.txt")
          path.write_text(output + "\n")
          print(f"LINK_DIAGNOSTICS {component}: {len(filtered)} relevant linker lines")
          print(output[:2400])
          PY
            fi
            rm -f "$OUTPUT"
          done
          if test "$AETHER_ACCEPTED_COUNT" -gt 0; then
            SWIFT_LINK_CMD+=("${AETHER_ACCEPTED_OBJECTS[@]}")
          fi
          if test "${#FEXCORE_LINK_ARGS[@]}" -gt 0; then
            if "${SWIFT_LINK_CMD[@]}" "${FEXCORE_LINK_ARGS[@]}" -lc++ \
                -o "$OUTPUT" > build/diagnostics/compile-fexcore.log 2>&1; then
              cp build/diagnostics/compile-fexcore.log build/diagnostics/compile.log
              echo "PASS FEXCore archive linked into iOS app; JIT execution still inactive" \
                | tee build/diagnostics/fexcore-ipa-link-status.txt
            else
              echo "BLOCKED FEXCore executable link; retrying existing CPU backend" \
                | tee build/diagnostics/fexcore-ipa-link-status.txt
              rm -f "$OUTPUT"
              "${SWIFT_LINK_CMD[@]}" -lc++ -o "$OUTPUT" \
                > build/diagnostics/compile.log 2>&1 || {
                  cat build/diagnostics/compile.log
                  exit 1
                }
              echo "PASS existing backend fallback IPA; FEXCore JIT not linked" \
                | tee -a build/diagnostics/fexcore-ipa-link-status.txt
            fi
          else
            "${SWIFT_LINK_CMD[@]}" -lc++ -o "$OUTPUT" \
              > build/diagnostics/compile.log 2>&1 || {
                cat build/diagnostics/compile.log
                exit 1
              }
          fi
          cat build/diagnostics/compile.log

      - name: Summarize actual AetherPS4 module linkage
        if: always()
        shell: bash
        run: |
          {
            echo "## AetherPS4 — seven native modules"
            echo ""
            echo "A green build does not mean Kero Blaster is playable."
            echo ""
            if test -s build/diagnostics/aether-module-link-status.txt; then
              echo '~~~text'
              cat build/diagnostics/aether-module-link-status.txt
              echo '~~~'
            else
              echo "Native module linker checks did not run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AetherPS4 actual linker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-AetherPS4-native-link-results
          path: |
            build/diagnostics/aether-module-link-status.txt
            build/diagnostics/aether-link-*.log
            build/diagnostics/aether-ios-jit-ipa-link-status.txt
            build/diagnostics/fexcore-ipa-link-status.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify selected iOS CPU backend linkage
        shell: bash
        run: |
          set -euo pipefail
          BIN=build/Payload/MaxPS4.app/MaxPS4
          xcrun lipo -archs "$BIN" | grep -w arm64
          if grep -q '^PASS FEXCore archive linked into iOS app' \
              build/diagnostics/fexcore-ipa-link-status.txt; then
            # The selected archive must contribute real JIT symbols; a
            # successful Swift link alone could silently strip unused code.
            if xcrun nm "$BIN" | grep -E 'FEXCore|_ZN3FEX' \
                > build/diagnostics/fexcore-ipa-linked-symbols.txt; then
              echo "PASS FEXCore archive symbols present; guest JIT still inactive" \
                | tee -a build/diagnostics/fexcore-ipa-link-status.txt
            else
              echo "BLOCKED FEXCore symbol verification: inspect final executable" \
                | tee -a build/diagnostics/fexcore-ipa-link-status.txt
            fi
          else
            echo "Existing CPU backend selected; JIT remains unavailable"
          fi

      - name: Create Info.plist
        shell: bash
        run: |
          cat > build/Payload/MaxPS4.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>fr</string>
            <key>CFBundleDisplayName</key><string>MaxPS4</string>
            <key>CFBundleExecutable</key><string>MaxPS4</string>
            <key>CFBundleIdentifier</key><string>com.enermaxfr.maxps4</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>MaxPS4</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>16.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UILaunchScreen</key><dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
          </dict>
          </plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" build/Payload/MaxPS4.app/Info.plist
          plutil -lint build/Payload/MaxPS4.app/Info.plist

      - name: Install MaxPS4 app icon
        shell: bash
        run: |
          set -e
          ICON="build/OriginalAppIcon.jpg"
          # Prefer the user's exact unmodified JPEG when it has been
          # uploaded to the repository. Never redraw or regenerate the logo.
          if test -s MaxPS4-iOS/Resources/MaxPS4ExactIcon.png; then
            cp MaxPS4-iOS/Resources/MaxPS4ExactIcon.png "$ICON"
            echo "ICON_SOURCE=exact-user-PNG"
          elif test -s MaxPS4-iOS/Resources/MaxPS4ExactIcon.jpeg; then
            cp MaxPS4-iOS/Resources/MaxPS4ExactIcon.jpeg "$ICON"
            echo "ICON_SOURCE=exact-user-JPEG"
          else
            python3 -c 'import base64,pathlib; pathlib.Path("build/OriginalAppIcon.jpg").write_bytes(base64.b64decode(pathlib.Path("MaxPS4-iOS/Resources/OriginalAppIcon.base64").read_text()))'
            echo "ICON_SOURCE=existing-logo (awaiting exact user image upload)"
          fi
          APP="build/Payload/MaxPS4.app"
          test -s "$ICON"
          python3 -m venv build/icon-venv
          build/icon-venv/bin/python -m pip install --quiet pillow
          build/icon-venv/bin/python - <<'PY'
          from PIL import Image, ImageFile
          # Fail instead of silently shipping a different icon when the exact user PNG is present.
          from PIL import ImageDraw, ImageFont, UnidentifiedImageError
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          try:
              icon = Image.open("build/OriginalAppIcon.jpg").convert("RGB")
              icon.load()
              if min(icon.size) < 180:
                  raise ValueError(f"Source logo is too small: {icon.size}")
              print("ICON_SOURCE=original")
          except (UnidentifiedImageError, OSError, ValueError) as error:
              from pathlib import Path
              if Path("MaxPS4-iOS/Resources/MaxPS4ExactIcon.png").exists():
                  raise RuntimeError(f"Exact MaxPS4 PNG could not be decoded: {error}") from error
              print(f"::warning::Original AppIcon.jpg cannot be decoded ({error}); using temporary MaxPS4 icon")
              icon = Image.new("RGB", (1024, 1024), (15, 20, 40))
              draw = ImageDraw.Draw(icon)
              draw.rounded_rectangle((64, 64, 960, 960), radius=180, outline=(0, 210, 245), width=24)
              draw.text((512, 512), "MaxPS4", fill="white", anchor="mm", font=ImageFont.truetype("/System/Library/Fonts/Supplemental/Arial Bold.ttf", 130))
              print("ICON_SOURCE=fallback")
          app = "build/Payload/MaxPS4.app/"
          for name, size in [
              ("AppIcon60x60@2x.png", 120),
              ("AppIcon60x60@3x.png", 180),
              ("AppIcon76x76@2x.png", 152),
              ("AppIcon83.5x83.5@2x.png", 167),
          ]:
              icon.resize((size, size), Image.Resampling.LANCZOS).save(app + name)
          PY
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons dict' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon dict' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon' "$APP/Info.plist"
          plutil -lint "$APP/Info.plist"

      - name: Verify executable
        run: |
          file build/Payload/MaxPS4.app/MaxPS4
          codesign -dvvv build/Payload/MaxPS4.app/MaxPS4 2>&1 || true

      - name: Package unsigned IPA
        working-directory: build
        run: zip -qry MaxPS4-unsigned.ipa Payload

      - name: Verify IPA archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -t build/MaxPS4-unsigned.ipa
          unzip -Z1 build/MaxPS4-unsigned.ipa | grep -Fx 'Payload/MaxPS4.app/Info.plist'
          unzip -Z1 build/MaxPS4-unsigned.ipa | grep -Fx 'Payload/MaxPS4.app/MaxPS4'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/Payload/MaxPS4.app/Info.plist
          xcrun lipo -info build/Payload/MaxPS4.app/MaxPS4
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' build/Payload/MaxPS4.app/Info.plist | grep -Fx MaxPS4
          /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' build/Payload/MaxPS4.app/Info.plist | grep -Fx APPL
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/Payload/MaxPS4.app/Info.plist | grep -Fx com.enermaxfr.maxps4
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Payload/MaxPS4.app/Info.plist | grep -Ex '[0-9]+'
          xcrun lipo -archs build/Payload/MaxPS4.app/MaxPS4 | grep -w arm64


      - name: Validate embedded icon files and IPA metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          import struct
          import zipfile

          archive = "build/MaxPS4-unsigned.ipa"
          prefix = "Payload/MaxPS4.app/"
          expected = {
              "AppIcon60x60@2x.png": 120,
              "AppIcon60x60@3x.png": 180,
              "AppIcon76x76@2x.png": 152,
              "AppIcon83.5x83.5@2x.png": 167,
          }
          with zipfile.ZipFile(archive) as ipa:
              bad = ipa.testzip()
              if bad is not None:
                  raise ValueError(f"Invalid IPA ZIP member: {bad}")
              plist = plistlib.loads(ipa.read(prefix + "Info.plist"))
              assert plist["CFBundleIdentifier"] == "com.enermaxfr.maxps4"
              assert plist["CFBundleExecutable"] == "MaxPS4"
              primary = plist["CFBundleIcons"]["CFBundlePrimaryIcon"]
              assert primary["CFBundleIconName"] == "AppIcon"
              assert "AppIcon60x60" in primary["CFBundleIconFiles"]
              for filename, dimension in expected.items():
                  data = ipa.read(prefix + filename)
                  if data[:8] != b"\x89PNG\r\n\x1a\n":
                      raise ValueError(f"Invalid PNG signature: {filename}")
                  width, height = struct.unpack(">II", data[16:24])
                  if (width, height) != (dimension, dimension):
                      raise ValueError(f"Wrong size for {filename}: {width}x{height}")
                  print(f"PASS icon in IPA: {filename} ({dimension}x{dimension})")
              print("PASS IPA icon and metadata validation")
          PY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-unsigned
          path: build/MaxPS4-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Summarize successful IPA build
        if: success()
        shell: bash
        run: |
          {
            echo '## MaxPS4 — IPA générée'
            echo ''
            echo "- Commit : ${GITHUB_SHA}"
            echo "- Build : ${GITHUB_RUN_NUMBER}"
            echo '- Archive : **MaxPS4-unsigned** (section Artifacts)'
            echo '- Attention : IPA non signée ; aucune exécution de jeu PS4.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize failed IPA build
        if: failure()
        shell: bash
        run: |
          {
            echo '## MaxPS4 — Échec du build'
            echo ''
            echo '- Lire la première étape en erreur.'
            echo '- Télécharger **MaxPS4-build-diagnostics** si disponible.'
            echo '- Aucune IPA validée pour cette exécution.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compilation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-build-diagnostics
          path: build/diagnostics/
          if-no-files-found: ignore
          retention-days: 14
