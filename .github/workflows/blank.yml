name: Build MaxPS4 iOS Core IPA

on:
  workflow_dispatch:
  push:
    branches: ["shadps4-ios-core"]
    paths:
      - "MaxPS4-iOS/**"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/blank.yml"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          swiftc --version

      - name: Compile native core and 0.5 backend
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/core
          for SRC in MaxPS4-iOS/Bridge/maxps4_core.cpp MaxPS4-iOS/Bridge/maxps4_backend.cpp; do
            OUT="build/core/$(basename "${SRC%.cpp}").o"
            xcrun --sdk iphoneos clang++ \
              -target arm64-apple-ios16.0 \
              -isysroot "$SDK" \
              -std=c++20 -O2 -fvisibility=hidden \
              -I MaxPS4-iOS/Bridge \
              -c "$SRC" -o "$OUT"
            file "$OUT"
          done

      - name: Build arm64 iOS executable
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/Payload/MaxPS4.app
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK" \
            -I MaxPS4-iOS/Bridge \
            -O -parse-as-library \
            -framework SwiftUI -framework UIKit \
            MaxPS4-iOS/Sources/*.swift \
            build/core/maxps4_core.o build/core/maxps4_backend.o \
            -Xlinker -lc++ \
            -o build/Payload/MaxPS4.app/MaxPS4

      - name: Bundle compliance notices
        run: cp THIRD_PARTY_NOTICES.md build/Payload/MaxPS4.app/THIRD_PARTY_NOTICES.md

      - name: Create Info.plist
        shell: bash
        run: |
          cat > build/Payload/MaxPS4.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>fr</string>
            <key>CFBundleDisplayName</key><string>MaxPS4 Core 0.5</string>
            <key>CFBundleExecutable</key><string>MaxPS4</string>
            <key>CFBundleIdentifier</key><string>com.enermaxfr.maxps4.core05</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>MaxPS4</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.5</string>
            <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>16.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UILaunchScreen</key><dict/>
          </dict></plist>
          PLIST
          plutil -lint build/Payload/MaxPS4.app/Info.plist

      - name: Verify executable and backend symbols
        run: |
          file build/Payload/MaxPS4.app/MaxPS4
          nm -gU build/Payload/MaxPS4.app/MaxPS4 | grep -E 'maxps4_(core|backend)' || true
          test -f build/Payload/MaxPS4.app/THIRD_PARTY_NOTICES.md

      - name: Package unsigned IPA
        working-directory: build
        run: zip -qry MaxPS4-core-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-core-unsigned
          path: build/MaxPS4-core-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
