            -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-ios17.4 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.4 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_FEXCORE_ONLY=ON \
