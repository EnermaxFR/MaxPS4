name: Build MaxPS4 iOS Core IPA

on:
  workflow_dispatch:
  push:
    branches: ["shadps4-ios-core"]
    paths:
      - "MaxPS4-iOS/**"
      - "docs/fexcore-0.6-lock.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/blank.yml"

permissions:
  contents: read

env:
  FEXCORE_REFERENCE_REPO: https://github.com/Leviidev/AetherPS4.git
  FEXCORE_REFERENCE_REV: 3347fc13f19860855ce91b66356940989ea6b6a6
  FEXCORE_UPSTREAM_REV: f2b679f6028ce1c38875233aecfcf5d3f8ebecec

jobs:
  fexcore-ios-gate:
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout MaxPS4
        uses: actions/checkout@v4

      - name: Fetch locked FEXCore Darwin reference
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$FEXCORE_REFERENCE_REPO" build/aether-reference
          git -C build/aether-reference fetch --depth 1 origin "$FEXCORE_REFERENCE_REV"
          git -C build/aether-reference checkout --detach FETCH_HEAD
          test "$(git -C build/aether-reference rev-parse HEAD)" = "$FEXCORE_REFERENCE_REV"
          test -f build/aether-reference/runtime/sources/fexcore-darwin/LICENSE
          grep -q "MIT License" build/aether-reference/runtime/sources/fexcore-darwin/LICENSE
          grep -q "$FEXCORE_UPSTREAM_REV" build/aether-reference/runtime/sources/fexcore-darwin/README.aethercore-darwin.md

      - name: Apply MaxPS4 iOS smoke packaging patch
        shell: bash
        run: |
          set -euo pipefail
          CMAKE_FILE="$GITHUB_WORKSPACE/build/aether-reference/runtime/sources/fexcore-darwin/CMakeLists.txt"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/aether-reference/runtime/sources/fexcore-darwin/CMakeLists.txt")
          s = p.read_text()
          s = s.replace(
              'install(TARGETS fexcore-smoke fexcore-guest-harness RUNTIME DESTINATION bin)',
              'install(TARGETS fexcore-smoke fexcore-guest-harness RUNTIME DESTINATION bin BUNDLE DESTINATION bin)'
          )
          s = s.replace(
              'install(TARGETS fexcore-smoke RUNTIME DESTINATION bin)',
              'install(TARGETS fexcore-smoke RUNTIME DESTINATION bin BUNDLE DESTINATION bin)'
          )
          p.write_text(s)
          PY
          grep -n "install(TARGETS fexcore-smoke" "$CMAKE_FILE"

      - name: Patch smoke probe for iOS JIT API availability
        shell: bash
        run: |
          set -euo pipefail
          PROBE="$GITHUB_WORKSPACE/build/aether-reference/runtime/probes/fexcore-smoke.cpp"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/aether-reference/runtime/probes/fexcore-smoke.cpp")
          s = p.read_text()
          s = s.replace('#ifdef __APPLE__\n#include <pthread.h>\n#endif',
                        '#ifdef __APPLE__\n#include <pthread.h>\n#include <TargetConditionals.h>\n#endif')
          s = s.replace('#ifdef __APPLE__\n    // Darwin refuses any RWX/exec-capable anonymous mapping',
                        '#if defined(__APPLE__) && !TARGET_OS_IPHONE\n    // Darwin refuses any RWX/exec-capable anonymous mapping')
          s = s.replace('#ifdef __APPLE__\n  // pthread_jit_write_protect_np is a *global per-thread* toggle',
                        '#if defined(__APPLE__) && !TARGET_OS_IPHONE\n  // pthread_jit_write_protect_np is a *global per-thread* toggle')
          p.write_text(s)
          PY
          grep -n "pthread_jit_write_protect_np\|TARGET_OS_IPHONE" "$PROBE"

      - name: Add iOS clear-cache compatibility shim
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/build/aether-reference/runtime/sources/fexcore-darwin"
          cat > "$SRC/MaxPS4ClearCacheShim.cpp" <<'CPP'
          #include <libkern/OSCacheControl.h>
          #include <cstddef>

          extern "C" void __clear_cache(void* begin, void* end) {
              auto* first = static_cast<unsigned char*>(begin);
              auto* last = static_cast<unsigned char*>(end);
              if (last > first) {
                  sys_icache_invalidate(first, static_cast<std::size_t>(last - first));
              }
          }
          CPP
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/aether-reference/runtime/sources/fexcore-darwin/CMakeLists.txt")
          s = p.read_text()
          s = s.replace(
              'add_executable(fexcore-smoke "${FEXCORE_SMOKE_SOURCE}")',
              'add_executable(fexcore-smoke "${FEXCORE_SMOKE_SOURCE}" "${CMAKE_SOURCE_DIR}/MaxPS4ClearCacheShim.cpp")'
          )
          p.write_text(s)
          PY
          grep -n "add_executable(fexcore-smoke" "$SRC/CMakeLists.txt"

      - name: Install FEXCore Python configure dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$GITHUB_WORKSPACE/build/fex-python"
          "$GITHUB_WORKSPACE/build/fex-python/bin/python" -m pip install --upgrade pip packaging 'setuptools<81'
          "$GITHUB_WORKSPACE/build/fex-python/bin/python" -c 'import packaging, pkg_resources; print("FEXCore Python dependencies OK")'
          echo "$GITHUB_WORKSPACE/build/fex-python/bin" >> "$GITHUB_PATH"

      - name: Configure FEXCore for arm64 iOS
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/build/aether-reference/runtime/sources/fexcore-darwin"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cmake -S "$SRC" -B build/fexcore-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_C_COMPILER="$(xcrun --find clang)" \
            -DCMAKE_CXX_COMPILER="$(xcrun --find clang++)" \
            -DCMAKE_C_COMPILER_TARGET=arm64-apple-ios16.0 \
            -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-ios16.0 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_FEXCORE_ONLY=ON \
            -DTUNE_CPU=generic \
            -DTUNE_ARCH=generic \
            -DFEXCORE_SMOKE_SOURCE="$GITHUB_WORKSPACE/build/aether-reference/runtime/probes/fexcore-smoke.cpp" \
            -DBUILD_FEXCORE_SMOKE=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF \
            -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF \
            -DENABLE_GDB_SYMBOLS=OFF \
            -DENABLE_LTO=OFF \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DENABLE_OFFLINE_TELEMETRY=OFF \
            -DENABLE_VIXL_DISASSEMBLER=OFF \
            -DENABLE_VIXL_SIMULATOR=OFF \
            -DENABLE_ZYDIS=OFF \
            -DENABLE_FEXCORE_PROFILER=OFF

      - name: Compile FEXCore iOS probe target
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/fexcore-ios --target FEXCore --parallel 3

      - name: Link FEXCore iOS smoke probe
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/fexcore-ios --target fexcore-smoke --parallel 3
          file build/fexcore-ios/Bin/fexcore-smoke.app/fexcore-smoke
          xcrun vtool -show-build build/fexcore-ios/Bin/fexcore-smoke.app/fexcore-smoke || true
          nm -gU build/fexcore-ios/Bin/fexcore-smoke.app/fexcore-smoke | grep -E "FEX|main" | head -40 || true

      - name: Package FEXCore iOS link proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/fexcore-proof
          cp build/fexcore-ios/Bin/fexcore-smoke.app/fexcore-smoke build/fexcore-proof/
          cp build/fexcore-ios/FEXCore/Source/libFEXCore.a build/fexcore-proof/
          cp build/aether-reference/runtime/sources/fexcore-darwin/LICENSE build/fexcore-proof/FEXCore-LICENSE
          printf "%s\n" "$FEXCORE_UPSTREAM_REV" > build/fexcore-proof/FEXCORE_UPSTREAM_REVISION.txt

      - name: Upload FEXCore iOS link proof
        uses: actions/upload-artifact@v4
        with:
          name: FEXCore-iOS-link-proof
          path: build/fexcore-proof
          if-no-files-found: error
          retention-days: 14

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          swiftc --version

      - name: Compile native core and backend
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/core
          for SRC in MaxPS4-iOS/Bridge/maxps4_core.cpp MaxPS4-iOS/Bridge/maxps4_backend.cpp; do
            OUT="build/core/$(basename "${SRC%.cpp}").o"
            xcrun --sdk iphoneos clang++ -target arm64-apple-ios16.0 -isysroot "$SDK" \
              -std=c++20 -O2 -fvisibility=hidden -I MaxPS4-iOS/Bridge -c "$SRC" -o "$OUT"
            file "$OUT"
          done

      - name: Build arm64 iOS executable
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/Payload/MaxPS4.app
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.0 -sdk "$SDK" \
            -I MaxPS4-iOS/Bridge -O -parse-as-library -framework SwiftUI -framework UIKit \
            MaxPS4-iOS/Sources/*.swift build/core/maxps4_core.o build/core/maxps4_backend.o \
            -Xlinker -lc++ -o build/Payload/MaxPS4.app/MaxPS4

      - name: Bundle compliance notices
        run: |
          cp THIRD_PARTY_NOTICES.md build/Payload/MaxPS4.app/THIRD_PARTY_NOTICES.md
          cp docs/fexcore-0.6-lock.md build/Payload/MaxPS4.app/FEXCORE_0_6_PROVENANCE.md

      - name: Create Info.plist
        shell: bash
        run: |
          cat > build/Payload/MaxPS4.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>fr</string>
            <key>CFBundleDisplayName</key><string>MaxPS4 Core 0.6</string>
            <key>CFBundleExecutable</key><string>MaxPS4</string>
            <key>CFBundleIdentifier</key><string>com.enermaxfr.maxps4.core06</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>MaxPS4</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.6</string>
            <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>16.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UILaunchScreen</key><dict/>
          </dict></plist>
          PLIST
          plutil -lint build/Payload/MaxPS4.app/Info.plist

      - name: Verify executable and compliance payload
        run: |
          file build/Payload/MaxPS4.app/MaxPS4
          nm -gU build/Payload/MaxPS4.app/MaxPS4 | grep -E 'maxps4_(core|backend)' || true
          test -f build/Payload/MaxPS4.app/THIRD_PARTY_NOTICES.md
          test -f build/Payload/MaxPS4.app/FEXCORE_0_6_PROVENANCE.md

      - name: Package unsigned IPA
        working-directory: build
        run: zip -qry MaxPS4-core-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-core-unsigned
          path: build/MaxPS4-core-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
