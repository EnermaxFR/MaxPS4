name: Build MaxPS4 iOS Core IPA

on:
  workflow_dispatch:
  push:
    branches: ["shadps4-ios-core"]
    paths:
      - "MaxPS4-iOS/**"
      - "docs/fexcore-0.6-lock.md"
      - "docs/shadps4-fex-0.7-lock.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/blank.yml"

permissions:
  contents: read

env:
  FEXCORE_REFERENCE_REPO: https://github.com/Leviidev/AetherPS4.git
  FEXCORE_REFERENCE_REV: 3347fc13f19860855ce91b66356940989ea6b6a6
  FEXCORE_UPSTREAM_REV: f2b679f6028ce1c38875233aecfcf5d3f8ebecec

jobs:
  fexcore-ios-gate:
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout MaxPS4
        uses: actions/checkout@v4

      - name: Fetch locked FEXCore Darwin reference
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$FEXCORE_REFERENCE_REPO" build/aether-reference
          git -C build/aether-reference fetch --depth 1 origin "$FEXCORE_REFERENCE_REV"
          git -C build/aether-reference checkout --detach FETCH_HEAD
          test "$(git -C build/aether-reference rev-parse HEAD)" = "$FEXCORE_REFERENCE_REV"
          test -f build/aether-reference/runtime/sources/fexcore-darwin/LICENSE
          grep -q "MIT License" build/aether-reference/runtime/sources/fexcore-darwin/LICENSE
          grep -q "$FEXCORE_UPSTREAM_REV" build/aether-reference/runtime/sources/fexcore-darwin/README.aethercore-darwin.md

      - name: Audit shadPS4 FEX license boundary
        shell: bash
        run: |
          set -euo pipefail
          REF="$GITHUB_WORKSPACE/build/aether-reference"
          grep -Fq "SPDX-License-Identifier: MIT" "$REF/src/core/fex/fex_guest_engine.cpp"
          grep -Fq "SPDX-License-Identifier: MIT" "$REF/src/core/fex/fex_guest_engine.h"
          grep -Fq "SPDX-License-Identifier: MIT" "$REF/src/core/guest_cpu/fex_guest_cpu.cpp"
          grep -Fq "SPDX-License-Identifier: MIT" "$REF/src/core/guest_cpu/fex_guest_cpu.h"
          grep -Fq "SPDX-License-Identifier: MIT" "$REF/src/core/guest_cpu/fex_hle_bridge.cpp"
          grep -Fq "SPDX-License-Identifier: MIT" "$REF/src/core/guest_cpu/fex_hle_bridge.h"
          grep -Fq "SPDX-License-Identifier: GPL-2.0-or-later" "$REF/src/common/types.h"
          grep -Fq "SPDX-License-Identifier: GPL-2.0-or-later" "$REF/src/core/libraries/kernel/threads/exception.h"
          echo "shadPS4/FEX license boundary verified"

      - name: Patch guest harness FEX internal include path
        shell: bash
        run: |
          set -euo pipefail
          CMAKE_FILE="$GITHUB_WORKSPACE/build/aether-reference/runtime/sources/fexcore-darwin/CMakeLists.txt"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/aether-reference/runtime/sources/fexcore-darwin/CMakeLists.txt")
          s = p.read_text()
          marker = 'target_include_directories(fexcore-guest-harness PRIVATE'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit("guest harness include block not found")
          close = s.find(')', pos)
          if close < 0:
              raise SystemExit("guest harness include block terminator not found")
          block = s[pos:close+1]
          include = '"${CMAKE_SOURCE_DIR}/FEXCore/Source"'
          if include not in block:
              block = block[:-1] + '\n        ' + include + ')'
              s = s[:pos] + block + s[close+1:]
          p.write_text(s)
          PY
          grep -A8 -n "target_include_directories(fexcore-guest-harness" "$CMAKE_FILE"
          grep -A8 -n "target_include_directories(fexcore-guest-harness" "$CMAKE_FILE" | grep -F 'FEXCore/Source'

      - name: Patch locked guest harness namespace for current bridge API
        shell: bash
        run: |
          set -euo pipefail
          HARNESS="$GITHUB_WORKSPACE/build/aether-reference/runtime/probes/fexcore-guest-harness.cpp"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/aether-reference/runtime/probes/fexcore-guest-harness.cpp")
          s = p.read_text()
          old = "AetherPS4::GuestCpu::"
          count = s.count(old)
          if count == 0:
              raise SystemExit("expected AetherPS4::GuestCpu namespace references were not found")
          s = s.replace(old, "Core::GuestCpu::")
          p.write_text(s)
          print(f"patched {count} guest CPU namespace references")
          PY
          grep -n "Core::GuestCpu::" "$HARNESS" | head -20

      - name: Apply MaxPS4 iOS smoke packaging patch
        shell: bash
        run: |
          set -euo pipefail
          CMAKE_FILE="$GITHUB_WORKSPACE/build/aether-reference/runtime/sources/fexcore-darwin/CMakeLists.txt"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/aether-reference/runtime/sources/fexcore-darwin/CMakeLists.txt")
          s = p.read_text()
          s = s.replace(
              'install(TARGETS fexcore-smoke fexcore-guest-harness RUNTIME DESTINATION bin)',
              'install(TARGETS fexcore-smoke fexcore-guest-harness RUNTIME DESTINATION bin BUNDLE DESTINATION bin)'
          )
          s = s.replace(
              'install(TARGETS fexcore-smoke RUNTIME DESTINATION bin)',
              'install(TARGETS fexcore-smoke RUNTIME DESTINATION bin BUNDLE DESTINATION bin)'
          )
          p.write_text(s)
          PY
          grep -n "install(TARGETS fexcore-smoke" "$CMAKE_FILE"

      - name: Patch smoke probe for iOS JIT API availability
        shell: bash
        run: |
          set -euo pipefail
          PROBE="$GITHUB_WORKSPACE/build/aether-reference/runtime/probes/fexcore-smoke.cpp"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/aether-reference/runtime/probes/fexcore-smoke.cpp")
          s = p.read_text()
          s = s.replace('#ifdef __APPLE__\n#include <pthread.h>\n#endif',
                        '#ifdef __APPLE__\n#include <pthread.h>\n#include <TargetConditionals.h>\n#endif')
          s = s.replace('#ifdef __APPLE__\n    // Darwin refuses any RWX/exec-capable anonymous mapping',
                        '#if defined(__APPLE__) && !TARGET_OS_IPHONE\n    // Darwin refuses any RWX/exec-capable anonymous mapping')
          s = s.replace('#ifdef __APPLE__\n  // pthread_jit_write_protect_np is a *global per-thread* toggle',
                        '#if defined(__APPLE__) && !TARGET_OS_IPHONE\n  // pthread_jit_write_protect_np is a *global per-thread* toggle')
          p.write_text(s)
          PY
          grep -n "pthread_jit_write_protect_np\|TARGET_OS_IPHONE" "$PROBE"

      - name: Add iOS clear-cache compatibility shim
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/build/aether-reference/runtime/sources/fexcore-darwin"
          cat > "$SRC/MaxPS4ClearCacheShim.cpp" <<'CPP'
          #include <libkern/OSCacheControl.h>
          #include <cstddef>

          extern "C" void __clear_cache(void* begin, void* end) {
              auto* first = static_cast<unsigned char*>(begin);
              auto* last = static_cast<unsigned char*>(end);
              if (last > first) {
                  sys_icache_invalidate(first, static_cast<std::size_t>(last - first));
              }
          }
          CPP
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/aether-reference/runtime/sources/fexcore-darwin/CMakeLists.txt")
          s = p.read_text()
          s = s.replace(
              'add_executable(fexcore-smoke "${FEXCORE_SMOKE_SOURCE}")',
              'add_executable(fexcore-smoke "${FEXCORE_SMOKE_SOURCE}" "${CMAKE_SOURCE_DIR}/MaxPS4ClearCacheShim.cpp")'
          )
          p.write_text(s)
          PY
          grep -n "add_executable(fexcore-smoke" "$SRC/CMakeLists.txt"

      - name: Wire FEXCore to MaxPS4 StikDebug protocol shim
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/build/aether-reference/runtime/sources/fexcore-darwin"

          cat > "$SRC/MaxPS4JITShim.cpp" <<'CPP'
          #include <cstddef>

          #if defined(__APPLE__) && defined(__aarch64__)
          extern "C" __attribute__((noinline, optnone, naked))
          void* MaxPS4BreakGetJITMapping(void* address, std::size_t length) {
              __asm__ volatile(
                  "mov x16, #1\n"
                  "brk #0xf00d\n"
                  "ret\n"
              );
          }

          extern "C" __attribute__((noinline, optnone, naked))
          void MaxPS4BreakJITDetach(void) {
              __asm__ volatile(
                  "mov x16, #0\n"
                  "brk #0xf00d\n"
                  "ret\n"
              );
          }
          #else
          extern "C" void* MaxPS4BreakGetJITMapping(void*, std::size_t) { return nullptr; }
          extern "C" void MaxPS4BreakJITDetach(void) {}
          #endif
          CPP

          # Build an app-hosted copy of the smoke probe. The original command-line
          # executable remains the CI link proof; this copy is callable from UIKit.
          cp "$GITHUB_WORKSPACE/build/aether-reference/runtime/probes/fexcore-smoke.cpp" "$SRC/MaxPS4FEXSmokeHost.cpp"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/aether-reference/runtime/sources/fexcore-darwin/MaxPS4FEXSmokeHost.cpp")
          s = p.read_text()
          s = s.replace("int main() {", 'extern "C" int maxps4_fex_smoke_run() {', 1)
          s = s.replace(
              "Mapping codePage {static_cast<size_t>(pageSize), PROT_READ | PROT_WRITE | PROT_EXEC};",
              "Mapping codePage {static_cast<size_t>(pageSize), PROT_READ | PROT_WRITE};",
              1
          )
          p.write_text(s)
          PY

          cat > "$SRC/MaxPS4FEXHost.mm" <<'OBJC'
          #import <UIKit/UIKit.h>

          extern "C" int maxps4_fex_smoke_run(void);

          @interface MaxPS4FEXViewController : UIViewController
          @property(nonatomic, strong) UILabel *statusLabel;
          @property(nonatomic, strong) UIButton *runButton;
          @end

          @implementation MaxPS4FEXViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = UIColor.systemBackgroundColor;

              UILabel *title = [[UILabel alloc] init];
              title.translatesAutoresizingMaskIntoConstraints = NO;
              title.text = @"MaxPS4 FEXCore 0.6";
              title.font = [UIFont boldSystemFontOfSize:28.0];

              self.statusLabel = [[UILabel alloc] init];
              self.statusLabel.translatesAutoresizingMaskIntoConstraints = NO;
              self.statusLabel.numberOfLines = 0;
              self.statusLabel.text = @"1. Lance StikDebug avec universal.js\n2. Reviens ici\n3. Appuie sur Tester FEXCore";

              self.runButton = [UIButton buttonWithType:UIButtonTypeSystem];
              self.runButton.translatesAutoresizingMaskIntoConstraints = NO;
              [self.runButton setTitle:@"Tester FEXCore" forState:UIControlStateNormal];
              self.runButton.titleLabel.font = [UIFont boldSystemFontOfSize:20.0];
              [self.runButton addTarget:self action:@selector(runProbe) forControlEvents:UIControlEventTouchUpInside];

              UIStackView *stack = [[UIStackView alloc] initWithArrangedSubviews:@[title, self.statusLabel, self.runButton]];
              stack.translatesAutoresizingMaskIntoConstraints = NO;
              stack.axis = UILayoutConstraintAxisVertical;
              stack.spacing = 24.0;
              [self.view addSubview:stack];

              [NSLayoutConstraint activateConstraints:@[
                  [stack.leadingAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.leadingAnchor constant:24.0],
                  [stack.trailingAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.trailingAnchor constant:-24.0],
                  [stack.centerYAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.centerYAnchor]
              ]];
          }

          - (void)runProbe {
              self.runButton.enabled = NO;
              self.statusLabel.text = @"FEXCore en cours…";
              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  int result = maxps4_fex_smoke_run();
                  dispatch_async(dispatch_get_main_queue(), ^{
                      if (result == 0) {
                          self.statusLabel.text = @"FEXCORE_SMOKE_OK\nGPR • stack • FP • threads • TLS • callback • invalidation : OK";
                      } else {
                          self.statusLabel.text = [NSString stringWithFormat:@"FEXCORE_SMOKE_FAIL code=%d\nEnvoie-moi ce code ou le crash LiveContainer.", result];
                      }
                      self.runButton.enabled = YES;
                  });
              });
          }
          @end

          @interface MaxPS4FEXAppDelegate : UIResponder <UIApplicationDelegate>
          @property(nonatomic, strong) UIWindow *window;
          @end

          @implementation MaxPS4FEXAppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              self.window.rootViewController = [[MaxPS4FEXViewController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([MaxPS4FEXAppDelegate class]));
              }
          }
          OBJC

          python3 - <<'PY'
          from pathlib import Path
          import re

          cmake = Path("build/aether-reference/runtime/sources/fexcore-darwin/CMakeLists.txt")
          s = cmake.read_text()
          s = s.replace(
              'add_executable(fexcore-smoke "${FEXCORE_SMOKE_SOURCE}" "${CMAKE_SOURCE_DIR}/MaxPS4ClearCacheShim.cpp")',
              'add_executable(fexcore-smoke "${FEXCORE_SMOKE_SOURCE}" "${CMAKE_SOURCE_DIR}/MaxPS4ClearCacheShim.cpp" "${CMAKE_SOURCE_DIR}/MaxPS4JITShim.cpp")'
          )

          host_block = r'''
            enable_language(OBJCXX)
            add_executable(maxps4-fex-probe
              "${CMAKE_SOURCE_DIR}/MaxPS4FEXHost.mm"
              "${CMAKE_SOURCE_DIR}/MaxPS4FEXSmokeHost.cpp"
              "${CMAKE_SOURCE_DIR}/MaxPS4ClearCacheShim.cpp"
              "${CMAKE_SOURCE_DIR}/MaxPS4JITShim.cpp")
            target_compile_features(maxps4-fex-probe PRIVATE cxx_std_20)
            target_include_directories(maxps4-fex-probe PRIVATE
              "${CMAKE_BINARY_DIR}/generated"
              "${CMAKE_SOURCE_DIR}/Source/Tools/CommonTools")
            target_link_libraries(maxps4-fex-probe PRIVATE
              FEXCore Common CommonTools JemallocLibs ${PTHREAD_LIB}
              "-framework UIKit" "-framework Foundation")
          '''
          needle = '''    target_link_libraries(fexcore-smoke PRIVATE
                FEXCore Common CommonTools JemallocLibs ${PTHREAD_LIB})
          '''
          if needle not in s:
              raise SystemExit("failed to locate smoke target link block")
          s = s.replace(needle, needle + host_block, 1)
          cmake.write_text(s)

          alloc = Path("build/aether-reference/runtime/sources/fexcore-darwin/FEXCore/Source/Utils/Allocator.cpp")
          a = alloc.read_text()
          anchor = 'namespace {\nusing BreakGetJITMappingFn = void* (*)(void*, size_t);'
          a = a.replace(
              anchor,
              'extern "C" void* MaxPS4BreakGetJITMapping(void*, size_t);\n'
              'extern "C" void MaxPS4BreakJITDetach(void);\n\n'
              + anchor
          )
          pattern = re.compile(
              r'const BreakpointJITSymbols& GetBreakpointJITSymbols\(\) noexcept \{.*?\n\}',
              re.S
          )
          replacement = '''const BreakpointJITSymbols& GetBreakpointJITSymbols() noexcept {
            static const BreakpointJITSymbols symbols = [] {
              BreakpointJITSymbols s;
              s.get_jit_mapping = &MaxPS4BreakGetJITMapping;
              s.jit_detach = &MaxPS4BreakJITDetach;
              return s;
            }();
            return symbols;
          }'''
          a, count = pattern.subn(replacement, a, count=1)
          if count != 1:
              raise SystemExit("failed to patch GetBreakpointJITSymbols")
          alloc.write_text(a)
          PY

          grep -n "maxps4-fex-probe" "$SRC/CMakeLists.txt"
          grep -n "MaxPS4BreakGetJITMapping" "$SRC/FEXCore/Source/Utils/Allocator.cpp"

      - name: Install FEXCore Python configure dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$GITHUB_WORKSPACE/build/fex-python"
          "$GITHUB_WORKSPACE/build/fex-python/bin/python" -m pip install --upgrade pip packaging 'setuptools<81'
          "$GITHUB_WORKSPACE/build/fex-python/bin/python" -c 'import packaging, pkg_resources; print("FEXCore Python dependencies OK")'
          echo "$GITHUB_WORKSPACE/build/fex-python/bin" >> "$GITHUB_PATH"

      - name: Configure FEXCore for arm64 iOS
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/build/aether-reference/runtime/sources/fexcore-darwin"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cmake -S "$SRC" -B build/fexcore-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_C_COMPILER="$(xcrun --find clang)" \
            -DCMAKE_CXX_COMPILER="$(xcrun --find clang++)" \
            -DCMAKE_C_COMPILER_TARGET=arm64-apple-ios17.4 \
            -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-ios17.4 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.4 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_FEXCORE_ONLY=ON \
            -DTUNE_CPU=generic \
            -DTUNE_ARCH=generic \
            -DFEXCORE_SMOKE_SOURCE="$GITHUB_WORKSPACE/build/aether-reference/runtime/probes/fexcore-smoke.cpp" \
            -DFEXCORE_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE/build/aether-reference/src" \
            -DFEXCORE_GUEST_HARNESS_SOURCES="$GITHUB_WORKSPACE/build/aether-reference/src/core/fex/fex_guest_engine.cpp;$GITHUB_WORKSPACE/build/aether-reference/src/core/guest_cpu/fex_guest_cpu.cpp;$GITHUB_WORKSPACE/build/aether-reference/src/core/guest_cpu/hle_call_adapter.cpp;$GITHUB_WORKSPACE/build/aether-reference/src/core/guest_cpu/fex_hle_bridge.cpp;$GITHUB_WORKSPACE/build/aether-reference/runtime/probes/fexcore-guest-harness.cpp" \
            -DBUILD_FEXCORE_SMOKE=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF \
            -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF \
            -DENABLE_GDB_SYMBOLS=OFF \
            -DENABLE_LTO=OFF \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DENABLE_OFFLINE_TELEMETRY=OFF \
            -DENABLE_VIXL_DISASSEMBLER=OFF \
            -DENABLE_VIXL_SIMULATOR=OFF \
            -DENABLE_ZYDIS=OFF \
            -DENABLE_FEXCORE_PROFILER=OFF

      - name: Compile FEXCore iOS probe target
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/fexcore-ios --target FEXCore --parallel 3

      - name: Link FEXCore iOS smoke probe
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/fexcore-ios --target fexcore-smoke --parallel 3
          file build/fexcore-ios/Bin/fexcore-smoke.app/fexcore-smoke
          xcrun vtool -show-build build/fexcore-ios/Bin/fexcore-smoke.app/fexcore-smoke || true
          nm -gU build/fexcore-ios/Bin/fexcore-smoke.app/fexcore-smoke | grep -E "FEX|main" | head -40 || true

      - name: Compile shadPS4 FEX guest bridge harness
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/fexcore-ios --target fexcore-guest-harness --parallel 3
          file build/fexcore-ios/Bin/fexcore-guest-harness.app/fexcore-guest-harness
          xcrun vtool -show-build build/fexcore-ios/Bin/fexcore-guest-harness.app/fexcore-guest-harness || true

      - name: Build app-hosted FEXCore probe
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/fexcore-ios --target maxps4-fex-probe --parallel 3
          file build/fexcore-ios/Bin/maxps4-fex-probe.app/maxps4-fex-probe

      - name: Package on-device FEXCore 0.6 probe IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="build/fexcore-ios/Bin/maxps4-fex-probe.app"
          PAYLOAD="build/fexcore-probe-ipa/Payload"
          mkdir -p "$PAYLOAD"
          rm -rf "$PAYLOAD/MaxPS4FEXProbe.app"
          cp -R "$APP" "$PAYLOAD/MaxPS4FEXProbe.app"
          mv "$PAYLOAD/MaxPS4FEXProbe.app/maxps4-fex-probe" "$PAYLOAD/MaxPS4FEXProbe.app/MaxPS4FEXProbe"
          cat > "$PAYLOAD/MaxPS4FEXProbe.app/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>fr</string>
            <key>CFBundleDisplayName</key><string>MaxPS4 FEX Probe 0.6</string>
            <key>CFBundleExecutable</key><string>MaxPS4FEXProbe</string>
            <key>CFBundleIdentifier</key><string>com.enermaxfr.maxps4.fexprobe06</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>MaxPS4FEXProbe</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.6</string>
            <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>17.4</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict></plist>
          PLIST
          cp build/aether-reference/runtime/sources/fexcore-darwin/LICENSE "$PAYLOAD/MaxPS4FEXProbe.app/FEXCore-LICENSE"
          cp THIRD_PARTY_NOTICES.md "$PAYLOAD/MaxPS4FEXProbe.app/THIRD_PARTY_NOTICES.md"
          cp docs/fexcore-0.6-lock.md "$PAYLOAD/MaxPS4FEXProbe.app/FEXCORE_0_6_PROVENANCE.md"
          plutil -lint "$PAYLOAD/MaxPS4FEXProbe.app/Info.plist"
          (cd build/fexcore-probe-ipa && zip -qry ../MaxPS4-FEXCore-Probe-unsigned.ipa Payload)

      - name: Upload on-device FEXCore probe IPA
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-FEXCore-Probe-unsigned
          path: build/MaxPS4-FEXCore-Probe-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Package FEXCore iOS link proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/fexcore-proof
          cp build/fexcore-ios/Bin/fexcore-smoke.app/fexcore-smoke build/fexcore-proof/
          cp build/fexcore-ios/FEXCore/Source/libFEXCore.a build/fexcore-proof/
          cp build/fexcore-ios/Bin/fexcore-guest-harness.app/fexcore-guest-harness build/fexcore-proof/
          cp build/aether-reference/runtime/sources/fexcore-darwin/LICENSE build/fexcore-proof/FEXCore-LICENSE
          cp build/aether-reference/LICENSE build/fexcore-proof/AetherPS4-GPL2-LICENSE
          cp docs/shadps4-fex-0.7-lock.md build/fexcore-proof/SHADPS4_FEX_0_7_PROVENANCE.md
          printf "%s\n" "$FEXCORE_UPSTREAM_REV" > build/fexcore-proof/FEXCORE_UPSTREAM_REVISION.txt

      - name: Upload FEXCore iOS link proof
        uses: actions/upload-artifact@v4
        with:
          name: FEXCore-iOS-link-proof
          path: build/fexcore-proof
          if-no-files-found: error
          retention-days: 14

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          swiftc --version

      - name: Compile native core and backend
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/core
          for SRC in MaxPS4-iOS/Bridge/maxps4_core.cpp MaxPS4-iOS/Bridge/maxps4_backend.cpp; do
            OUT="build/core/$(basename "${SRC%.cpp}").o"
            xcrun --sdk iphoneos clang++ -target arm64-apple-ios16.0 -isysroot "$SDK" \
              -std=c++20 -O2 -fvisibility=hidden -I MaxPS4-iOS/Bridge -c "$SRC" -o "$OUT"
            file "$OUT"
          done

      - name: Build arm64 iOS executable
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/Payload/MaxPS4.app
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.0 -sdk "$SDK" \
            -I MaxPS4-iOS/Bridge -O -parse-as-library -framework SwiftUI -framework UIKit \
            MaxPS4-iOS/Sources/*.swift build/core/maxps4_core.o build/core/maxps4_backend.o \
            -Xlinker -lc++ -o build/Payload/MaxPS4.app/MaxPS4

      - name: Bundle compliance notices
        run: |
          cp THIRD_PARTY_NOTICES.md build/Payload/MaxPS4.app/THIRD_PARTY_NOTICES.md
          cp docs/fexcore-0.6-lock.md build/Payload/MaxPS4.app/FEXCORE_0_6_PROVENANCE.md
          cp docs/shadps4-fex-0.7-lock.md build/Payload/MaxPS4.app/SHADPS4_FEX_0_7_PROVENANCE.md

      - name: Create Info.plist
        shell: bash
        run: |
          cat > build/Payload/MaxPS4.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>fr</string>
            <key>CFBundleDisplayName</key><string>MaxPS4 Core 0.6</string>
            <key>CFBundleExecutable</key><string>MaxPS4</string>
            <key>CFBundleIdentifier</key><string>com.enermaxfr.maxps4.core06</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>MaxPS4</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.6</string>
            <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>16.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UILaunchScreen</key><dict/>
          </dict></plist>
          PLIST
          plutil -lint build/Payload/MaxPS4.app/Info.plist

      - name: Verify executable and compliance payload
        run: |
          file build/Payload/MaxPS4.app/MaxPS4
          nm -gU build/Payload/MaxPS4.app/MaxPS4 | grep -E 'maxps4_(core|backend)' || true
          test -f build/Payload/MaxPS4.app/THIRD_PARTY_NOTICES.md
          test -f build/Payload/MaxPS4.app/FEXCORE_0_6_PROVENANCE.md
          test -f build/Payload/MaxPS4.app/SHADPS4_FEX_0_7_PROVENANCE.md

      - name: Package unsigned IPA
        working-directory: build
        run: zip -qry MaxPS4-core-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-core-unsigned
          path: build/MaxPS4-core-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
