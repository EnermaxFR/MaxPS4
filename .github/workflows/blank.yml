name: Build MaxPS4 iOS Core IPA

on:
  workflow_dispatch:
  push:
    branches: ["shadps4-ios-core"]
    paths:
      - "MaxPS4-iOS/**"
      - "docs/fexcore-0.6-lock.md"
      - "docs/shadps4-fex-0.7-lock.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/blank.yml"

permissions:
  contents: write

env:
  FEXCORE_REFERENCE_REPO: https://github.com/Leviidev/AetherPS4.git
  FEXCORE_REFERENCE_REV: 3347fc13f19860855ce91b66356940989ea6b6a6
  FEXCORE_UPSTREAM_REV: f2b679f6028ce1c38875233aecfcf5d3f8ebecec

jobs:
  fexcore-ios-gate:
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout MaxPS4
        uses: actions/checkout@v4

      - name: Fetch locked FEXCore Darwin reference
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$FEXCORE_REFERENCE_REPO" build/aether-reference
          git -C build/aether-reference fetch --depth 1 origin "$FEXCORE_REFERENCE_REV"
          git -C build/aether-reference checkout --detach FETCH_HEAD
          test "$(git -C build/aether-reference rev-parse HEAD)" = "$FEXCORE_REFERENCE_REV"
          test -f build/aether-reference/runtime/sources/fexcore-darwin/LICENSE
          grep -q "MIT License" build/aether-reference/runtime/sources/fexcore-darwin/LICENSE
          grep -q "$FEXCORE_UPSTREAM_REV" build/aether-reference/runtime/sources/fexcore-darwin/README.aethercore-darwin.md

      - name: Audit shadPS4 FEX license boundary
        shell: bash
        run: |
          set -euo pipefail
          REF="$GITHUB_WORKSPACE/build/aether-reference"
          grep -Fq "SPDX-License-Identifier: MIT" "$REF/src/core/fex/fex_guest_engine.cpp"
          grep -Fq "SPDX-License-Identifier: MIT" "$REF/src/core/fex/fex_guest_engine.h"
          grep -Fq "SPDX-License-Identifier: MIT" "$REF/src/core/guest_cpu/fex_guest_cpu.cpp"
          grep -Fq "SPDX-License-Identifier: MIT" "$REF/src/core/guest_cpu/fex_guest_cpu.h"
          grep -Fq "SPDX-License-Identifier: MIT" "$REF/src/core/guest_cpu/fex_hle_bridge.cpp"
          grep -Fq "SPDX-License-Identifier: MIT" "$REF/src/core/guest_cpu/fex_hle_bridge.h"
          grep -Fq "SPDX-License-Identifier: GPL-2.0-or-later" "$REF/src/common/types.h"
          grep -Fq "SPDX-License-Identifier: GPL-2.0-or-later" "$REF/src/core/libraries/kernel/threads/exception.h"
          grep -Fq "SPDX-License-Identifier: GPL-2.0-or-later" "$REF/src/core/ios/ios_jit_allocator.cpp"
          grep -Fq "SPDX-License-Identifier: GPL-2.0-or-later" "$REF/src/core/ios/ios_jit_allocator.h"
          echo "shadPS4/FEX license boundary verified"

      - name: Patch guest harness FEX internal include path
        shell: bash
        run: |
          set -euo pipefail
          CMAKE_FILE="$GITHUB_WORKSPACE/build/aether-reference/runtime/sources/fexcore-darwin/CMakeLists.txt"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/aether-reference/runtime/sources/fexcore-darwin/CMakeLists.txt")
          s = p.read_text()
          marker = 'target_include_directories(fexcore-guest-harness PRIVATE'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit("guest harness include block not found")
          close = s.find(')', pos)
          if close < 0:
              raise SystemExit("guest harness include block terminator not found")
          block = s[pos:close+1]
          include = '"${CMAKE_SOURCE_DIR}/FEXCore/Source"'
          if include not in block:
              block = block[:-1] + '\n        ' + include + ')'
              s = s[:pos] + block + s[close+1:]
          p.write_text(s)
          PY
          grep -A8 -n "target_include_directories(fexcore-guest-harness" "$CMAKE_FILE"
          grep -A8 -n "target_include_directories(fexcore-guest-harness" "$CMAKE_FILE" | grep -F 'FEXCore/Source'

      - name: Patch locked guest harness namespace for current bridge API
        shell: bash
        run: |
          set -euo pipefail
          HARNESS="$GITHUB_WORKSPACE/build/aether-reference/runtime/probes/fexcore-guest-harness.cpp"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/aether-reference/runtime/probes/fexcore-guest-harness.cpp")
          s = p.read_text()
          old = "AetherPS4::GuestCpu::"
          count = s.count(old)
          if count == 0:
              raise SystemExit("expected AetherPS4::GuestCpu namespace references were not found")
          s = s.replace(old, "Core::GuestCpu::")
          old_mapping = (
              '  const bool mappingOk = std::holds_alternative<uint64_t>(cachedScalar) &&\n'
              '                         std::get<uint64_t>(cachedScalar) == scalarVeneer && veneerRanges.size() == 5;'
          )
          new_mapping = (
              '  const bool mappingOk =\n'
              '      std::holds_alternative<uint64_t>(cachedScalar) &&\n'
              '      std::get<uint64_t>(cachedScalar) == scalarVeneer &&\n'
              '      veneerAllocator.QueryExecutableRange(scalarVeneer).has_value() &&\n'
              '      veneerAllocator.QueryExecutableRange(pointerVeneer).has_value() &&\n'
              '      veneerAllocator.QueryExecutableRange(functionPointerVeneer).has_value() &&\n'
              '      veneerAllocator.QueryExecutableRange(vectorVeneer).has_value() &&\n'
              '      veneerAllocator.QueryExecutableRange(stackVeneer).has_value();'
          )
          if old_mapping not in s:
              raise SystemExit("expected HLE veneer mapping assertion was not found")
          s = s.replace(old_mapping, new_mapping, 1)
          p.write_text(s)
          print(f"patched {count} guest CPU namespace references and iOS-safe HLE veneer mapping validation")
          PY
          grep -n "Core::GuestCpu::" "$HARNESS" | head -20

      - name: Apply MaxPS4 iOS smoke packaging patch
        shell: bash
        run: |
          set -euo pipefail
          CMAKE_FILE="$GITHUB_WORKSPACE/build/aether-reference/runtime/sources/fexcore-darwin/CMakeLists.txt"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/aether-reference/runtime/sources/fexcore-darwin/CMakeLists.txt")
          s = p.read_text()
          s = s.replace(
              'install(TARGETS fexcore-smoke fexcore-guest-harness RUNTIME DESTINATION bin)',
              'install(TARGETS fexcore-smoke fexcore-guest-harness RUNTIME DESTINATION bin BUNDLE DESTINATION bin)'
          )
          s = s.replace(
              'install(TARGETS fexcore-smoke RUNTIME DESTINATION bin)',
              'install(TARGETS fexcore-smoke RUNTIME DESTINATION bin BUNDLE DESTINATION bin)'
          )
          p.write_text(s)
          PY
          grep -n "install(TARGETS fexcore-smoke" "$CMAKE_FILE"

      - name: Patch smoke probe for iOS JIT API availability
        shell: bash
        run: |
          set -euo pipefail
          PROBE="$GITHUB_WORKSPACE/build/aether-reference/runtime/probes/fexcore-smoke.cpp"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/aether-reference/runtime/probes/fexcore-smoke.cpp")
          s = p.read_text()
          s = s.replace('#ifdef __APPLE__\n#include <pthread.h>\n#endif',
                        '#ifdef __APPLE__\n#include <pthread.h>\n#include <TargetConditionals.h>\n#endif')
          s = s.replace('#ifdef __APPLE__\n    // Darwin refuses any RWX/exec-capable anonymous mapping',
                        '#if defined(__APPLE__) && !TARGET_OS_IPHONE\n    // Darwin refuses any RWX/exec-capable anonymous mapping')
          s = s.replace('#ifdef __APPLE__\n  // pthread_jit_write_protect_np is a *global per-thread* toggle',
                        '#if defined(__APPLE__) && !TARGET_OS_IPHONE\n  // pthread_jit_write_protect_np is a *global per-thread* toggle')
          p.write_text(s)
          PY
          grep -n "pthread_jit_write_protect_np\|TARGET_OS_IPHONE" "$PROBE"

      - name: Add iOS clear-cache compatibility shim
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/build/aether-reference/runtime/sources/fexcore-darwin"
          cat > "$SRC/MaxPS4ClearCacheShim.cpp" <<'CPP'
          #include <libkern/OSCacheControl.h>
          #include <cstddef>

          extern "C" void __clear_cache(void* begin, void* end) {
              auto* first = static_cast<unsigned char*>(begin);
              auto* last = static_cast<unsigned char*>(end);
              if (last > first) {
                  sys_icache_invalidate(first, static_cast<std::size_t>(last - first));
              }
          }
          CPP
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/aether-reference/runtime/sources/fexcore-darwin/CMakeLists.txt")
          s = p.read_text()
          s = s.replace(
              'add_executable(fexcore-smoke "${FEXCORE_SMOKE_SOURCE}")',
              'add_executable(fexcore-smoke "${FEXCORE_SMOKE_SOURCE}" "${CMAKE_SOURCE_DIR}/MaxPS4ClearCacheShim.cpp")'
          )
          p.write_text(s)
          PY
          grep -n "add_executable(fexcore-smoke" "$SRC/CMakeLists.txt"

      - name: Wire FEXCore to MaxPS4 StikDebug protocol shim
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/build/aether-reference/runtime/sources/fexcore-darwin"

          cat > "$SRC/MaxPS4JITShim.cpp" <<'CPP'
          #include <cstddef>

          #if defined(__APPLE__) && defined(__aarch64__)
          extern "C" __attribute__((noinline, optnone, naked))
          void* MaxPS4BreakGetJITMapping(void* address, std::size_t length) {
              __asm__ volatile(
                  "mov x16, #1\n"
                  "brk #0xf00d\n"
                  "ret\n"
              );
          }

          extern "C" __attribute__((noinline, optnone, naked))
          void MaxPS4BreakJITDetach(void) {
              __asm__ volatile(
                  "mov x16, #0\n"
                  "brk #0xf00d\n"
                  "ret\n"
              );
          }
          #else
          extern "C" void* MaxPS4BreakGetJITMapping(void*, std::size_t) { return nullptr; }
          extern "C" void MaxPS4BreakJITDetach(void) {}
          #endif
          CPP

          # Build an app-hosted copy of the smoke probe. The original command-line
          # executable remains the CI link proof; this copy is callable from UIKit.
          cp "$GITHUB_WORKSPACE/build/aether-reference/runtime/probes/fexcore-smoke.cpp" "$SRC/MaxPS4FEXSmokeHost.cpp"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/aether-reference/runtime/sources/fexcore-darwin/MaxPS4FEXSmokeHost.cpp")
          s = p.read_text()
          s = s.replace("int main() {", 'extern "C" int maxps4_fex_smoke_run() {', 1)
          s = s.replace(
              "Mapping codePage {static_cast<size_t>(pageSize), PROT_READ | PROT_WRITE | PROT_EXEC};",
              "Mapping codePage {static_cast<size_t>(pageSize), PROT_READ | PROT_WRITE};",
              1
          )
          p.write_text(s)
          PY

          cp "$GITHUB_WORKSPACE/build/aether-reference/runtime/probes/fexcore-guest-harness.cpp" "$SRC/MaxPS4FEXGuestHost.cpp"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/aether-reference/runtime/sources/fexcore-darwin/MaxPS4FEXGuestHost.cpp")
          s = p.read_text()
          if s.count("int main() {") != 1:
              raise SystemExit("expected exactly one guest harness main()")
          s = s.replace("int main() {", 'extern "C" int maxps4_fex_guest_harness_run() {', 1)
          s = s.replace('#include "../../src/core/fex/fex_guest_engine.h"', '#include "core/fex/fex_guest_engine.h"')
          s = s.replace('#include "../../src/core/guest_cpu/fex_guest_cpu.h"', '#include "core/guest_cpu/fex_guest_cpu.h"')
          s = s.replace('#include "../../src/core/guest_cpu/fex_hle_bridge.h"', '#include "core/guest_cpu/fex_hle_bridge.h"')
          s = s.replace(
              'namespace {\n',
              '#include <string>\n\nstatic thread_local std::string g_maxps4_guest_last_error = "none";\n'
              'extern "C" const char* maxps4_fex_guest_last_error() { return g_maxps4_guest_last_error.c_str(); }\n\n'
              'namespace {\n',
              1
          )
          s = s.replace(
              'int Fail(const AetherPS4::Fex::EngineFailure& failure) {\n'
              '  std::fprintf(stderr, "FEXCORE_GUEST_ENGINE_FAIL stage=%d error=%d\\n", static_cast<int>(failure.Stage), failure.Error);\n'
              '  return 1;\n'
              '}',
              'int Fail(const AetherPS4::Fex::EngineFailure& failure) {\n'
              '  char buf[160];\n'
              '  std::snprintf(buf, sizeof(buf), "ENGINE stage=%d error=%d", static_cast<int>(failure.Stage), failure.Error);\n'
              '  g_maxps4_guest_last_error = buf;\n'
              '  std::fprintf(stderr, "FEXCORE_GUEST_ENGINE_FAIL %s\\n", buf);\n'
              '  return 101;\n'
              '}'
          )
          s = s.replace(
              'int Fail(const Core::GuestExecutionFailure& failure) {\n'
              '  std::fprintf(stderr, "FEXCORE_GUEST_CPU_FAIL stage=%d error=%d\\n", static_cast<int>(failure.Stage), failure.Error);\n'
              '  return 1;\n'
              '}',
              'int Fail(const Core::GuestExecutionFailure& failure) {\n'
              '  char buf[160];\n'
              '  std::snprintf(buf, sizeof(buf), "GUEST_CPU stage=%d error=%d", static_cast<int>(failure.Stage), failure.Error);\n'
              '  g_maxps4_guest_last_error = buf;\n'
              '  std::fprintf(stderr, "FEXCORE_GUEST_CPU_FAIL %s\\n", buf);\n'
              '  return 102;\n'
              '}'
          )
          s = s.replace(
              'if (!codePage.IsValid() || !stackPage.IsValid()) return 1;',
              'if (!codePage.IsValid() || !stackPage.IsValid()) { g_maxps4_guest_last_error = "HOST_MAP code/stack mmap failed"; return 103; }'
          )
          s = s.replace(
              'if (!codePage.MakeGuestExecutable()) return 1;',
              'if (!codePage.MakeGuestExecutable()) { g_maxps4_guest_last_error = "HOST_MAP code mprotect(PROT_READ) failed errno=" + std::to_string(errno); return 104; }'
          )
          s = s.replace(
              'if (!overlapRejected) return Fail({Core::GuestExecutionStage::Mapping, EPROTO});',
              'if (!overlapRejected) { g_maxps4_guest_last_error = "MAPPING overlap rejection check failed"; return 105; }'
          )
          s = s.replace(
              'if (!mappingOk) return Fail({Core::GuestExecutionStage::Mapping, EPROTO});',
              'if (!mappingOk) { g_maxps4_guest_last_error = "MAPPING HLE veneer cache/range check failed count=" + std::to_string(veneerRanges.size()); return 106; }'
          )
          s = s.replace(
              '  return 0;\n}',
              '  g_maxps4_guest_last_error = "OK";\n  return 0;\n}',
              1
          )
          p.write_text(s)
          PY

          cat > "$SRC/MaxPS4FEXGuestHost.mm" <<'OBJC'
          #import <UIKit/UIKit.h>

          #include "maxps4_backend.h"

          @interface MaxPS4FEXGuestViewController : UIViewController <UIDocumentPickerDelegate>
          @property(nonatomic, strong) UILabel *statusLabel;
          @property(nonatomic, strong) UIButton *runButton;
          @property(nonatomic, strong) UIButton *loadButton;
          @end

          @implementation MaxPS4FEXGuestViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = UIColor.systemBackgroundColor;

              UILabel *title = [[UILabel alloc] init];
              title.translatesAutoresizingMaskIntoConstraints = NO;
              title.text = @"MaxPS4 shadPS4/FEX 0.8";
              title.font = [UIFont boldSystemFontOfSize:26.0];

              self.statusLabel = [[UILabel alloc] init];
              self.statusLabel.translatesAutoresizingMaskIntoConstraints = NO;
              self.statusLabel.numberOfLines = 0;
              self.statusLabel.text = @"1. Lance StikDebug avec universal.js\n2. Reviens ici\n3. Appuie sur Tester le bridge";

              self.runButton = [UIButton buttonWithType:UIButtonTypeSystem];
              self.runButton.translatesAutoresizingMaskIntoConstraints = NO;
              [self.runButton setTitle:@"Tester le bridge shadPS4/FEX" forState:UIControlStateNormal];
              self.runButton.titleLabel.font = [UIFont boldSystemFontOfSize:18.0];
              [self.runButton addTarget:self action:@selector(runProbe) forControlEvents:UIControlEventTouchUpInside];

              self.loadButton = [UIButton buttonWithType:UIButtonTypeSystem];
              self.loadButton.translatesAutoresizingMaskIntoConstraints = NO;
              [self.loadButton setTitle:@"Choisir un eboot.bin / SELF" forState:UIControlStateNormal];
              self.loadButton.titleLabel.font = [UIFont boldSystemFontOfSize:18.0];
              [self.loadButton addTarget:self action:@selector(pickExecutable) forControlEvents:UIControlEventTouchUpInside];

              UIStackView *stack = [[UIStackView alloc] initWithArrangedSubviews:@[title, self.statusLabel, self.runButton, self.loadButton]];
              stack.translatesAutoresizingMaskIntoConstraints = NO;
              stack.axis = UILayoutConstraintAxisVertical;
              stack.spacing = 24.0;
              [self.view addSubview:stack];

              [NSLayoutConstraint activateConstraints:@[
                  [stack.leadingAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.leadingAnchor constant:24.0],
                  [stack.trailingAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.trailingAnchor constant:-24.0],
                  [stack.centerYAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.centerYAnchor]
              ]];
          }

          - (void)runProbe {
              self.runButton.enabled = NO;
              self.statusLabel.text = @"Bridge shadPS4/FEX en cours…";
              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  BOOL ok = maxps4_backend_self_test();
                  const char *detail = maxps4_backend_diagnostic();
                  NSString *detailText = detail ? [NSString stringWithUTF8String:detail] : @"no detail";
                  dispatch_async(dispatch_get_main_queue(), ^{
                      if (ok) {
                          self.statusLabel.text = [NSString stringWithFormat:@"MAXPS4_BACKEND_OK\n%@", detailText];
                      } else {
                          self.statusLabel.text = [NSString stringWithFormat:@"MAXPS4_BACKEND_FAIL\n%@", detailText];
                      }
                      self.runButton.enabled = YES;
                  });
              });
          }

          - (void)pickExecutable {
              UIDocumentPickerViewController *picker =
                  [[UIDocumentPickerViewController alloc] initWithDocumentTypes:@[@"public.data"]
                                                                         inMode:UIDocumentPickerModeOpen];
              picker.delegate = self;
              picker.allowsMultipleSelection = NO;
              [self presentViewController:picker animated:YES completion:nil];
          }

          - (void)documentPicker:(UIDocumentPickerViewController *)controller
            didPickDocumentsAtURLs:(NSArray<NSURL *> *)urls {
              NSURL *url = urls.firstObject;
              if (!url) return;
              BOOL scoped = [url startAccessingSecurityScopedResource];
              BOOL ok = maxps4_backend_validate_executable(url.fileSystemRepresentation);
              const char *detail = maxps4_backend_diagnostic();
              NSString *detailText = detail ? [NSString stringWithUTF8String:detail] : @"no detail";
              self.statusLabel.text =
                  [NSString stringWithFormat:ok ? @"MAXPS4_LOADER_OK\n%@"
                                                : @"MAXPS4_LOADER_FAIL\n%@",
                                             detailText];
              if (scoped) [url stopAccessingSecurityScopedResource];
          }
          @end

          @interface MaxPS4FEXGuestAppDelegate : UIResponder <UIApplicationDelegate>
          @property(nonatomic, strong) UIWindow *window;
          @end

          @implementation MaxPS4FEXGuestAppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              self.window.rootViewController = [[MaxPS4FEXGuestViewController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([MaxPS4FEXGuestAppDelegate class]));
              }
          }
          OBJC

          cat > "$SRC/MaxPS4FEXHost.mm" <<'OBJC'
          #import <UIKit/UIKit.h>

          extern "C" int maxps4_fex_smoke_run(void);

          @interface MaxPS4FEXViewController : UIViewController
          @property(nonatomic, strong) UILabel *statusLabel;
          @property(nonatomic, strong) UIButton *runButton;
          @end

          @implementation MaxPS4FEXViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = UIColor.systemBackgroundColor;

              UILabel *title = [[UILabel alloc] init];
              title.translatesAutoresizingMaskIntoConstraints = NO;
              title.text = @"MaxPS4 FEXCore 0.6";
              title.font = [UIFont boldSystemFontOfSize:28.0];

              self.statusLabel = [[UILabel alloc] init];
              self.statusLabel.translatesAutoresizingMaskIntoConstraints = NO;
              self.statusLabel.numberOfLines = 0;
              self.statusLabel.text = @"1. Lance StikDebug avec universal.js\n2. Reviens ici\n3. Appuie sur Tester FEXCore";

              self.runButton = [UIButton buttonWithType:UIButtonTypeSystem];
              self.runButton.translatesAutoresizingMaskIntoConstraints = NO;
              [self.runButton setTitle:@"Tester FEXCore" forState:UIControlStateNormal];
              self.runButton.titleLabel.font = [UIFont boldSystemFontOfSize:20.0];
              [self.runButton addTarget:self action:@selector(runProbe) forControlEvents:UIControlEventTouchUpInside];

              UIStackView *stack = [[UIStackView alloc] initWithArrangedSubviews:@[title, self.statusLabel, self.runButton]];
              stack.translatesAutoresizingMaskIntoConstraints = NO;
              stack.axis = UILayoutConstraintAxisVertical;
              stack.spacing = 24.0;
              [self.view addSubview:stack];

              [NSLayoutConstraint activateConstraints:@[
                  [stack.leadingAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.leadingAnchor constant:24.0],
                  [stack.trailingAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.trailingAnchor constant:-24.0],
                  [stack.centerYAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.centerYAnchor]
              ]];
          }

          - (void)runProbe {
              self.runButton.enabled = NO;
              self.statusLabel.text = @"FEXCore en cours…";
              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  int result = maxps4_fex_smoke_run();
                  dispatch_async(dispatch_get_main_queue(), ^{
                      if (result == 0) {
                          self.statusLabel.text = @"FEXCORE_SMOKE_OK\nGPR • stack • FP • threads • TLS • callback • invalidation : OK";
                      } else {
                          self.statusLabel.text = [NSString stringWithFormat:@"FEXCORE_SMOKE_FAIL code=%d\nEnvoie-moi ce code ou le crash LiveContainer.", result];
                      }
                      self.runButton.enabled = YES;
                  });
              });
          }
          @end

          @interface MaxPS4FEXAppDelegate : UIResponder <UIApplicationDelegate>
          @property(nonatomic, strong) UIWindow *window;
          @end

          @implementation MaxPS4FEXAppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              self.window.rootViewController = [[MaxPS4FEXViewController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([MaxPS4FEXAppDelegate class]));
              }
          }
          OBJC

          python3 - <<'PY'
          from pathlib import Path
          import re

          cmake = Path("build/aether-reference/runtime/sources/fexcore-darwin/CMakeLists.txt")
          s = cmake.read_text()
          s = s.replace(
              'add_executable(fexcore-smoke "${FEXCORE_SMOKE_SOURCE}" "${CMAKE_SOURCE_DIR}/MaxPS4ClearCacheShim.cpp")',
              'add_executable(fexcore-smoke "${FEXCORE_SMOKE_SOURCE}" "${CMAKE_SOURCE_DIR}/MaxPS4ClearCacheShim.cpp" "${CMAKE_SOURCE_DIR}/MaxPS4JITShim.cpp")'
          )

          host_block = r'''
            enable_language(OBJCXX)
            add_executable(maxps4-fex-probe
              "${CMAKE_SOURCE_DIR}/MaxPS4FEXHost.mm"
              "${CMAKE_SOURCE_DIR}/MaxPS4FEXSmokeHost.cpp"
              "${CMAKE_SOURCE_DIR}/MaxPS4ClearCacheShim.cpp"
              "${CMAKE_SOURCE_DIR}/MaxPS4JITShim.cpp")
            target_compile_features(maxps4-fex-probe PRIVATE cxx_std_20)
            target_include_directories(maxps4-fex-probe PRIVATE
              "${CMAKE_BINARY_DIR}/generated"
              "${CMAKE_SOURCE_DIR}/Source/Tools/CommonTools")
            target_link_libraries(maxps4-fex-probe PRIVATE
              FEXCore Common CommonTools JemallocLibs ${PTHREAD_LIB}
              "-framework UIKit" "-framework Foundation")

            add_executable(maxps4-fex-guest-probe
              "${CMAKE_SOURCE_DIR}/MaxPS4FEXGuestHost.mm"
              "${CMAKE_SOURCE_DIR}/MaxPS4FEXGuestHost.cpp"
              "${MAXPS4_PROJECT_ROOT}/MaxPS4-iOS/Bridge/maxps4_backend.cpp"
              "${MAXPS4_PROJECT_ROOT}/MaxPS4-iOS/Bridge/maxps4_ps4_loader.cpp"
              "${FEXCORE_PROJECT_SOURCE_DIR}/core/fex/fex_guest_engine.cpp"
              "${FEXCORE_PROJECT_SOURCE_DIR}/core/guest_cpu/fex_guest_cpu.cpp"
              "${FEXCORE_PROJECT_SOURCE_DIR}/core/guest_cpu/hle_call_adapter.cpp"
              "${FEXCORE_PROJECT_SOURCE_DIR}/core/guest_cpu/fex_hle_bridge.cpp"
              "${FEXCORE_PROJECT_SOURCE_DIR}/core/ios/ios_jit_allocator.cpp"
              "${CMAKE_SOURCE_DIR}/MaxPS4JITShim.cpp")
            target_compile_features(maxps4-fex-guest-probe PRIVATE cxx_std_20)
            target_include_directories(maxps4-fex-guest-probe PRIVATE
              "${MAXPS4_PROJECT_ROOT}/MaxPS4-iOS/Bridge"
              "${FEXCORE_PROJECT_SOURCE_DIR}"
              "${CMAKE_BINARY_DIR}/generated"
              "${CMAKE_SOURCE_DIR}/Source/Tools/CommonTools"
              "${CMAKE_SOURCE_DIR}/FEXCore/Source")
            target_compile_definitions(maxps4-fex-guest-probe PRIVATE MAXPS4_HAS_SHADPS4_FEX=1)
            target_link_libraries(maxps4-fex-guest-probe PRIVATE
              FEXCore Common CommonTools JemallocLibs ${PTHREAD_LIB}
              "-framework UIKit" "-framework Foundation")

            add_executable(maxps4-integrated
              "${MAXPS4_PROJECT_ROOT}/MaxPS4-iOS/Bridge/MaxPS4IntegratedHost.mm"
              "${CMAKE_SOURCE_DIR}/MaxPS4FEXGuestHost.cpp"
              "${MAXPS4_PROJECT_ROOT}/MaxPS4-iOS/Bridge/maxps4_backend.cpp"
              "${MAXPS4_PROJECT_ROOT}/MaxPS4-iOS/Bridge/maxps4_ps4_loader.cpp"
              "${FEXCORE_PROJECT_SOURCE_DIR}/core/fex/fex_guest_engine.cpp"
              "${FEXCORE_PROJECT_SOURCE_DIR}/core/guest_cpu/fex_guest_cpu.cpp"
              "${FEXCORE_PROJECT_SOURCE_DIR}/core/guest_cpu/hle_call_adapter.cpp"
              "${FEXCORE_PROJECT_SOURCE_DIR}/core/guest_cpu/fex_hle_bridge.cpp"
              "${FEXCORE_PROJECT_SOURCE_DIR}/core/ios/ios_jit_allocator.cpp"
              "${CMAKE_SOURCE_DIR}/MaxPS4JITShim.cpp")
            target_compile_features(maxps4-integrated PRIVATE cxx_std_20)
            target_include_directories(maxps4-integrated PRIVATE
              "${MAXPS4_PROJECT_ROOT}/MaxPS4-iOS/Bridge"
              "${FEXCORE_PROJECT_SOURCE_DIR}"
              "${CMAKE_BINARY_DIR}/generated"
              "${CMAKE_SOURCE_DIR}/Source/Tools/CommonTools"
              "${CMAKE_SOURCE_DIR}/FEXCore/Source")
            target_compile_definitions(maxps4-integrated PRIVATE MAXPS4_HAS_SHADPS4_FEX=1)
            target_link_libraries(maxps4-integrated PRIVATE
              FEXCore Common CommonTools JemallocLibs ${PTHREAD_LIB}
              "-framework UIKit" "-framework Foundation")
          '''
          needle = '''    target_link_libraries(fexcore-smoke PRIVATE
                FEXCore Common CommonTools JemallocLibs ${PTHREAD_LIB})
          '''
          if needle not in s:
              raise SystemExit("failed to locate smoke target link block")
          s = s.replace(needle, needle + host_block, 1)
          cmake.write_text(s)

          ios_alloc = Path("build/aether-reference/src/core/ios/ios_jit_allocator.cpp")
          ia = ios_alloc.read_text()
          ia = ia.replace(
              '#include "common/logging/log.h"',
              '// MaxPS4 0.7 minimal harness: avoid pulling the full shadPS4/spdlog logging graph.\n'
              '#define LOG_CRITICAL(...) do {} while (0)\n'
              '#define LOG_ERROR(...) do {} while (0)\n'
              '#define LOG_WARNING(...) do {} while (0)\n'
              '#define LOG_INFO(...) do {} while (0)\n'
              '#define LOG_DEBUG(...) do {} while (0)'
          )
          ia = ia.replace(
              'namespace {\n\nusing BreakGetJITMappingFn = void* (*)(void*, size_t);',
              'extern "C" void* MaxPS4BreakGetJITMapping(void*, size_t);\n'
              'extern "C" void MaxPS4BreakJITDetach(void);\n\n'
              'namespace {\n\nusing BreakGetJITMappingFn = void* (*)(void*, size_t);'
          )
          pattern_ios = re.compile(
              r'const BreakpointJITSymbols& GetBreakpointJITSymbols\(\) noexcept \{.*?\n\}',
              re.S
          )
          replacement_ios = '''const BreakpointJITSymbols& GetBreakpointJITSymbols() noexcept {
            static const BreakpointJITSymbols symbols = [] {
              BreakpointJITSymbols s;
              s.get_jit_mapping = &MaxPS4BreakGetJITMapping;
              s.jit_detach = &MaxPS4BreakJITDetach;
              return s;
            }();
            return symbols;
          }'''
          ia, ios_count = pattern_ios.subn(replacement_ios, ia, count=1)
          if ios_count != 1:
              raise SystemExit("failed to patch shadPS4 iOS allocator JIT symbols")
          ios_alloc.write_text(ia)

          alloc = Path("build/aether-reference/runtime/sources/fexcore-darwin/FEXCore/Source/Utils/Allocator.cpp")
          a = alloc.read_text()
          anchor = 'namespace {\nusing BreakGetJITMappingFn = void* (*)(void*, size_t);'
          a = a.replace(
              anchor,
              'extern "C" void* MaxPS4BreakGetJITMapping(void*, size_t);\n'
              'extern "C" void MaxPS4BreakJITDetach(void);\n\n'
              + anchor
          )
          pattern = re.compile(
              r'const BreakpointJITSymbols& GetBreakpointJITSymbols\(\) noexcept \{.*?\n\}',
              re.S
          )
          replacement = '''const BreakpointJITSymbols& GetBreakpointJITSymbols() noexcept {
            static const BreakpointJITSymbols symbols = [] {
              BreakpointJITSymbols s;
              s.get_jit_mapping = &MaxPS4BreakGetJITMapping;
              s.jit_detach = &MaxPS4BreakJITDetach;
              return s;
            }();
            return symbols;
          }'''
          a, count = pattern.subn(replacement, a, count=1)
          if count != 1:
              raise SystemExit("failed to patch GetBreakpointJITSymbols")
          alloc.write_text(a)
          PY

          grep -n "maxps4-fex-probe" "$SRC/CMakeLists.txt"
          grep -n "maxps4-fex-guest-probe" "$SRC/CMakeLists.txt"
          grep -n "MaxPS4BreakGetJITMapping" "$SRC/FEXCore/Source/Utils/Allocator.cpp"

      - name: Install FEXCore Python configure dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$GITHUB_WORKSPACE/build/fex-python"
          "$GITHUB_WORKSPACE/build/fex-python/bin/python" -m pip install --upgrade pip packaging 'setuptools<81'
          "$GITHUB_WORKSPACE/build/fex-python/bin/python" -c 'import packaging, pkg_resources; print("FEXCore Python dependencies OK")'
          echo "$GITHUB_WORKSPACE/build/fex-python/bin" >> "$GITHUB_PATH"

      - name: Configure FEXCore for arm64 iOS
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/build/aether-reference/runtime/sources/fexcore-darwin"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cmake -S "$SRC" -B build/fexcore-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
