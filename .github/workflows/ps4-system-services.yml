name: PS4 system services
on:
  pull_request:
    paths:
      - 'MaxPS4-iOS/Native/maxps4_ps4_*'
      - 'MaxPS4-iOS/Native/maxps4_guest_*'
      - 'MaxPS4-iOS/Native/maxps4_fex_runtime.*'
      - 'MaxPS4-iOS/Tests/PS4*'
      - 'cmake/FEXCoreIOSLinkage.cmake'
      - 'scripts/test-ps4-system-services.sh'
      - 'scripts/test-ps4-fex-linked.sh'
      - 'scripts/run-bounded.py'
      - 'cmake/FEXCoreLinkedTests.cmake'
      - '.github/workflows/ps4-system-services.yml'
  push:
    branches: ['codex/ps4-memory-translation-contract']
    paths:
      - 'MaxPS4-iOS/Native/maxps4_ps4_*'
      - 'MaxPS4-iOS/Native/maxps4_guest_*'
      - 'MaxPS4-iOS/Native/maxps4_fex_runtime.*'
      - 'MaxPS4-iOS/Tests/PS4*'
      - 'cmake/FEXCoreIOSLinkage.cmake'
      - 'scripts/test-ps4-system-services.sh'
      - 'scripts/test-ps4-fex-linked.sh'
      - 'scripts/run-bounded.py'
      - 'cmake/FEXCoreLinkedTests.cmake'
      - '.github/workflows/ps4-system-services.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linked-fex:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            backend: simulator
          - os: ubuntu-24.04-arm
            backend: native-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned FEX runtime and upstream ARM64 instruction simulator
        timeout-minutes: 5
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Leviidev/AetherPS4.git build/aether-linked
          git -C build/aether-linked sparse-checkout set runtime/sources/fexcore-darwin
          git -C build/aether-linked checkout 3347fc13f19860855ce91b66356940989ea6b6a6
          git clone --filter=blob:none --no-checkout https://github.com/FEX-Emu/vixl.git build/aether-linked/runtime/sources/fexcore-darwin/External/vixl
          git -C build/aether-linked/runtime/sources/fexcore-darwin/External/vixl checkout 5f418449c48f6ca3ad37c47ec632f17a561c0580
      - name: Execute linked PS4 code through FEX and real libkernel services
        timeout-minutes: 12
        run: bash scripts/test-ps4-fex-linked.sh build/aether-linked build/ps4-linked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps4-linked-fex-${{ matrix.backend }}
          path: |
            build/ps4-linked/*.log
            build/ps4-linked/*.txt
            build/ps4-linked/ps4-libkernel-demo.elf
            build/ps4-linked/ps4-libkernel-combined.elf
            build/ps4-linked/Bin/maxps4-ps4-linked-test
            build/ps4-linked/orbis-bundle/**
            build/ps4-linked/playable-bundle/**
            build/ps4-linked/playable-evidence/**
  services:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-ps4-system-services.sh
  iphone-arm64-compile:
    timeout-minutes: 10
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile system services for the real iPhone ARM64 SDK
        run: |
          set -euo pipefail
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          for source in maxps4_guest_elf maxps4_ps4_libkernel maxps4_ps4_virtual_memory maxps4_ps4_threads maxps4_ps4_linker; do
            xcrun --sdk iphoneos clang++ -target arm64-apple-ios18.0 -isysroot "$sdk" \
              -std=c++17 -Wall -Wextra -Werror -pedantic -fsyntax-only \
              "MaxPS4-iOS/Native/$source.cpp"
          done
          xcrun --sdk iphoneos clang -target arm64-apple-ios18.0 -isysroot "$sdk" \
            -std=c11 -Wall -Wextra -Werror -pedantic -fsyntax-only \
            MaxPS4-iOS/Tests/PS4SystemServicesABITest.c
