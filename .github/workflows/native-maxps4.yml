name: Build Native MaxPS4 iOS

on:
  workflow_dispatch:
  push:
    branches: [ maxps4-native-clean ]

jobs:
  build-native-maxps4:
    runs-on: macos-latest
    steps:
      - name: Checkout MaxPS4
        uses: actions/checkout@v4

      - name: Prepare tools
        shell: bash
        run: |
          set -euxo pipefail
          brew install ninja protobuf xcodegen || true
          PROTOC="$(brew --prefix protobuf)/bin/protoc"
          echo "NATIVE_PROTOC=$PROTOC" >> "$GITHUB_ENV"

      - name: Restore pinned emulator core
        shell: bash
        run: |
          set -euxo pipefail
          ENGINE_ROOT="$RUNNER_TEMP/aetherps4-ios-engine"
          git clone https://github.com/Leviidev/AetherPS4.git "$ENGINE_ROOT"
          git -C "$ENGINE_ROOT" checkout 74f94b61b213fbc231b59a3917cb404cbb25e098
          git -C "$ENGINE_ROOT" submodule update --init --recursive
          echo "ENGINE_ROOT=$ENGINE_ROOT" >> "$GITHUB_ENV"

          python3 - "$ENGINE_ROOT/externals/epoll-shim/src/CMakeLists.txt" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text()
          start=s.index('include(CheckCSourceRuns)')
          ps=s.index('check_c_source_runs(',start)
          needle='ALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO)'
          pe=s.index(needle,ps)+len(needle)
          probe=s[ps:pe]
          p.write_text(s[:ps]+'if(CMAKE_SYSTEM_NAME STREQUAL "iOS")\n  set(ALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO FALSE CACHE BOOL "iOS cross-compile result" FORCE)\nelse()\n'+probe+'\nendif()'+s[pe:])
          PY

          python3 - "$ENGINE_ROOT" <<'PY'
          import sys
          from pathlib import Path
          root=Path(sys.argv[1]); patched=0
          for p in root.rglob('ImGuiFileDialog.cpp'):
              s=p.read_text(errors='ignore')
              if 'std::system(' not in s: continue
              s=s.replace('std::system(', 'MaxPS4IOSSystemUnavailable(')
              if 'static int MaxPS4IOSSystemUnavailable' not in s:
                  s='\nstatic int MaxPS4IOSSystemUnavailable(const char*) { return -1; }\n'+s
              p.write_text(s); patched+=1
          if not patched: raise SystemExit('ImGuiFileDialog patch target missing')
          PY

          python3 - "$ENGINE_ROOT/src/core/signals.cpp" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text(); inc='#include "core/ios/ios_jit_allocator.h"'
          if not s.startswith(inc+'\n'): p.write_text(inc+'\n'+s)
          PY

      - name: Build native ImGui font tool
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$ENGINE_ROOT/externals/dear_imgui/misc/fonts/binary_to_compressed_c.cpp"
          OUT="$RUNNER_TEMP/Dear_ImGui_FontEmbed"
          xcrun --sdk macosx clang++ -O2 -std=c++17 "$SRC" -o "$OUT"
          echo "IMGUI_FONT_EMBED_EXECUTABLE=$OUT" >> "$GITHUB_ENV"

      - name: Configure shadps4 iOS core
        shell: bash
        run: |
          set -euxo pipefail
          BUILD="$ENGINE_ROOT/runtime/build/shadps4-ios"
          cmake -S "$ENGINE_ROOT" -B "$BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DENABLE_SHADPS4_IOS_LIB=ON \
            -DENABLE_TESTS=OFF -DENABLE_UPDATER=OFF -DENABLE_DISCORD_RPC=OFF \
            -DENABLE_SYSTEM_VULKAN=ON \
            -DHWINFO_BATTERY=OFF -DHWINFO_DISK=OFF -DHWINFO_GPU=OFF -DHWINFO_MAINBOARD=OFF -DHWINFO_NETWORK=OFF \
            -DIMGUI_FONT_EMBED_EXECUTABLE="$IMGUI_FONT_EMBED_EXECUTABLE" \
            -DProtobuf_PROTOC_EXECUTABLE="$NATIVE_PROTOC" -DPROTOBUF_PROTOC_EXECUTABLE="$NATIVE_PROTOC"
          echo "ENGINE_BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Force native protoc
        shell: bash
        run: |
          set -euxo pipefail
          python3 - "$ENGINE_BUILD" "$NATIVE_PROTOC" <<'PY'
          import sys
          from pathlib import Path
          root=Path(sys.argv[1]); protoc=sys.argv[2]
          for p in root.rglob('*'):
              if not p.is_file(): continue
              try: s=p.read_text()
              except (UnicodeDecodeError,OSError): continue
              if 'protobuf::protoc' in s: p.write_text(s.replace('protobuf::protoc',protoc))
          PY

      - name: Build shadps4_ios
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build "$ENGINE_BUILD" --target shadps4_ios -- -v
          CORE_LIB=$(find "$ENGINE_BUILD" -type f -name 'libshadps4_ios.a' -print -quit)
          test -n "$CORE_LIB"
          echo "CORE_LIB=$CORE_LIB" >> "$GITHUB_ENV"

      - name: Generate MaxPS4 Xcode project
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/MaxPS4-iOS"
          xcodegen generate --spec project.yml
          xcodebuild -list -project MaxPS4.xcodeproj

      - name: Build independent MaxPS4 app
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/MaxPS4-iOS"

          # shadps4_ios is a static core. Link every arm64 archive produced by its
          # clean iOS CMake build, matching the upstream iOS project generator,
          # while keeping the AetherPS4 frontend completely out of MaxPS4.app.
          mapfile -t IOS_LIBS < <(find "$ENGINE_BUILD" -type f -name '*.a' ! -path '*/CMakeFiles/*' -print | sort)
          test ${#IOS_LIBS[@]} -gt 0
          LINK_ARGS='$(inherited) -ObjC -lc++ -liconv'
          for lib in "${IOS_LIBS[@]}"; do
            LINK_ARGS="$LINK_ARGS $lib"
          done
          LINK_ARGS="$LINK_ARGS -framework Metal -framework QuartzCore -framework GameController -framework CoreHaptics -framework AVFoundation -framework CoreAudio -framework AudioToolbox -framework CoreBluetooth -framework CoreMedia -framework CoreMotion"

          xcodebuild -project MaxPS4.xcodeproj -scheme MaxPS4 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MaxPS4DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            SWIFT_OBJC_BRIDGING_HEADER="$GITHUB_WORKSPACE/MaxPS4-iOS/Sources/MaxPS4-Bridging-Header.h" \
            OTHER_LDFLAGS="$LINK_ARGS" build

      - name: Validate MaxPS4 executable
        shell: bash
        run: |
          set -euxo pipefail
          APP=$(find "$RUNNER_TEMP/MaxPS4DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'MaxPS4.app' -print -quit)
          test -n "$APP"
          EXE="$APP/MaxPS4"
          test -f "$EXE"
          nm "$EXE" 2>/dev/null | grep -E 'shadps4_(init|prepare_window|run_loop|stop)'
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Package unsigned MaxPS4 IPA
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/MaxPS4.app"
          cd "$RUNNER_TEMP"
          zip -qr MaxPS4-native-unsigned.ipa Payload

      - name: Upload MaxPS4 IPA
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-native-ipa
          path: ${{ runner.temp }}/MaxPS4-native-unsigned.ipa
          if-no-files-found: error
