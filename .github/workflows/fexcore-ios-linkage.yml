name: FEXCore complete Darwin iOS linkage
on:
  workflow_dispatch:
  push:
    branches: ['codex/ps4-memory-translation-contract']
    paths:
      - 'scripts/*fexcore*'
      - 'cmake/FEXCoreIOSLinkage.cmake'
      - '.github/workflows/fexcore-ios-linkage.yml'
      - 'MaxPS4-iOS/Native/**'
      - 'MaxPS4-iOS/Tests/*FEX*'
      - 'MaxPS4-iOS/Tests/PS4LinkedELFFixture.h'
  pull_request:
    paths:
      - 'scripts/*fexcore*'
      - 'cmake/FEXCoreIOSLinkage.cmake'
      - '.github/workflows/fexcore-ios-linkage.yml'
      - 'MaxPS4-iOS/Native/**'
      - 'MaxPS4-iOS/Tests/FEXRuntimeIntegrationTest.cpp'
      - 'MaxPS4-iOS/Tests/PS4FEXLinkedExecutionTest.cpp'
      - 'MaxPS4-iOS/Tests/PS4LinkedELFFixture.h'
      - 'MaxPS4-iOS/Tests/FEXDispatcherInitPatchTest.py'
permissions:
  contents: read
jobs:
  complete-ios-link:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [ios-runtime, host-runtime]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned coherent Darwin sources and bundled dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/Leviidev/AetherPS4.git build/aether-link
          git -C build/aether-link sparse-checkout set runtime/sources/fexcore-darwin src/core/guest_cpu src/core/ios
          git -C build/aether-link checkout 3347fc13f19860855ce91b66356940989ea6b6a6
          brew install ninja
      - name: Build real complete iOS ARM64 shared library with strict linkage
        shell: bash
        run: |
          set -euo pipefail
          mode=--runtime
          if [[ '${{ matrix.platform }}' == host-runtime ]]; then mode=--host-runtime; fi
          bash scripts/build-fexcore-darwin-ios.sh build/aether-link build/fexcore-darwin-ios "$mode"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fexcore-complete-darwin-${{ matrix.platform }}
          path: |
            build/fexcore-darwin-ios/*.log
            build/fexcore-darwin-ios/*.txt
            build/fexcore-darwin-ios/compile_commands.json
            build/fexcore-darwin-ios/FEXCore/Source/libFEXCore.dylib
            build/fexcore-darwin-ios/FEXCore/Source/libFEXCore.a
            build/fexcore-darwin-ios/libMaxPS4FEXRuntime.dylib
            build/fexcore-darwin-ios/Bin/maxps4-fex-runtime-test
            build/fexcore-darwin-ios/Bin/maxps4-ps4-linked-test
            build/fexcore-darwin-ios/ps4-libkernel-demo.elf
            build/fexcore-darwin-ios/ps4-libkernel-combined.elf
