name: Build 70 MaxPS4 iOS

on:
  workflow_dispatch:
  push:
    branches: [maxps4-shadps4-direct]
    paths:
      - '.github/workflows/maxps4-build66.yml'
      - '.github/scripts/build66-patches.py'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/maxps4-ccache
          key: maxps4-ios-build70-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            maxps4-ios-ccache-${{ runner.os }}-shadps4-b3452cf6-

      - name: Run Build64 pipeline with detailed diagnostics
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/build70-python"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip pyyaml
          "$VENV/bin/python" - <<'PY'
          import os, subprocess, yaml, traceback
          from pathlib import Path

          base='37bd10e8758416cbefcde6bdfaa3824c8a98fcf7'
          raw=subprocess.check_output(['git','show',f'{base}:.github/workflows/maxps4-ipa.yml'],text=True)
          doc=yaml.safe_load(raw)
          steps=doc['jobs']['build-maxps4-ipa']['steps']
          env=os.environ.copy()
          envfile=env['GITHUB_ENV']; pathfile=env['GITHUB_PATH']
          open(envfile,'w').close(); open(pathfile,'w').close()
          env_pos=0; path_pos=0
          failed=[]

          for index, step in enumerate(steps, 1):
              name=step.get('name','') or f'unnamed step {index}'
              script=step.get('run')
              if not script:
                  continue

              print(f'\n::group::Build64 step {index}: {name}', flush=True)
              print('----- command -----', flush=True)
              print(script, flush=True)
              print('-------------------', flush=True)

              try:
                  if name == 'Configure iOS engine':
                      print('Build70: applying grouped iOS patches...', flush=True)
                      subprocess.run(['python3','.github/scripts/build66-patches.py'],env=env,check=True)

                  result=subprocess.run(
                      ['bash','-x','-e','-o','pipefail','-c',script],
                      env=env
                  )
                  print(f'Build70: step exit code = {result.returncode}', flush=True)

                  if result.returncode:
                      core=Path(env['RUNNER_TEMP'])/'build'/'libshadps4.a'
                      if name == 'Build iOS engine and collect diagnostics' and core.is_file():
                          print(f'Build70: engine command returned {result.returncode}, but {core} exists ({core.stat().st_size} bytes); continuing.',flush=True)
                      else:
                          failed.append((index,name,result.returncode))
                          print(f'::error title=Build70 failure::Build64 step {index} "{name}" failed with exit code {result.returncode}',flush=True)
                          raise subprocess.CalledProcessError(result.returncode, ['bash','-x','-e','-o','pipefail','-c',script])

                  with open(envfile) as f:
                      f.seek(env_pos)
                      for line in f:
                          line=line.rstrip('\n')
                          if '=' in line:
                              k,v=line.split('=',1); env[k]=v
                      env_pos=f.tell()

                  with open(pathfile) as f:
                      f.seek(path_pos)
                      new=[x.rstrip('\n') for x in f if x.rstrip('\n')]
                      path_pos=f.tell()
                  if new:
                      env['PATH']=':'.join(new)+':'+env.get('PATH','')

              except Exception:
                  print('Build70: exception traceback:', flush=True)
                  traceback.print_exc()
                  raise
              finally:
                  print('::endgroup::', flush=True)

          print('\nBuild70: all runnable Build64 steps completed.', flush=True)
          PY

      - name: Build70 failure summary
        if: failure()
        shell: bash
        run: |
          echo "Build 70 failed. The previous step now prints each Build64 sub-step, its command trace, exit code, and a GitHub ::error marker."
          echo "Diagnostic files currently present:"
          find "$RUNNER_TEMP" -maxdepth 3 -type f \( -name '*.log' -o -name '*.txt' \) -print 2>/dev/null | sort || true

      - name: Upload engine diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build70-diagnostics
          path: |
            ${{ runner.temp }}/shadps4-cmake-configure.log
            ${{ runner.temp }}/shadps4-build.log
            ${{ runner.temp }}/shadps4-libs.txt
          if-no-files-found: ignore

      - name: Upload MaxPS4 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-unsigned-IPA
          path: ${{ runner.temp }}/MaxPS4-unsigned.ipa
          if-no-files-found: error
