name: Build 72 MaxPS4 iOS

on:
  workflow_dispatch:
  push:
    branches: [maxps4-shadps4-direct]
    paths:
      - '.github/workflows/maxps4-build66.yml'
      - '.github/scripts/build66-patches.py'
      - 'MaxPS4-iOS/**'
      - 'LICENSE'
      - 'NOTICE.md'
      - 'SOURCE.md'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/maxps4-ccache
          key: maxps4-ios-build72-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            maxps4-ios-ccache-${{ runner.os }}-shadps4-b3452cf6-

      - name: Run Build64 pipeline with persistent diagnostics
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/build72-python"
          LOGDIR="$RUNNER_TEMP/build72-logs"
          mkdir -p "$LOGDIR"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip pyyaml
          "$VENV/bin/python" - <<'PY'
          import os, subprocess, yaml, traceback
          from pathlib import Path
          base='37bd10e8758416cbefcde6bdfaa3824c8a98fcf7'
          raw=subprocess.check_output(['git','show',f'{base}:.github/workflows/maxps4-ipa.yml'],text=True)
          doc=yaml.safe_load(raw)
          steps=doc['jobs']['build-maxps4-ipa']['steps']
          env=os.environ.copy(); envfile=env['GITHUB_ENV']; pathfile=env['GITHUB_PATH']
          logdir=Path(env['RUNNER_TEMP'])/'build72-logs'
          open(envfile,'w').close(); open(pathfile,'w').close(); env_pos=0; path_pos=0
          for index, step in enumerate(steps, 1):
              name=step.get('name','') or f'unnamed step {index}'; script=step.get('run')
              if not script: continue
              safe=''.join(c if c.isalnum() else '-' for c in name).strip('-')[:60]
              logfile=logdir/f'{index:02d}-{safe}.log'
              print(f'\n::group::Build64 step {index}: {name}',flush=True)
              try:
                  if name == 'Configure iOS engine':
                      subprocess.run(['python3','.github/scripts/build66-patches.py'],env=env,check=True)
                  with logfile.open('w') as out:
                      result=subprocess.run(['bash','-x','-e','-o','pipefail','-c',script],env=env,stdout=out,stderr=subprocess.STDOUT)
                  print(logfile.read_text(errors='replace'),flush=True)
                  if result.returncode:
                      core=Path(env['RUNNER_TEMP'])/'build'/'libshadps4.a'
                      if name == 'Build iOS engine and collect diagnostics' and core.is_file():
                          print(f'Build72: engine returned {result.returncode}, but {core} exists; continuing.',flush=True)
                      else:
                          (logdir/'FAILURE.txt').write_text(f'Build64 step {index}: {name}\nexit code: {result.returncode}\nlog: {logfile.name}\n')
                          print(f'::error title=Build72 failure::Build64 step {index} "{name}" failed with exit code {result.returncode}',flush=True)
                          raise subprocess.CalledProcessError(result.returncode, script)
                  with open(envfile) as f:
                      f.seek(env_pos)
                      for line in f:
                          line=line.rstrip('\n')
                          if '=' in line:
                              k,v=line.split('=',1); env[k]=v
                      env_pos=f.tell()
                  with open(pathfile) as f:
                      f.seek(path_pos); new=[x.rstrip('\n') for x in f if x.rstrip('\n')]; path_pos=f.tell()
                  if new: env['PATH']=':'.join(new)+':'+env.get('PATH','')
              except Exception:
                  traceback.print_exc(); raise
              finally:
                  print('::endgroup::',flush=True)
          PY

      - name: Package GPL corresponding source
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/MaxPS4-GPL-Source"
          rm -rf "$OUT"
          mkdir -p "$OUT/maxps4" "$OUT/shadps4"
          git archive --format=tar HEAD | tar -xf - -C "$OUT/maxps4"
          SHAD="$RUNNER_TEMP/shadps4"
          test -d "$SHAD/.git"
          git -C "$SHAD" rev-parse HEAD > "$OUT/SHADPS4_COMMIT.txt"
          cp -R "$SHAD"/. "$OUT/shadps4/"
          rm -rf "$OUT/shadps4/.git"
          cp LICENSE "$OUT/LICENSE-MaxPS4-GPL-2.0.txt"
          cp NOTICE.md "$OUT/NOTICE.md"
          cp SOURCE.md "$OUT/SOURCE.md"
          printf 'MaxPS4 commit: %s\nGitHub run: %s\nRun attempt: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$OUT/BUILD-SOURCE-IDENTITY.txt"
          ditto -c -k --sequesterRsrc --keepParent "$OUT" "$RUNNER_TEMP/MaxPS4-GPL-Corresponding-Source.zip"

      - name: Upload Build72 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build72-diagnostics
          path: |
            ${{ runner.temp }}/build72-logs/
            ${{ runner.temp }}/shadps4-build.log
            ${{ runner.temp }}/shadps4-cmake-configure.log
            ${{ runner.temp }}/shadps4-libs.txt
          if-no-files-found: ignore

      - name: Upload GPL corresponding source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-GPL-Corresponding-Source
          path: ${{ runner.temp }}/MaxPS4-GPL-Corresponding-Source.zip
          if-no-files-found: error

      - name: Upload MaxPS4 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPS4-unsigned-IPA
          path: ${{ runner.temp }}/MaxPS4-unsigned.ipa
          if-no-files-found: error
